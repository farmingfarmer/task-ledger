 conf}\n\n    # The judge had its chance and failed -- unavailable, unsure, or\n    # saying \"different\" about a 0.94 match, which a CPU-local model\n    # does routinely. Above ask_floor that failure goes to a person as\n    # a proposal that admits its basis, instead of holding the signal\n    # forever. \"ask\" is carried so nothing downstream mistakes this for\n    # a judged link: auto-apply must never fire on wording alone, and\n    # closures and cross-owner matches never take this path at all.\n    # Closures ARE allowed to ask. never_auto exists so embeddings\n    # alone can never close work -- and it still means that: no\n    # auto-link at any similarity. But an ask closes nothing; it puts\n    # \"was this finished?\" in front of the task's owner, and the\n    # closure gate downstream still demands the speaker be the owner\n    # or the claim be corroborated. Excluding closures here left \"I\n    # completed it\", said by the owner, about their own board, held\n    # forever at 0.84 -- the single most valuable sentence this system\n    # hears, and the one it was refusing to relay.\n    ask = th.get(\"ask_floor\")\n    if (ask is not None and best_sim >= ask and not cross_owner):\n        return {\"kind\": \"linked\", \"task_id\": best[\"task_id\"],\n                \"similarity\": best_sim,\n                \"note\": \"matched on wording alone ({0:.2f}); no judge \"\n                        \"verdict\".format(best_sim),\n                \"judge_conf\": None, \"ask\": True}\n\n    note = \"closest match {0} ({1:.2f}) below merge threshold\".format(\n        best[\"task_id\"], max(best_sim, 0.0))\n    # closest_task_id, NOT task_id: the gates resolve task_id into a\n    # live target and would treat a near-miss as a link. This is for\n    # the held report only -- naming what a held signal almost was.\n    return {\"kind\": \"new\", \"task_id\": None, \"similarity\": best_sim,\n            \"note\": note, \"judge_conf\": None,\n# ... 1 more lines", "walk": [["Compare each claim to every open task", "text similarity places the claim on a confidence scale"], ["Route by band: link, judge, or new", "certainty links, ambiguity gets judged, novelty creates"], ["Force the judge for anything dangerous", "completions and cross-person claims never auto-link regardless of score"]]}, {"symbol": "build_signal_judge_messages", "file": "policy/judge_prompts.py", "blurb": "The judge sees top-3 candidates and must name a deciding_factor -- the field a human reads to decide whether to trust local judging at all.", "code": "def build_signal_judge_messages(signal, candidates, top_k=3):\n    \"\"\"Build the messages array for a signal->task judge call.\n\n    signal: dict with keys signal_type, title, description, attribution,\n            evidence_excerpts (list of str)\n    candidates: list of dicts with keys task_id, title, status, owner,\n            similarity, description, aliases (list), last_activity\n    Returns list of {\"role\": ..., \"content\": ...} dicts.\n    \"\"\"\n    excerpts = \"\\n\".join(\n        \"  - {0}\".format(e) for e in signal.get(\"evidence_excerpts\", [])\n    ) or \"  (none)\"\n    cand_blocks = \"\\n\\n\".join(\n        CANDIDATE_BLOCK_TEMPLATE.format(\n            task_id=c[\"task_id\"],\n            title=c[\"title\"],\n            status=c.get(\"status\", \"unknown\"),\n            owner=c.get(\"owner\", \"unowned\"),\n            similarity=c.get(\"similarity\", 0.0),\n            description=c.get(\"description\") or \"(none)\",\n            aliases=\", \".join(c.get(\"aliases\", [])) or \"(none)\",\n            last_activity=c.get(\"last_activity\", \"unknown\"),\n        )\n        for c in candidates[:top_k]\n    )\n    return [\n        {\n            \"role\": \"system\",\n            \"content\": SIGNAL_TASK_JUDGE_SYSTEM.format(top_k=top_k),\n        },\n        {\n            \"role\": \"user\",\n            \"content\": SIGNAL_TASK_JUDGE_USER.format(\n                signal_type=signal[\"signal_type\"],\n                signal_title=signal[\"title\"],\n                signal_description=signal.get(\"description\") or \"(none)\",\n                signal_attribution=signal.get(\"attribution\", \"unknown\"),\n                evidence_excerpts=excerpts,\n                candidates_block=cand_blocks,\n            ),\n        },\n    ]", "walk": [["Show the judge the claim and its top candidates", "a narrow question gets a reliable answer from a small model"], ["Demand a deciding factor in the verdict", "the stated reason is what a human audits to decide whether to trust local judging at all"]]}, {"symbol": "parse_judge_response", "file": "policy/judge_prompts.py", "blurb": "Strict parsing; anything malformed becomes 'distinct', which downstream means HELD. The failure mode of a bad judge is delay, never a wrong merge.", "code": "def parse_judge_response(raw_text):\n    \"\"\"Parse and validate a judge response. Returns dict or raises ValueError.\n\n    Deliberately strict: a judge that returns prose or a malformed verdict is\n    treated as verdict=distinct by the caller (fail toward no-match), and the\n    raw text is logged for prompt regression review.\n    \"\"\"\n    text = raw_text.strip()\n    if text.startswith(\"```\"):\n        text = text.strip(\"`\")\n        if text.startswith(\"json\"):\n            text = text[4:]\n        text = text.strip()\n    obj = json.loads(text)\n    verdict = obj.get(\"verdict\")\n    if verdict not in (\"same_task\", \"subtask_of\", \"related\", \"distinct\"):\n        raise ValueError(\"invalid verdict: {0!r}\".format(verdict))\n    conf = obj.get(\"confidence\")\n    if not isinstance(conf, (int, float)) or not (0.0 <= conf <= 1.0):\n        raise ValueError(\"invalid confidence: {0!r}\".format(conf))\n    if verdict == \"distinct\" and obj.get(\"matched_task_id\") is not None:\n        raise ValueError(\"distinct verdict must carry null matched_task_id\")\n    if verdict in (\"same_task\", \"subtask_of\") and not obj.get(\"matched_task_id\"):\n        raise ValueError(\"{0} verdict requires matched_task_id\".format(verdict))\n    if not obj.get(\"deciding_factor\"):\n        raise ValueError(\"deciding_factor is required\")\n    return obj", "walk": [["Parse the verdict strictly", "anything malformed becomes 'no match'"], ["Make confusion mean delay", "a held claim waits for a better day; a wrong merge would corrupt the board"]]}]}, {"name": "Op gates", "file": "reconciler/reconciler.py", "components": [{"symbol": "Reconciler._gate_closure", "blurb": "The strictest path: owner self-claim on one source, anyone else needs independent corroboration, sub-day tasks hold even owner claims. A closure that fails to match is held, not consumed -- a fix found when the live loop nearly ate a real completion.", "file": "reconciler/reconciler.py", "code": "def _gate_closure(self, sig, match, task, all_signals, report):\n    rules = self.policy[\"signal_rules\"][sig[\"signal_type\"]]\n    th = self.policy[\"thresholds\"]\n    op = (\"complete_task\" if sig[\"signal_type\"] == \"completion_claim\"\n          else \"cancel_task\")\n    if task is None:\n        # A closure that failed to match is far more likely a matching\n        # failure than a real new-work signal; hold it for a retry\n        # rather than consuming it into oblivion.\n        return \"held\"\n    if task[\"status\"] in (\"completed\", \"cancelled\"):\n        return None   # already there; silence, not a duplicate card\n    strict_ok = (match[\"kind\"] == \"linked\"\n                 and (match[\"judge_conf\"] is None\n                      or match[\"judge_conf\"] >= 0.85))\n    if not strict_ok:\n        return \"held\"\n    # The policy has said \"speaker is NOT owner -> require\n    # corroboration\" since it was written, but the code only ever\n    # consulted owner_candidates -- the extractor's guess about who\n    # the work is FOR -- and never author_ref, which IS the speaker.\n    # An owner saying \"I finished it\" in a sentence the extractor\n    # didn't decorate with owner_candidates was treated as an\n    # unattributed rumor about their own task.\n    owner_claims = (\n        sig.get(\"author_ref\") is not None\n        and sig.get(\"author_ref\") == task.get(\"owner_ref\")) or any(\n        c[\"basis\"] in (\"self_reference\", \"explicit_assignment\")\n        and c[\"person_ref\"] == task.get(\"owner_ref\")\n        for c in sig.get(\"owner_candidates\") or [])\n    # There used to be a \"young task\" guard here: an owner's claim on\n    # a task less than a day old demanded corroboration anyway. It\n    # shipped in the original commit with no comment and no test, and\n    # it keyed on the wrong age. The register recovers work that was\n    # mentioned weeks before anyone tracked it, so the task RECORD is\n    # born long after the work -- and the completion claim, waiting in\n    # the pool the whole time, arrives the moment the record exists.\n    # That is the pipeline succeeding, not one meeting's churn. On the\n    # first rebuilt ledger the guard held the owner's own \"I finished\n    # it\" on every task of theirs, because every record was hours old.\n    # Nothing closes without a person regardless: the claim only ever\n    # becomes a card on the owner's queue.\n    if owner_claims:\n        pass   # the owner's own claim earns the owner's own question\n    else:\n        n_independent = _independent_support(sig, all_signals)\n        if n_independent < self.policy[\"corroboration\"][\"independent_source_min\"]:\n            return \"held\"\n    rationale = (\"\\u201c{0}\\u201d was reported {1}.\".format(\n        task[\"title\"],\n        \"finished\" if op == \"complete_task\" else \"called off\"))\n    return self._mk(sig, op, task[\"task_id\"], {\n        \"kind\": op, \"completion_note\": None,\n    }, rationale)", "walk": [["Ask who is claiming the completion", "the owner saying 'done' and a bystander saying 'I think it's done' are different evidence"], ["Demand a second independent source for hearsay", "two mentions in one thread is one source; the check is on distinct origins"], ["Hold whatever fails", "held claims stay pooled -- a fix added after the live loop nearly swallowed a real completion"]]}, {"symbol": "Reconciler._gate_assignment", "blurb": "The attribution ladder as code: explicit reassigns, self-claims on owned tasks raise competing_owner conflicts, inferred never proposes.", "file": "reconciler/reconciler.py", "code": "def _gate_assignment(self, sig, match, task, report):\n    cands = sig.get(\"owner_candidates\") or []\n    best = max(cands, key=lambda c: c[\"confidence\"]) if cands else None\n    if best is None:\n        return None\n    if match[\"kind\"] == \"new\":\n        return self._mk_create(sig, match, owner_ref=best[\"person_ref\"])\n    if task is None:\n        return self._hold_or_expire(sig, report, \"no_open_target\")\n    if best[\"basis\"] == \"explicit_assignment\":\n        if task.get(\"owner_ref\") == best[\"person_ref\"]:\n            return None   # already theirs; nothing to propose\n        return self._mk(sig, \"reassign\", task[\"task_id\"], {\n            \"kind\": \"reassign\",\n            \"from_owner_ref\": task.get(\"owner_ref\"),\n            \"to_owner_ref\": best[\"person_ref\"],\n            \"basis\": \"explicit_assignment\",\n        }, \"\\u201c{0}\\u201d was assigned to a new owner in discussion.\"\n           .format(task[\"title\"]))\n    if best[\"basis\"] == \"self_reference\":\n        if task.get(\"owner_ref\") is None:\n            return self._mk(sig, \"reassign\", task[\"task_id\"], {\n                \"kind\": \"reassign\", \"from_owner_ref\": None,\n                \"to_owner_ref\": best[\"person_ref\"],\n                \"basis\": \"self_reference\",\n            }, \"\\u201c{0}\\u201d was claimed by its speaker; it currently \"\n               \"has no owner.\".format(task[\"title\"]))\n        if task[\"owner_ref\"] != best[\"person_ref\"]:\n            p = self._mk(sig, \"reassign\", task[\"task_id\"], {\n                \"kind\": \"reassign\",\n                \"from_owner_ref\": task[\"owner_ref\"],\n                \"to_owner_ref\": best[\"person_ref\"],\n                \"basis\": \"self_reference\",\n            }, \"Someone claimed \\u201c{0}\\u201d, which already has an \"\n               \"owner.\".format(task[\"title\"]))\n            p[\"conflict\"] = {\"type\": \"competing_owner\",\n                             \"detail\": \"Task is owned by {0}; a \"\n                             \"self-claim came from {1}.\".format(\n                                 task[\"owner_ref\"], best[\"person_ref\"])}\n            return p\n    return None   # inferred: annotation territory, never a proposal", "walk": [["Walk the attribution ladder", "explicit assignment reassigns; self-claims on owned work raise a conflict; inferred never proposes"], ["Prefer a flagged conflict over a silent guess", "competing owners is information for the human, not a coin flip for the code"]]}]}, {"name": "Candidate register", "file": "reconciler/reconciler.py", "components": [{"symbol": "Reconciler._promote_candidates", "blurb": "A mention that matched nothing used to be discarded -- 87 of 134 signals on the first real corpus, every reference to work no board had heard of, deleted. They accumulate instead, and corroboration decides -- breadth OR persistence: two people raised it, or it came up three times. Demanding both promoted 4 of 92 on real data, because a status round-robin rarely gives a second speaker. Promotion yields a PROPOSAL, never a board fact.", "file": "reconciler/reconciler.py", "code": "def _promote_candidates(self, report):\n    \"\"\"Corroborated candidates become proposals -- never board facts.\n\n    Corroboration is breadth OR persistence under mode 'any': two\n    people raised it, or it came up three times. Demanding both\n    promoted 4 of 92 on the first real corpus, because a status\n    round-robin rarely produces a second speaker -- the person who\n    mentions something four times is usually the one who owns it.\n    \"\"\"\n    rule = self.policy[\"candidate_promotion\"]\n    out = []\n    # Why nothing promoted is as much a result as what did. \"0 promoted\"\n    # beside \"15 candidate(s)\" is indistinguishable between a bar nothing\n    # reached, a bar reached by cards nobody can cite, and a policy file\n    # whose edit never saved -- three very different problems that cost a\n    # day to tell apart by hand. So the assessment is reported: the bar in\n    # force, how many fell short of it, how many cleared it and were held\n    # back as uncitable, and the best corroboration actually seen.\n    assessed = short = uncitable = closure_only = 0\n    best_sightings = best_speakers = 0\n    for c in self._candidates:\n        fresh = c[\"_new_sightings\"]\n        # Assessed every run, not only when mentioned again. Skipping\n        # untouched candidates meant a relaxed promotion rule changed\n        # nothing until somebody happened to say the words once more --\n        # 92 candidates sat unre-examined through a policy change that\n        # was written specifically to promote them.\n        sightings = (c.get(\"sightings\") or 0) + len(fresh)\n        speakers = set(s.get(\"author_ref\") for s in fresh\n                       if s.get(\"author_ref\"))\n        n_speakers = max(c.get(\"speakers\") or 0, 0) + len(\n            speakers - {None})\n        assessed += 1\n        best_sightings = max(best_sightings, sightings)\n        best_speakers = max(best_speakers, n_speakers)\n        persistent = sightings >= rule[\"min_sightings\"]\n        broad = n_speakers >= rule[\"min_distinct_speakers\"]\n        enough = (persistent or broad\n                  if rule.get(\"mode\", \"all\") == \"any\"\n                  else persistent and broad)\n        if not enough:\n            short += 1\n            continue\n        # Cite the sighting we have in hand; the count is what earned it.\n        # A card with no evidence cannot be reviewed -- there is nothing\n        # to trace back to -- so an unciteable candidate keeps waiting\n        # rather than becoming a proposal nobody can check.\n        citeable = [s for s in fresh if s.get(\"evidence\")]\n        if not citeable and (c.get(\"lead\") or {}).get(\"evidence\"):\n            citeable = [c[\"lead\"]]   # carried from an earlier sighting\n        if not citeable:\n            uncitable += 1\n            continue\n        # Prefer evidence that names work to DO. A create proposal\n        # asserts \"this is work\"; a closure claim asserts the opposite,\n        # that some work is over. Once every signal type could register\n        # a candidate, \"I resolved Brittney's access issue\" promoted as\n        # a new open task -- the ledger recording finished work as\n        # outstanding, which is worse than not recording it. And it\n        # cannot be honestly recorded the other way either:\n        # CreateTaskPayload.status is proposed|in_progress|blocked by\n        # contract, so a create can never say \"already done\".\n        #\n        # So closure claims corroborate but do not, alone, propose. The\n        # candidate stays registered and its sightings keep counting; if\n        # anything ever names the work as work, that promotes and the\n        # closure claim is then a status change against a real task,\n        # which is what it always was.\n        wanted = [s for s in citeable\n                  if s.get(\"signal_type\") not in CLOSURE_TYPES]\n        if not wanted:\n            closure_only += 1\n            report[\"dropped\"].append(\n                {\"signal_id\": citeable[-1].get(\"signal_id\"),\n                 \"reason\": \"closure_claim_is_not_new_work\"})\n            continue\n        lead = wanted[-1]\n        # A create carries the state the evidence actually described.\n        # \"I am working on the synth kit project\" proposed a task in\n        # 'proposed', which reads as untouched work nobody has picked\n        # up -- the one thing the sentence rules out.\n        status = \"proposed\"\n        said = lead.get(\"status_signal\")\n        if (lead.get(\"signal_type\") == \"status_update\"\n                and said in (\"in_progress\", \"blocked\")):\n            status = said\n        p = self._mk(lead, \"create_task\", None, {\n            \"kind\": \"create_task\",\n            \"title\": c[\"title\"],\n            \"description\": lead.get(\"description\"),\n# ... 27 more lines", "walk": [["Most of what a meeting says about work is a passing mention", "and a mention that matched no task was thrown away, so the ledger could only ever learn about work phrased as an assignment on a day somebody happened to be reviewing"], ["But one mention is not a task either", "a card per sighting is how a queue becomes unusable, which is why it was discarded in the first place"], ["So it waits to be corroborated, in either of two ways", "two people raised it, or one person kept raising it -- requiring both promoted four of ninety-two on real data, because in a status round-robin the person who mentions work is the person who owns it"], ["And what it earns is a place in a packet", "not a place on the board: the human decision is exactly where it was"]]}, {"symbol": "Reconciler._split_auto_apply", "blurb": "The one place the human gate opens, and off by default. A status update in your own words about your own task on your own board, forward, auto-linked, applies itself and leaves the queue -- padding a review list with things needing no person is how it stops being read. Every such event is actor_type='auto_applied' forever, so how much of a board nobody confirmed stays a countable question.", "file": "reconciler/reconciler.py", "code": "def _split_auto_apply(self, proposals, user_ref, tasks, report):\n    \"\"\"Peel off the proposals that will apply themselves.\n\n    They leave the packet entirely rather than appearing with an\n    \"already done\" marker: a review queue is a list of things needing a\n    person, and padding it with things that do not is how it stops\n    being read. What replaces the card is a line in the poke saying\n    what happened, with an undo.\n\n    Every condition is checked here rather than trusted from the gate,\n    because the gate's job is \"is this a defensible proposal\" and this\n    one is \"may it skip a human entirely\", which is a higher bar.\n    \"\"\"\n    cfg = self.policy.get(\"auto_apply\") or {}\n    if not cfg.get(\"enabled\"):\n        return proposals\n    req = set(cfg.get(\"require\") or [])\n    keep, auto = [], []\n    for p in proposals:\n        sources = p.get(\"source_signals\") or []\n        unanimous = bool(sources) and all(\n            sid in self._auto_ok for sid in sources)\n        if not (unanimous\n                and self._auto_eligible(p, user_ref, tasks, cfg, req)):\n            keep.append(p)\n            continue\n        auto.append(p)\n        report[\"auto_applied\"].append({\n            \"proposal_id\": p[\"proposal_id\"],\n            \"op\": p[\"op\"],\n            \"target_task_id\": p.get(\"target_task_id\"),\n            \"payload\": p[\"payload\"],\n            \"source_signals\": p.get(\"source_signals\") or [],\n            \"rationale\": p.get(\"rationale\"),\n        })\n    return keep", "walk": [["Confirming your own words is friction with no judgement in it", "and friction is what makes a queue go unread, which costs more than the thing the confirmation was protecting"], ["So one narrow class applies itself", "your status, your task, your board, forward only, and only where the matcher did not need an LLM to decide which task it was -- never a create, a completion, or anyone else's work"], ["And it is labelled forever, not hidden", "actor_type='auto_applied' rather than 'system', so the board can always be asked how much of it nobody approved, and the poke offers to put every one of them back"]]}, {"symbol": "Reconciler._hold_or_expire", "blurb": "Progress reported on work nobody has accepted yet has no target, and every gate but closure used to consume it into oblivion. It waits for its task instead, and past the corroboration window expires with a reason -- a countable fact rather than a silent one.", "file": "reconciler/reconciler.py", "code": "def _hold_or_expire(self, sig, report, why):\n    \"\"\"A signal whose target does not exist yet waits for it.\n\n    The closure gate already reasoned this way -- a claim that failed to\n    match is far more likely a matching failure than nothing at all --\n    and every other type used to do the opposite, consuming the signal\n    into oblivion. \"The migration is blocked\" arriving before anyone has\n    accepted the migration as a task was simply deleted.\n\n    Waiting is not free, so it ends: past corroboration.window_days the\n    signal is dropped with the reason naming what it waited for, which\n    is a countable fact rather than a silent one.\n    \"\"\"\n    # Register it before deciding whether to keep waiting. A signal\n    # whose target does not exist is, by definition, naming work on\n    # nobody's board -- which is exactly what the candidate register is\n    # for, and until now only task_mention reached it. Every other type\n    # held and then expired, so \"I finished the proof of concept\" about\n    # untracked work left no trace at all, while \"the proof of concept\"\n    # left one. That is backwards: describing progress on work is\n    # stronger evidence the work is real than merely naming it.\n    #\n    # Additive on purpose -- the hold and the expiry are unchanged, so\n    # if the task does appear the update still applies. This only stops\n    # the mention being lost. Held signals are re-gated on every tick,\n    # so this runs repeatedly for the same signal; write_candidate_events\n    # writes one sighting per signal, or a single remark would look like\n    # corroboration by the third tick.\n    self._sight_candidate(sig, report)\n    window = self.policy[\"corroboration\"][\"window_days\"]\n    age = sig.get(\"pooled_days\")\n    if age is not None and age > window:\n        report[\"dropped\"].append({\"signal_id\": sig[\"signal_id\"],\n                                  \"reason\": \"expired_\" + why})\n        return None\n    return \"held\"", "walk": [["A blocker needs a task to block", "and on a cold ledger there is none, so the first real corpus reported progress on work that had not been accepted yet and every word of it was consumed and dropped"], ["Holding costs nothing; deleting costs the claim", "the signal stays pooled until its task exists, which is exactly what the pool was built to allow"], ["Waiting still ends", "past the corroboration window it expires with a named reason, because a pool that only grows is its own failure"]]}]}, {"name": "Aggregate & write", "file": "reconciler/reconciler.py", "components": [{"symbol": "Reconciler._aggregate", "blurb": "Same-op proposals combine noisy-OR under a cap; per-op floors filter. proposal_id is salted with the run -- unsalted ids collided across packets in live testing and silently wrote zero proposals.", "file": "reconciler/reconciler.py", "code": "def _aggregate(self, draft, report, run_salt=\"\"):\n    floors = self.policy[\"per_op_confidence_floor\"]\n    cap = self.policy[\"aggregation\"][\"noisy_or_cap\"]\n    grouped = {}\n    for p in draft:\n        key = (p[\"op\"], p[\"target_task_id\"],\n               json.dumps(p[\"payload\"], sort_keys=True)\n               if p[\"op\"] in (\"create_task\", \"add_subtask\")\n               else json.dumps({k: p[\"payload\"].get(k)\n                                for k in (\"to_status\", \"to_deadline\",\n                                          \"to_owner_ref\", \"blocker_id\",\n                                          \"description\")},\n                               sort_keys=True))\n        if key not in grouped:\n            grouped[key] = p\n        else:\n            g = grouped[key]\n            combined = 1.0 - (1.0 - g[\"confidence\"]) * (1.0 - p[\"confidence\"])\n            g[\"confidence\"] = min(cap, combined)\n            g[\"source_signals\"] = sorted(\n                set(g[\"source_signals\"]) | set(p[\"source_signals\"]))\n            seen = {e[\"resource_id\"] for e in g[\"evidence\"]}\n            g[\"evidence\"].extend(e for e in p[\"evidence\"]\n                                 if e[\"resource_id\"] not in seen)\n            if p[\"conflict\"] and not g[\"conflict\"]:\n                g[\"conflict\"] = p[\"conflict\"]\n    out = []\n    for p in grouped.values():\n        if p[\"confidence\"] < floors.get(p[\"op\"], 0.6):\n            report[\"dropped\"].append(\n                {\"signal_id\": \",\".join(p[\"source_signals\"]),\n                 \"reason\": \"below_op_floor:{0}\".format(p[\"op\"])})\n            continue\n        p[\"confidence\"] = round(min(p[\"confidence\"], 1.0), 3)\n        p[\"proposal_id\"] = _sha(run_salt, p[\"op\"], p[\"target_task_id\"],\n                                *p[\"source_signals\"])\n        out.append(p)\n    out.sort(key=lambda p: (0 if p[\"conflict\"] else 1, -p[\"confidence\"]))\n    return out", "walk": [["Combine same-change proposals", "three status hints merge into one proposal with pooled confidence"], ["Stamp identity with the run", "unsalted proposal ids once collided across packets and silently wrote nothing -- the salt is the scar"]]}, {"symbol": "supersede_open_packets", "file": "reconciler/board_io_pg.py", "blurb": "At most one open packet per person, enforced at the storage layer so EVERY writer inherits it. Its first live sweep cleared four stale packets including two invisible classes of debris.", "code": "def supersede_open_packets(cur, user_ref, run_id, exclude_packet_id=None):\n    \"\"\"Mark every open packet for the user superseded and return the signals\n    of their undecided proposals to the pool -- the orchestrator's supersede\n    semantics, enforced at the storage layer so every writer inherits them.\n    Returns (superseded_packet_ids, returned_signal_count).\"\"\"\n    cur.execute(\"\"\"\n        WITH latest AS (\n          SELECT DISTINCT ON (packet_id) packet_id, state\n          FROM packet_state_events ORDER BY packet_id, event_id DESC)\n        SELECT rp.packet_id FROM review_packets rp\n        JOIN latest l USING (packet_id)\n        WHERE rp.user_ref = %s\n          AND l.state IN ('draft','delivered','partially_decided')\n          AND rp.packet_id <> COALESCE(%s, '')\"\"\",\n        (user_ref, exclude_packet_id))\n    stale = [r[0] for r in cur.fetchall()]\n    returned = 0\n    for pid in stale:\n        cur.execute(\"\"\"\n            INSERT INTO signal_pool_events (signal_id, user_ref, event,\n                                            run_id)\n            SELECT DISTINCT ps.signal_id, %s, 'returned', %s\n            FROM proposals p\n            JOIN proposal_signals ps USING (proposal_id)\n            LEFT JOIN decisions d ON d.proposal_id = p.proposal_id\n            WHERE p.packet_id = %s AND d.decision_id IS NULL\"\"\",\n            (user_ref, run_id, pid))\n        returned += cur.rowcount\n        cur.execute(\"INSERT INTO packet_state_events (packet_id, state) \"\n                    \"VALUES (%s, 'superseded')\", (pid,))\n    return stale, returned", "walk": [["Retire every open packet for this person", "at most one review awaits anyone, ever"], ["Return undecided claims to the pool", "superseded is not lost; the claims queue for the next round"]]}, {"symbol": "write_packet", "file": "reconciler/board_io_pg.py", "blurb": "One transaction: supersede, insert, mark signals taken, apply alias annotations. Empty packets insert nothing -- silence is a valid output.", "code": "def write_packet(dsn, packet, consumed_signal_ids, annotations,\n                 run_id, expires_hours=48, report=None):\n    \"\"\"Persists the packet and its side effects atomically. Supersedes any\n    open packets for the user first (their undecided signals rejoin the\n    pool). Packets with zero proposals are NOT inserted -- silence is the\n    output -- but the supersede still runs, matching the orchestrator's\n    tick order. Returns counts.\"\"\"\n    conn = psycopg2.connect(dsn)\n    out = {\"proposals\": 0, \"taken\": 0, \"aliases\": 0,\n           \"superseded\": [], \"returned_signals\": 0, \"candidate_events\": 0,\n           \"auto_applied\": 0}\n    try:\n        with conn:\n            with conn.cursor() as cur:\n                stale, returned = supersede_open_packets(\n                    cur, packet[\"user_ref\"], run_id,\n                    exclude_packet_id=packet[\"packet_id\"])\n                out[\"superseded\"] = stale\n                out[\"returned_signals\"] = returned\n                if report is not None:\n                    out[\"candidate_events\"] = write_candidate_events(\n                        cur, packet[\"user_ref\"], report, run_id)\n                # Aliases land here, ahead of every early return below.\n                # They used to be written after the packet insert, so a run\n                # that proposed nothing -- the common case, since most\n                # signals are mentions -- taught the matcher nothing at all,\n                # and an idempotent replay skipped them too. An alias is not\n                # a board fact and needs no decision: it is a name somebody\n                # used for work that already exists, and knowing it makes\n                # the NEXT meeting match better.\n                out[\"aliases\"] += apply_aliases(\n                    cur, packet[\"user_ref\"], annotations)\n                # Auto-applied changes land here too, ahead of the empty\n                # packet return: a run whose only output applied itself\n                # still has to actually apply it.\n                if report is not None:\n                    out[\"auto_applied\"] = apply_auto(\n                        cur, packet[\"user_ref\"], report)\n                    for a in report.get(\"auto_applied\") or []:\n                        for sid in a.get(\"source_signals\") or []:\n                            cur.execute(\"\"\"\n                                INSERT INTO signal_pool_events\n                                  (signal_id, user_ref, event, run_id)\n                                VALUES (%s,%s,'taken',%s)\"\"\",\n                                (sid, packet[\"user_ref\"], run_id))\n                if not packet[\"proposals\"]:\n                    for sid in consumed_signal_ids:\n                        cur.execute(\"\"\"\n                            INSERT INTO signal_pool_events\n                              (signal_id, user_ref, event, run_id)\n                            VALUES (%s,%s,'taken',%s)\"\"\",\n                            (sid, packet[\"user_ref\"], run_id))\n                        out[\"taken\"] += 1\n                    return out\n                cur.execute(\"\"\"\n                    INSERT INTO review_packets\n                      (packet_id, user_ref, cadence_run_id, board_version,\n                       generated_at, expires_at)\n                    VALUES (%s,%s,%s,%s,%s,\n                            now() + (%s || ' hours')::interval)\n                    ON CONFLICT (packet_id) DO NOTHING\"\"\",\n                    (packet[\"packet_id\"], packet[\"user_ref\"],\n                     packet[\"cadence_run_id\"], packet[\"board_version\"],\n                     packet[\"generated_at\"], str(expires_hours)))\n                if cur.rowcount == 0:\n                    return out   # idempotent replay\n                cur.execute(\"\"\"\n                    INSERT INTO packet_state_events (packet_id, state)\n                    VALUES (%s, 'draft')\"\"\", (packet[\"packet_id\"],))\n                for p in packet[\"proposals\"]:\n                    c = p.get(\"conflict\")\n                    cur.execute(\"\"\"\n                        INSERT INTO proposals\n                          (proposal_id, packet_id, op, target_task_id,\n                           rationale, confidence, conflict_type,\n                           conflict_detail, payload)\n                        VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s)\n                        ON CONFLICT (proposal_id) DO NOTHING\"\"\",\n                        (p[\"proposal_id\"], packet[\"packet_id\"], p[\"op\"],\n                         p[\"target_task_id\"], p[\"rationale\"],\n                         p[\"confidence\"],\n                         c[\"type\"] if c else None,\n                         c[\"detail\"] if c else None,\n                         json.dumps(p[\"payload\"])))\n                    out[\"proposals\"] += cur.rowcount\n                    for sid in p[\"source_signals\"]:\n                        cur.execute(\"\"\"\n                            INSERT INTO proposal_signals\n                              (proposal_id, signal_id)\n                            VALUES (%s,%s) ON CONFLICT DO NOTHING\"\"\",\n# ... 11 more lines", "walk": [["Do everything in one transaction", "supersede, insert, mark claims taken -- all or nothing"], ["Write nothing for an empty round", "silence is a valid output, not an error"]]}]}, {"name": "Embeddings", "file": "reconciler/embedders.py", "components": [{"symbol": "OllamaEmbedder", "blurb": "nomic-embed-text locally; timeout is 600s because a cold Ollama load once killed a run at 120s while a synthkit campaign held the queue.", "file": "reconciler/embedders.py", "code": "class OllamaEmbedder(object):\n    \"\"\"Embeddings via Ollama's /api/embeddings, one call per text.\"\"\"\n\n    def __init__(self, model=\"nomic-embed-text\",\n                 host=\"http://localhost:11434\"):\n        self.model = model\n        self.host = host\n\n    def __call__(self, texts):\n        out = []\n        for text in texts:\n            body = json.dumps({\"model\": self.model,\n                               \"prompt\": text or \"\"}).encode(\"utf-8\")\n            req = urllib.request.Request(\n                self.host + \"/api/embeddings\", data=body,\n                headers={\"Content-Type\": \"application/json\"})\n            with urllib.request.urlopen(req, timeout=600) as resp:\n                data = json.loads(resp.read().decode(\"utf-8\"))\n            out.append(data[\"embedding\"])\n        return out", "walk": [["Turn text into vectors with a local model", "similarity math needs numbers; nothing leaves the machine"], ["Wait generously for cold starts", "a two-minute timeout once killed a run while another project held the AI queue; ten minutes fixed it"]]}, {"symbol": "TokenEmbedder", "blurb": "Deterministic bag-of-tokens cosine: the offline fallback AND the reason band tests can place similarities on purpose.", "file": "reconciler/embedders.py", "code": "class TokenEmbedder(object):\n    \"\"\"Hashed bag-of-tokens vectors. Deterministic, offline, fast.\"\"\"\n\n    def __init__(self, dim=512):\n        self.dim = dim\n\n    def __call__(self, texts):\n        out = []\n        for text in texts:\n            vec = [0.0] * self.dim\n            for tok in _WORD.findall((text or \"\").lower()):\n                if tok in _STOP:\n                    continue\n                h = int(hashlib.md5(tok.encode(\"utf-8\")).hexdigest(), 16)\n                vec[h % self.dim] += 1.0\n            out.append(vec)\n        return out", "walk": [["Fall back to plain word-overlap vectors", "no AI required -- the offline mode and the reason tests can stage exact similarities on purpose"]]}]}], "plain": "Claims meet the board. Similarity places each claim; trust is proportional to blast radius -- the riskier the change, the more proof demanded -- and everything uncertain is held, never guessed.", "steps": [["Similarity sorts claims into three bands", "near-identical links automatically, clearly-new creates, and the gray zone goes to an AI judge that must name its deciding factor"], ["Completions face the strictest gate", "closing work wrongly is the worst error, so owner self-claims pass alone but anyone else needs an independent second source"], ["A confused judge causes delay, not damage", "malformed judge answers count as 'no match', which means held -- the failure mode is patience"], ["Each run supersedes the last", "at most one open review packet per person, enforced in storage; its first sweep retired four stale packets including two invisible kinds of debris"]], "l1": ["Match claims against the live board", "obvious matches link automatically, gray areas go to an AI judge, and risky changes are held rather than guessed"]}, {"id": "review", "kind": "stage", "stage": "05", "name": "Review", "color": "#9C4A38", "note": "a human accepts, edits, rejects, defers --\nnothing applies without a decision record", "blurb": "The gate that makes everything upstream safe to be wrong. Proposals become DecisionRecords through the Teams card or the local CLI -- both write identical records, and accepts re-validate against the board as it is NOW, not as it was at packet time.", "modules": [{"name": "Orchestrator", "file": "review_loop/orchestrator.py", "components": [{"symbol": "Orchestrator.apply_decision", "blurb": "Optimistic concurrency: a proposal whose target moved is recorded with invalidated_reason and NOT applied. The first real CLI session hit this exact path on a stale completion.", "file": "review_loop/orchestrator.py", "code": "def apply_decision(self, decision):\n    \"\"\"Apply one DecisionRecord. Idempotent on (packet_id, proposal_id).\n\n    Optimistic concurrency: before applying an accept, the proposal is\n    re-validated against the CURRENT board. If the board moved and the\n    proposal no longer makes sense (task closed manually, status already\n    changed), it is invalidated rather than blind-applied, and the card\n    is refreshed to show that.\"\"\"\n    user_ref = decision[\"decided_by\"]\n    record = self.open_packets.get(user_ref)\n    if record is None or record.packet[\"packet_id\"] != decision[\"packet_id\"]:\n        raise LookupError(\"no open packet {0} for user {1}\".format(\n            decision[\"packet_id\"], user_ref))\n    if record.state in TERMINAL_STATES:\n        raise ValueError(\"packet {0} is {1}; decisions closed\".format(\n            decision[\"packet_id\"], record.state))\n\n    pid = decision[\"proposal_id\"]\n    if pid in record.decisions:\n        return \"duplicate_ignored\"\n    proposal = _find_proposal(record.packet, pid)\n    if proposal is None:\n        raise LookupError(\"proposal {0} not in packet\".format(pid))\n    if pid in record.invalidated:\n        return \"invalidated:{0}\".format(record.invalidated[pid])\n\n    outcome = \"recorded\"\n    if decision[\"decision\"] in (\"accept\", \"accept_edited\"):\n        board = self.board_store.get_board(user_ref)\n        still_valid, reason = self.board_store.proposal_still_valid(\n            proposal, board)\n        if not still_valid:\n            record.invalidated[pid] = reason or \"board_moved\"\n            outcome = \"invalidated:{0}\".format(record.invalidated[pid])\n        else:\n            self.board_store.apply(user_ref, proposal, decision)\n    elif decision[\"decision\"] == \"defer\":\n        # Deferred proposals go back to the signal pool so the next\n        # cadence re-reconciles them against the then-current board.\n        self.signal_store.return_signals(\n            user_ref, list(proposal.get(\"source_signals\", [])))\n        outcome = \"deferred\"\n\n    record.decisions[pid] = decision\n    self.decision_log.append(decision)\n\n    if not record.undecided_proposal_ids():\n        record.transition(\"closed\")\n        self.transport.refresh_card(record.card_activity_id, record)\n        self._retire(user_ref, record)\n    else:\n        if record.state == \"delivered\":\n            record.transition(\"partially_decided\")\n        self.transport.refresh_card(record.card_activity_id, record)\n    return outcome", "walk": [["Re-check the target before applying", "the board may have moved since the packet was built"], ["Apply through the one blessed function", "every change is an event with a decision attached"], ["Record invalidation instead of forcing", "a stale accept is written down as stale -- honesty over convenience"]]}, {"symbol": "Orchestrator.expire_sweep", "blurb": "Expired packets return their undecided signals to the pool -- unanswered is a recoverable state, not a lost one.", "file": "review_loop/orchestrator.py", "code": "def expire_sweep(self):\n    \"\"\"Run periodically (independent of cadence). Expires overdue packets\n    and returns their undecided signals to the pool.\"\"\"\n    expired = []\n    for user_ref, record in list(self.open_packets.items()):\n        if record.state in TERMINAL_STATES:\n            continue\n        expires_at = datetime.datetime.fromisoformat(\n            record.packet[\"expires_at\"])\n        if self.clock() >= expires_at:\n            undecided = record.undecided_proposal_ids()\n            signal_ids = _collect_source_signals(record.packet, undecided)\n            if signal_ids:\n                self.signal_store.return_signals(user_ref, signal_ids)\n            record.transition(\"expired\")\n            self.transport.refresh_card(record.card_activity_id, record)\n            self._retire(user_ref, record)\n            expired.append(record)\n    return expired", "walk": [["Find packets past their deadline", "unanswered reviews should not linger as zombies"], ["Return their claims to the pool", "expiry recycles; it never discards"]]}]}, {"name": "Teams card", "file": "review_loop/review_card.py", "components": [{"symbol": "build_review_card", "blurb": "Adaptive Card 1.5 with Action.Execute; paginates at 8 proposals and refuses to exceed Teams' 28KB payload cap by construction.", "file": "review_loop/review_card.py", "code": "def build_review_card(packet, page=0, task_titles=None):\n    \"\"\"Render a ReviewPacket (delivered state) to an Adaptive Card dict.\n\n    task_titles: optional {task_id: title} for display; falls back to ids.\n    Proposals are ordered conflicts-first, then by descending confidence,\n    so the items needing human judgment are above the fold.\"\"\"\n    task_titles = task_titles or {}\n    ordered = sorted(\n        packet[\"proposals\"],\n        key=lambda p: (0 if p.get(\"conflict\") else 1, -p.get(\"confidence\", 0)),\n    )\n    start = page * MAX_PROPOSALS_PER_CARD\n    visible = ordered[start:start + MAX_PROPOSALS_PER_CARD]\n    overflow = len(ordered) - (start + len(visible))\n\n    body = [_header(packet, len(ordered))]\n    for prop in visible:\n        body.append(_proposal_container(packet, prop, task_titles))\n    if overflow > 0:\n        body.append(_overflow_row(packet, overflow, page))\n\n    card = {\n        \"$schema\": AC_SCHEMA,\n        \"type\": \"AdaptiveCard\",\n        \"version\": AC_VERSION,\n        \"refresh\": {\n            \"action\": {\n                \"type\": \"Action.Execute\",\n                \"verb\": \"card/refresh\",\n                \"data\": {\"packet_id\": packet[\"packet_id\"], \"page\": page},\n            },\n            \"userIds\": [packet[\"user_ref\"]],\n        },\n        \"body\": body,\n        \"actions\": [\n            {\n                \"type\": \"Action.Execute\",\n                \"title\": \"Accept all unconflicted\",\n                \"verb\": \"bulk\",\n                \"data\": {\"packet_id\": packet[\"packet_id\"],\n                         \"action\": \"accept_unconflicted\"},\n            },\n            {\n                \"type\": \"Action.Execute\",\n                \"title\": \"Defer all\",\n                \"verb\": \"bulk\",\n                \"data\": {\"packet_id\": packet[\"packet_id\"],\n                         \"action\": \"defer_all\"},\n            },\n        ],\n    }\n    _assert_size(card)\n    return card", "walk": [["Render proposals as a Teams card", "evidence quotes, rationale, and buttons -- decisions where the conversation already lives"], ["Paginate before the size limit", "eight proposals per card keeps every card deliverable"]]}, {"symbol": "_assert_size", "blurb": "The cap as a hard assert -- a card that can't deliver is a review that never happens, so oversize fails the build of the card, not the delivery.", "file": "review_loop/review_card.py", "code": "def _assert_size(card):\n    size = len(json.dumps(card, separators=(\",\", \":\")).encode(\"utf-8\"))\n    if size > MAX_CARD_BYTES:\n        raise ValueError(\n            \"card is {0} bytes; exceeds Teams 28KB limit -- lower \"\n            \"MAX_PROPOSALS_PER_CARD\".format(size))\n    return size", "walk": [["Refuse to build an oversized card", "a card that cannot deliver is a review that never happens; failing at build time is the honest failure"]]}]}, {"name": "Review CLI", "file": "cli/review.py", "components": [{"symbol": "still_valid", "blurb": "The CLI's board re-check before any accept: terminal targets, merged-away tasks, and vanished targets all block application.", "file": "cli/review.py", "code": "def still_valid(prop):\n    \"\"\"Optimistic concurrency, mirroring the orchestrator's checks.\"\"\"\n    op = prop[\"op\"]\n    if op in (\"create_task\",):\n        return True, None\n    if prop[\"target_task_id\"] is None and op != \"create_task\":\n        return False, \"no_target\"\n    if prop[\"target_merged\"]:\n        return False, \"target_merged_away\"\n    if prop[\"target_title\"] is None and op != \"create_task\":\n        return False, \"target_missing\"\n    terminal = prop[\"target_status\"] in (\"completed\", \"cancelled\")\n    if op in (\"complete_task\", \"cancel_task\", \"update_status\",\n              \"update_deadline\", \"add_blocker\", \"resolve_blocker\",\n              \"reassign\", \"add_subtask\") and terminal:\n        return False, \"target_already_{0}\".format(prop[\"target_status\"])\n    return True, None", "walk": [["Check the proposal against the board right now", "terminal states, merged-away tasks, and vanished targets all block an accept"]]}, {"symbol": "apply_accept", "blurb": "Every accepted op maps to exactly one apply_task_event call. The CLI never touches tasks_current -- no surface does.", "file": "cli/review.py", "code": "def apply_accept(cur, user, prop, payload):\n    \"\"\"Map an accepted proposal to its board event via apply_task_event.\n    Returns the task_id acted on (new id for creates).\"\"\"\n    op = prop[\"op\"]\n    if op in (\"create_task\", \"add_subtask\"):\n        task_id = \"task-\" + prop[\"proposal_id\"][:8]\n        body = {\n            \"title\": payload[\"title\"],\n            \"description\": payload.get(\"description\"),\n            \"status\": payload.get(\"status\", \"proposed\"),\n            \"owner_ref\": payload.get(\"owner_ref\"),\n            \"deadline\": payload.get(\"deadline\"),\n            \"parent_task_id\": (payload.get(\"parent_task_id\")\n                               if op == \"create_task\"\n                               else prop[\"target_task_id\"]\n                               or payload.get(\"parent_task_id\")),\n        }\n        cur.execute(\"SELECT apply_task_event(%s,%s,'created','user_decision',\"\n                    \"currval(pg_get_serial_sequence('decisions',\"\n                    \"'decision_id')), %s::jsonb)\",\n                    (task_id, user, json.dumps(body)))\n        return task_id\n    if op == \"merge_tasks\":\n        for merged in payload[\"merged_task_ids\"]:\n            cur.execute(\"SELECT apply_task_event(%s,%s,'merged_into',\"\n                        \"'user_decision',currval(pg_get_serial_sequence(\"\n                        \"'decisions','decision_id')), %s::jsonb)\",\n                        (merged, user,\n                         json.dumps({\"surviving_task_id\":\n                                     payload[\"surviving_task_id\"]})))\n        return payload[\"surviving_task_id\"]\n    event = OP_EVENT[op]\n    cur.execute(\"SELECT apply_task_event(%s,%s,%s,'user_decision',\"\n                \"currval(pg_get_serial_sequence('decisions','decision_id')),\"\n                \" %s::jsonb)\",\n                (prop[\"target_task_id\"], user, event, json.dumps(payload)))\n    return prop[\"target_task_id\"]", "walk": [["Map the accepted change to exactly one board event", "the CLI never touches the board tables directly -- no surface does"]]}]}], "plain": "The human gate. Nothing -- literally no path in the code -- changes the board without a person's recorded decision. Reviews re-check the board at decision time, because packets age.", "steps": [["Proposals arrive as cards or a terminal session", "Teams card and local CLI write identical decision records; the interface is cosmetic, the record is not"], ["Accepting re-validates against the board as it is NOW", "if the target moved since the packet was built, the accept is blocked and the reason recorded -- the first real session hit exactly this"], ["Rejections teach", "reject reasons accumulate into the tuning data for matching thresholds -- the system improves by being used"], ["Unanswered is recoverable", "expired packets return their claims to the pool; silence loses nothing"]], "l1": ["Ask a human before anything changes", "every proposed change is accepted or rejected by a person, and that decision is recorded forever"]}, {"id": "board", "kind": "stage", "stage": "06", "name": "Board", "color": "#33707E", "note": "viewer-scoped facts that carry\ntheir own receipts", "blurb": "The dashboard reads projections through one choke point (visible_tasks) with two grant levels: progress redacts rationales, deciders, and provenance; full_trace opens the rail. Every confirmed fact traces to the utterance hash that produced it.", "modules": [{"name": "Board API", "file": "integration/dashboard/dashboard_api.py", "components": [{"symbol": "board", "blurb": "Read-only sessions, viewer header, every query through visible_tasks -- the API cannot mutate even if asked nicely.", "file": "integration/dashboard/dashboard_api.py", "code": "def board(user_ref):\n    v = viewer()\n    if not v:\n        return _need_viewer()\n    rows = q(\"\"\"\n        SELECT t.task_id, t.title, t.status, t.owner_ref, t.deadline,\n               t.project_id, pr.name AS project_name,\n               vt.access_level,\n               (t.deadline IS NOT NULL AND t.deadline < CURRENT_DATE\n                AND t.status NOT IN ('completed','cancelled')) AS overdue,\n               COALESCE(b.open_blockers, 0)  AS open_blockers,\n               COALESCE(c.subtasks, 0)       AS subtasks,\n               COALESCE(c.subtasks_done, 0)  AS subtasks_done,\n               t.updated_at,\n               floor(EXTRACT(epoch FROM now() - t.updated_at) / 86400)::int\n                 AS quiet_days,\n               dl.deadline_raw,\n               COALESCE(src.n, 0) AS sources\n        FROM visible_tasks(%s) vt\n        JOIN tasks_current t USING (task_id)\n        LEFT JOIN projects pr USING (project_id)\n        LEFT JOIN (SELECT task_id, count(*) AS open_blockers FROM task_blockers\n                   WHERE resolved_event_id IS NULL GROUP BY task_id) b\n               USING (task_id)\n        -- Progress, counted rather than stored: every subtask completion\n        -- is already a human-decided event, so the fraction inherits that\n        -- provenance and cannot drift from the log. Computed inline rather\n        -- than read from v_task_progress so the board still renders on a\n        -- ledger that predates that view.\n        LEFT JOIN (SELECT parent_task_id AS task_id, count(*) AS subtasks,\n                          count(*) FILTER (WHERE status = 'completed')\n                            AS subtasks_done\n                   FROM tasks_current\n                   WHERE parent_task_id IS NOT NULL AND merged_into IS NULL\n                   GROUP BY parent_task_id) c USING (task_id)\n        -- The phrase someone actually said (\"end of next sprint\"), carried\n        -- from the deadline event. Relative-date resolution is the top\n        -- failure mode, and the resolved date alone hides it.\n        LEFT JOIN LATERAL (\n            SELECT e.payload->>'raw_text' AS deadline_raw\n            FROM task_events e\n            WHERE e.task_id = t.task_id AND e.event_type = 'deadline_changed'\n              AND e.payload->>'raw_text' IS NOT NULL\n            ORDER BY e.board_version DESC LIMIT 1) dl ON true\n        -- How many distinct claims stand behind the confirmed state: one\n        -- mention and five mentions are not the same kind of fact.\n        LEFT JOIN LATERAL (\n            SELECT count(DISTINCT ps.signal_id) AS n\n            FROM task_events e\n            JOIN decisions d         ON d.decision_id = e.decision_id\n            JOIN proposal_signals ps ON ps.proposal_id = d.proposal_id\n            WHERE e.task_id = t.task_id) src ON true\n        WHERE t.user_ref = %s AND t.merged_into IS NULL\n        ORDER BY overdue DESC, t.status, t.deadline NULLS LAST\"\"\",\n        (v, user_ref))\n    _add_last_noted(rows, v)\n    _add_collaborators(rows, user_ref)\n    out = []\n    for r in rows:\n        # A raw deadline phrase is a quote, and a source count is a fact\n        # about someone's communications -- both belong to the provenance\n        # rail, not the progress skeleton.\n        if r[\"access_level\"] != \"full_trace\":\n            r[\"deadline_raw\"] = None\n            r[\"sources\"] = None\n            # Who said it is provenance; THAT it changed is progress.\n            if r.get(\"last_noted\"):\n                r[\"last_noted\"][\"on_whose_word\"] = None\n        if r[\"access_level\"] == \"status_only\":\n            # Visible because it blocks the viewer's own work. They get the\n            # title and whether it is moving -- not the deadline, project,\n            # owner, blocker counts, or how quiet it has gone.\n            r = {\"task_id\": r[\"task_id\"], \"title\": r[\"title\"],\n                 \"status\": r[\"status\"], \"access_level\": \"status_only\",\n                 \"blocking_you\": True}\n        out.append(r)\n    return jsonify(out)", "walk": [["Serve each person's board read-only", "the database session physically cannot write"], ["Filter through the visibility choke point", "one function decides what any viewer may see; every query goes through it"]]}, {"symbol": "blocked_on", "blurb": "The dependency view is owner-only: who is waiting on you is your business, not your stakeholders'.", "file": "integration/dashboard/dashboard_api.py", "code": "def blocked_on(user_ref):\n    v = viewer()\n    if not v:\n        return _need_viewer()\n    if v != user_ref:\n        grants = q(\"\"\"\n            SELECT 1 FROM v_current_grants\n            WHERE grantee_ref = %s AND subject_type = 'user'\n              AND subject_id = %s AND level = 'full_trace'\"\"\", (v, user_ref))\n        if not grants:\n            return jsonify({\"error\":\n                \"the dependency view is owner-only unless the board is \"\n                \"shared at full trace\"}), 403\n    return jsonify(q(\"\"\"\n        SELECT waiter.user_ref AS blocked_user,\n               waiter.task_id  AS blocked_task,\n               waiter.title    AS blocked_title,\n               b.description   AS blocker_desc,\n               mine.task_id    AS my_blocking_task,\n               mine.title      AS my_blocking_title,\n               mine.status     AS my_task_status\n        FROM task_blockers b\n        JOIN tasks_current waiter ON waiter.task_id = b.task_id\n        LEFT JOIN tasks_current mine ON mine.task_id = b.blocking_task_id\n        WHERE b.resolved_event_id IS NULL\n          AND (mine.owner_ref = %s OR b.blocking_party = %s)\n        ORDER BY waiter.user_ref\"\"\", (user_ref, user_ref)))", "walk": [["Show who waits on whom, owner-only", "your dependency map is your business, not your stakeholders'"]]}, {"symbol": "profiles", "blurb": "Three ledgers behind one switch: the real one, a synthetic set wide enough to show interactions a real week lacked, and what Copilot itself claims. The client picks a NAME, never a connection string -- an endpoint that took a DSN could point this at any database the host can reach.", "file": "integration/dashboard/dashboard_api.py", "code": "def profiles():\n    \"\"\"Which ledgers this dashboard can show, and which one is active.\n\n    Deliberately no DSNs: a connection string names a host and a database\n    user, and nothing in the UI needs either. The client gets names it may\n    ask for and labels it may print.\n    \"\"\"\n    active = profile_name()\n    out = []\n    for name in (\"real\", \"synthetic\", \"copilot\"):\n        if name in PROFILES:\n            p = PROFILES[name]\n            out.append({\"name\": name, \"label\": p[\"label\"],\n                        \"blurb\": p[\"blurb\"], \"synthetic\": p[\"synthetic\"],\n                        \"writable\": p.get(\"writable\", False),\n                        \"banner\": p.get(\"banner\"),\n                        \"active\": name == active})\n    return jsonify({\"profiles\": out, \"active\": active,\n                    \"default\": DEFAULT_PROFILE,\n                    \"switchable\": len(out) > 1})", "walk": [["Three ledgers, one button", "the real week, a synthetic set broad enough to show situations the real week happened not to contain, and what the assistant claims by itself"], ["The page asks for a name, never for a database", "if it could name a connection it could name any database this machine can reach, so the server chooses from its own short list and ignores anything else"], ["And the screen always says which one you are looking at", "a banner in words rather than colour alone, because the one unforgivable outcome is an audience that cannot tell real from demonstration"]]}, {"symbol": "nudge", "blurb": "Where did this get to? Not a proposal and not model output -- a person typing what is true -- so it writes actor_type 'manual_edit' with a NULL decision_id, the place the schema has held since the first commit so that 'human typed it' stays as auditable as 'model proposed it'.", "file": "integration/dashboard/dashboard_api.py", "code": "def nudge():\n    \"\"\"Answer 'where did this get to?' on a task that has gone quiet.\n\n    Not a proposal and not a model output: a person typing what is true.\n    The schema has carried a place for this from the start --\n    actor_type='manual_edit' with a NULL decision_id -- so that \"human\n    typed it\" stays as auditable as \"model proposed it\", and the\n    provenance rail can tell the two apart forever.\n    \"\"\"\n    v = viewer()\n    if not v:\n        return _need_viewer()\n    if not _writable():\n        return _refuse_write()\n    body = request.get_json(silent=True) or {}\n    task_id = (body.get(\"task_id\") or \"\").strip()\n    status = (body.get(\"status\") or \"\").strip()\n    if status not in (\"in_progress\", \"blocked\", \"completed\"):\n        return jsonify({\"error\": \"status must be in_progress, blocked or \"\n                                 \"completed\"}), 400\n    note = (body.get(\"note\") or \"\").strip()[:200] or None\n\n    conn = _write_conn()\n    try:\n        with conn.cursor() as cur:\n            cur.execute(\"SELECT user_ref, status FROM tasks_current \"\n                        \"WHERE task_id = %s AND merged_into IS NULL\",\n                        (task_id,))\n            row = cur.fetchone()\n            if not row:\n                return jsonify({\"error\": \"no such task\"}), 404\n            if row[0] != v:\n                return jsonify({\"error\": \"not your task\"}), 403\n            event = (\"completed\" if status == \"completed\"\n                     else \"blocker_added\" if status == \"blocked\"\n                     else \"status_changed\")\n            # Payload keys are apply_task_event's contract, not this\n            # endpoint's preference: status_changed reads to_status, and\n            # blocker_added opens a row in task_blockers from description.\n            if status == \"blocked\":\n                payload = {\"description\": note or \"raised from the nudge, \"\n                                                  \"reason not given\",\n                           \"blocking_party\": None,\n                           \"source\": \"dashboard nudge\"}\n            else:\n                payload = {\"to_status\": status, \"note\": note,\n                           \"source\": \"dashboard nudge\"}\n            cur.execute(\"SELECT apply_task_event(%s,%s,%s,'manual_edit',\"\n                        \"NULL,%s::jsonb)\",\n                        (task_id, v, event, json.dumps(payload)))\n        conn.commit()\n        return jsonify({\"ok\": True, \"task_id\": task_id, \"status\": status})\n    finally:\n        conn.close()", "walk": [["The other half of keeping a board true", "not only what was heard, but what you took on and then went quiet about"], ["Answering is one tap, and it is your answer", "no model proposed it and nothing inferred it -- a person typed what is true"], ["Recorded as exactly that, forever", "the ledger marks it hand-typed rather than model-proposed, so months later the trail still knows the difference"]]}]}, {"name": "Provenance & redaction", "file": "integration/dashboard/dashboard_api.py", "components": [{"symbol": "provenance", "blurb": "The 'Trace to source' walk: board event -> decision -> proposal -> signals -> evidence hashes. Returns 403 below full_trace -- provenance is a grant, not a default.", "file": "integration/dashboard/dashboard_api.py", "code": "def provenance(event_id):\n    v = viewer()\n    if not v:\n        return _need_viewer()\n    owner_rows = q(\"SELECT task_id FROM task_events WHERE event_id = %s\",\n                   (event_id,))\n    if not owner_rows:\n        return jsonify({\"error\": \"no such event\"}), 404\n    if task_level(v, owner_rows[0][\"task_id\"]) != \"full_trace\":\n        return jsonify({\"error\":\n            \"provenance requires full-trace access to this task\"}), 403\n    rows = q(\"\"\"\n        SELECT p.proposal_id, p.op, p.rationale, p.confidence,\n               s.signal_id, s.signal_type, s.title AS signal_title,\n               s.confidence AS signal_confidence, s.author_ref,\n               ev.ordinal, ev.source_type, ev.resource_id,\n               ev.span_start, ev.span_end, ev.content_hash\n        FROM task_events e\n        JOIN decisions d         ON d.decision_id = e.decision_id\n        JOIN proposals p         ON p.proposal_id = d.proposal_id\n        JOIN proposal_signals ps ON ps.proposal_id = p.proposal_id\n        JOIN signals s           ON s.signal_id = ps.signal_id\n        JOIN evidence_refs ev    ON ev.signal_id = s.signal_id\n        WHERE e.event_id = %s\n        ORDER BY s.signal_id, ev.ordinal\"\"\", (event_id,))\n    for r in rows:\n        r.update(_evidence_state(r))\n    return jsonify(rows)", "walk": [["Walk a fact back to its source", "board event, decision, proposal, claim, message hash -- the full receipt"], ["Refuse below full-trace clearance", "provenance is a grant, not a default"]]}, {"symbol": "_redact_event", "blurb": "progress-level viewers see that things happened, not why or by whose word -- the redaction is field-by-field, not row-by-row.", "file": "integration/dashboard/dashboard_api.py", "code": "def _redact_event(r):\n    # The history skeleton (what changed, when, by which class of actor)\n    # is progress-level information. Everything derived from internal\n    # communications -- rationale, who decided, model confidence, blocker\n    # wording -- is not.\n    r[\"rationale\"] = REDACTED if r.get(\"rationale\") else None\n    r[\"decided_by\"] = None\n    r[\"confidence\"] = None\n    r[\"proposal_id\"] = None\n    r[\"has_provenance\"] = False\n    payload = dict(r.get(\"payload\") or {})\n    if r[\"event_type\"] == \"blocker_added\":\n        payload[\"description\"] = REDACTED\n        payload.pop(\"blocking_party\", None)\n        payload.pop(\"blocking_task_id\", None)\n    if r[\"event_type\"] == \"alias_added\":\n        payload[\"alias\"] = REDACTED\n        payload.pop(\"source_signal_id\", None)\n    r[\"payload\"] = payload\n    return r", "walk": [["Blank the sensitive fields for progress viewers", "they see that things happened, not why or on whose word -- field-level, not row-level"]]}, {"symbol": "_attach_owner_options", "blurb": "The commonest thing wrong with a proposed task is not the task, it is who it was pinned on. Correcting that needs the right person already in the list, so the list is the conversation the claim came from -- the extractor's own candidates first, then whoever spoke in that window. Nobody else, because a review control must not double as a directory of colleagues.", "file": "integration/dashboard/dashboard_api.py", "code": "def _attach_owner_options(proposals, viewer_ref):\n    \"\"\"Who a mis-attributed proposal could belong to instead.\n\n    An owner correction is only easy if the right person is already in the\n    list, and only defensible if the list is not a directory of everyone.\n    So it is drawn from the conversation the claim came from: the people\n    the extractor itself considered, whoever spoke in that window, and the\n    viewer. Nobody outside that room is offered, which keeps a review\n    control from doubling as a way to enumerate colleagues.\n\n    Order carries meaning: the extractor's own candidates come first, so\n    'it was actually the other person it considered' is the shortest move.\n    \"\"\"\n    pids = [p[\"proposal_id\"] for p in proposals]\n    if not pids:\n        return\n    considered, authors, batches = {}, {}, {}\n    for r in q(\"\"\"\n            SELECT ps.proposal_id, s.owner_candidates, s.author_ref,\n                   s.batch_id\n            FROM proposal_signals ps\n            JOIN signals s ON s.signal_id = ps.signal_id\n            WHERE ps.proposal_id = ANY(%s)\"\"\", (pids,)):\n        seen = considered.setdefault(r[\"proposal_id\"], [])\n        for cand in (r[\"owner_candidates\"] or []):\n            ref = (cand or {}).get(\"person_ref\")\n            if ref and ref not in seen:\n                seen.append(ref)\n        if r[\"author_ref\"]:\n            authors.setdefault(r[\"proposal_id\"], []).append(r[\"author_ref\"])\n        if r[\"batch_id\"]:\n            batches.setdefault(r[\"proposal_id\"], set()).add(r[\"batch_id\"])\n\n    all_batches = sorted(set().union(*batches.values()) if batches else [])\n    in_window = {}\n    if all_batches:\n        for r in q(\"\"\"\n                SELECT DISTINCT batch_id, author_ref FROM signals\n                WHERE batch_id = ANY(%s) AND author_ref IS NOT NULL\"\"\",\n                (all_batches,)):\n            in_window.setdefault(r[\"batch_id\"], []).append(r[\"author_ref\"])\n\n    for p in proposals:\n        pid = p[\"proposal_id\"]\n        opts = list(considered.get(pid, []))\n        for ref in authors.get(pid, []):\n            if ref not in opts:\n                opts.append(ref)\n        for b in sorted(batches.get(pid, [])):\n            for ref in sorted(in_window.get(b, [])):\n                if ref not in opts:\n                    opts.append(ref)\n        if viewer_ref not in opts:\n            opts.append(viewer_ref)\n        p[\"owner_options\"] = opts\n        p[\"proposed_owner\"] = (p[\"payload\"] or {}).get(\"owner_ref\")", "walk": [["Wrong owner is the most common miss, and the least fixable", "the work was real and the description was right; only the person was wrong, and rejecting it threw all three away"], ["So the correction is a dropdown, not a re-type", "the people the extractor itself weighed come first, then whoever else spoke in that window -- and nobody who was not there, because naming colleagues is not a review control"], ["It rejects as wrong_owner and re-pools to them", "which is the same row the attribution eval is built from, so a correction still counts as a miss -- and their board waits for their own decision rather than taking yours"]]}]}], "plain": "The payoff surface. A read-only dashboard shows each person's confirmed work, and every fact carries a receipt: click through to the exact message that produced it.", "steps": [["The API physically cannot write", "read-only database sessions mean even a bug cannot mutate the board from here"], ["Viewers see by grant", "colleagues see progress; auditors with full-trace see rationale, decider, and provenance -- redaction is field-by-field"], ["Every fact traces to source", "board event to decision to proposal to claim to message hash -- the gold 'Trace to source' walk is the whole thesis in one click"]], "l1": ["Show facts that carry their own receipts", "the board displays only confirmed items, each traceable to the message that produced it"]}, {"id": "proving", "kind": "rail", "name": "Proving Ground", "color": "#7C5A80", "stage": "rail", "note": "synthetic mess in, honest scores out -- every prompt change re-measured on fixed seeds", "blurb": "A seeded generator of messy multi-channel comms (guaranteed negation traps, hedged claims, vague dates, name variants) and a scorer verified honest in both directions: a cheating LLM scores 100%, an empty one 0%. This is how the prompt has numbers at all.", "modules": [{"name": "Corpus generator", "file": "testdata/synthesize.py", "components": [{"symbol": "build_events", "blurb": "Density plus guarantees: the hard cases (traps, third-party completions, vague deadlines, cross-channel echoes) are never left to the dice.", "file": "testdata/synthesize.py", "code": "def build_events(rng, day_tasks):\n    \"\"\"Returns a list of (kind, payload) task-relevant events plus traps.\n    Density: 1-2 events per task. Guarantees per day: at least one negation\n    trap, one third-party completion, one vague deadline, and two\n    cross-channel duplicate sightings -- the hard cases are never left to\n    the dice.\"\"\"\n    events = []\n    for title, alias in day_tasks:\n        for _ in range(1 + (rng.random() < 0.6)):\n            events.append(_roll_event(rng, title, alias))\n\n    kinds_present = {k for k, _ in events}\n    forced = [(\"negation_trap\", lambda t, a: {\n                  \"speaker\": person(rng), \"title\": t, \"alias\": a,\n                  \"flavor\": pick(rng, [\"not_doing\", \"unblocked\",\n                                       \"deadline_dropped\"])}),\n              (\"completion_third\", lambda t, a: (lambda o: {\n                  \"speaker\": person(rng, exclude=o[\"ref\"]), \"about\": o,\n                  \"title\": t, \"alias\": a})(person(rng))),\n              (\"vague_deadline\", lambda t, a: {\n                  \"speaker\": person(rng), \"title\": t, \"alias\": a,\n                  \"phrase\": pick(rng, VAGUE_DEADLINES)})]\n    for kind, builder in forced:\n        if kind not in kinds_present:\n            t, a = pick(rng, day_tasks)\n            events.append((kind, builder(t, a)))\n\n    # cross-channel duplicate sightings: echo two signal-bearing events\n    bearers = [(k, e) for k, e in events\n               if k in (\"status\", \"completion_self\", \"assignment\",\n                        \"blocker\")]\n    for k, e in rng.sample(bearers, min(2, len(bearers))):\n        events.append((\"mention\", {\"speaker\": person(rng),\n                                   \"title\": e[\"title\"],\n                                   \"alias\": e[\"alias\"]}))\n\n    rng.shuffle(events)\n    return events", "walk": [["Roll a day of workplace events", "assignments, updates, blockers, completions across a cast with name variants"], ["Force the hard cases every day", "traps, hearsay completions, and vague deadlines are guaranteed, never left to dice"]]}, {"symbol": "render", "blurb": "One event, four registers: transcript fillers, chat mangling, email quoting. The golden label rides along with each rendering.", "file": "testdata/synthesize.py", "code": "def render(rng, kind, ev, channel):\n    \"\"\"-> (text, golden_signal_or_None, trap_dict_or_None)\"\"\"\n    sp = ev[\"speaker\"]\n    t = ev.get(\"title\", \"\")\n    alias = ev.get(\"alias\", t)\n    use = alias if rng.random() < 0.55 else t\n\n    if kind == \"assignment\":\n        a = ev[\"assignee\"]\n        aname = name_of(rng, a, channel)\n        dl = ev[\"deadline\"]\n        dtxt = \" -- can you have it {0}?\".format(dl[0]) if dl else \".\"\n        text = \"{0}, can you take the {1}{2}\".format(aname, use, dtxt)\n        if rng.random() < 0.4:\n            text += \" \" + pick(rng, [\"It keeps slipping.\",\n                                     \"Priya flagged it in review.\",\n                                     \"Should be mostly wiring.\"])\n        golden = {\"type\": \"assignment\", \"title_core\": use,\n                  \"owner_ref\": a[\"ref\"], \"basis\": \"explicit_assignment\",\n                  \"deadline_precision\": dl[1] if dl else None}\n        return text, golden, None\n\n    if kind == \"status\":\n        if ev[\"to\"] == \"blocked\":\n            text = \"quick update on the {0}: stuck at the moment, more later\"\\\n                .format(use)\n        else:\n            text = \"making decent progress on the {0}, midway through\"\\\n                .format(use)\n        return text, {\"type\": \"status_update\", \"title_core\": use,\n                      \"owner_ref\": sp[\"ref\"], \"basis\": \"self_reference\",\n                      \"status\": ev[\"to\"]}, None\n\n    if kind == \"blocker\":\n        pname = name_of(rng, ev[\"party\"], channel)\n        text = \"the {0} is blocked -- waiting on {1}'s team for the review\"\\\n            .format(use, pname)\n        return text, {\"type\": \"blocker\", \"title_core\": use,\n                      \"owner_ref\": sp[\"ref\"]}, None\n\n    if kind == \"completion_self\":\n        text = pick(rng, [\n            \"{0} is done, shipped it this morning\".format(use),\n            \"finally closed out the {0}, went out in last night's release\"\n            .format(use)])\n        return text, {\"type\": \"completion_claim\", \"title_core\": use,\n                      \"owner_ref\": sp[\"ref\"], \"basis\": \"self_reference\"}, None\n\n    if kind == \"completion_third\":\n        oname = name_of(rng, ev[\"about\"], channel)\n        text = \"i think {0} finished the {1} yesterday? board still shows \"\\\n               \"it open\".format(oname, use)\n        return text, {\"type\": \"completion_claim\", \"title_core\": use,\n                      \"owner_ref\": ev[\"about\"][\"ref\"],\n                      \"basis\": \"inferred\", \"third_party\": True}, None\n\n    if kind == \"proposal\":\n        text = \"we should really {0} at some point, it keeps biting us\"\\\n            .format(pick(rng, [\"rebuild the \" + use,\n                               \"get the \" + use + \" sorted\",\n                               \"put time into the \" + use]))\n        return text, {\"type\": \"proposal\", \"title_core\": use}, None\n\n    if kind == \"negation_trap\":\n        flavor = ev[\"flavor\"]\n        if flavor == \"not_doing\":\n            text = \"decision from planning: we are NOT doing the {0} this \"\\\n                   \"quarter, park it\".format(use)\n            trap = {\"trap\": \"extracted_parked_work\", \"title_core\": use,\n                    \"acceptable\": [\"cancellation\"]}\n        elif flavor == \"unblocked\":\n            text = \"good news, the {0} is no longer blocked, cloud team \"\\\n                   \"came through\".format(use)\n            trap = {\"trap\": \"extracted_blocker_from_unblock\",\n                    \"title_core\": use, \"acceptable\": [\"blocker_resolved\",\n                                                      \"status_update\"]}\n        else:\n            text = \"fyi the deadline on the {0} is dropped, no date for now\"\\\n                .format(use)\n            trap = {\"trap\": \"extracted_deadline_from_removal\",\n                    \"title_core\": use, \"acceptable\": []}\n        return text, None, trap\n\n    if kind == \"vague_deadline\":\n        text = \"would be good to land the {0} {1}\".format(use, ev[\"phrase\"])\n        return text, {\"type_any\": [\"deadline_signal\", \"proposal\",\n                                   \"status_update\", \"task_mention\"],\n                      \"title_core\": use,\n                      \"deadline_precision\": \"vague\"}, None\n\n# ... 7 more lines", "walk": [["Voice each event in its channel's register", "meeting filler, chat typos, email signatures -- the mess is the test"], ["Attach the answer key as it renders", "every window ships with its golden labels for scoring"]]}]}, {"name": "Transcript demo set", "file": "testdata/synth_transcripts.py", "components": [{"symbol": "render", "blurb": "Writes the .txt a Teams transcript becomes after Word, artefacts included, so the demo runs the same parse the real file runs. synth_meetings.py starts at the inbox and therefore exercises no ingestion at all.", "file": "testdata/synth_transcripts.py", "code": "def render(meetings, wrap_at=78):\n    \"\"\"The transcript as Word leaves it, artefacts and all.\"\"\"\n    out = []\n    for mi, (title, date, start, end, utts) in enumerate(meetings):\n        d = datetime.datetime.strptime(date, \"%Y-%m-%d\")\n        out.append(title)\n        out.append(\"{0}, {1} {2}, {3} {4} - {5}\".format(\n            d.strftime(\"%A\"), d.strftime(\"%B\"), d.day, d.year, start, end))\n        # The second meeting carries the navigation blurb and the dropped\n        # image glyphs, so the parser meets them at least once.\n        if mi == 1:\n            out.append(\"\")\n            out.append(\"T
