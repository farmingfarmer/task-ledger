<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Ledger · system atlas</title>
<style>
:root{--bg:#EDF0F3;--panel:#FFFFFF;--ink:#1B2733;--dim:#5B6B7A;
--line:#D8DEE4;--amber:#D9930D;--mono:ui-monospace,'SF Mono',Menlo,
Consolas,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);
font-size:15.5px;line-height:1.55;padding:0 0 48px}
header{display:flex;align-items:baseline;gap:14px;padding:18px 28px;
border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .mark{font-weight:800;letter-spacing:-.01em;font-size:17px}
header .hint{color:var(--dim);font-size:12px;flex:1}
header .stamp{color:var(--dim);font-size:12px}
.crumbs{display:flex;justify-content:flex-end;gap:6px;padding:14px 28px 0;
font-size:12px;color:var(--dim)}
.crumbs a{color:var(--ink);text-decoration:none;border-bottom:1px solid
var(--line);cursor:pointer}
.crumbs span.sep{color:var(--line)}
.layer{display:none;padding:10px 28px 0}
.layer.on{display:block;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.layer.on{animation:none}}
svg text{font-family:var(--mono)}
.stagebox{cursor:pointer}
.stagebox rect{transition:filter .16s}
.stagebox:hover rect{filter:brightness(.96)}
.rail{cursor:pointer}
.rail:hover rect{filter:brightness(.96)}
.cards{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);
border-top:3px solid var(--dc,#888);padding:14px 16px;min-width:220px;
cursor:pointer;flex:1 1 220px;max-width:340px}
.card:hover{filter:brightness(.98)}
.card h3{font-size:14px;margin-bottom:4px}
.card .meta{color:var(--dim);font-size:12px}
.domhead{margin:8px 0 4px}
.domhead h2{font-size:16px}
.domhead p{color:var(--dim);max-width:76ch;font-size:13px;margin-top:4px}
.explorer{display:flex;gap:18px;align-items:flex-start;margin-top:10px}
.chips{display:flex;flex-direction:column;gap:8px;min-width:250px}
.chip{background:var(--panel);border:1px solid var(--line);
border-left:4px solid var(--dc,#888);padding:9px 12px;cursor:pointer;
font-size:13px}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);
border-left-color:var(--dc,#888)}
.codebox{background:var(--panel);border:1px solid var(--line);flex:1;
min-width:0}
.codebox .head{display:flex;gap:10px;align-items:center;padding:10px 14px;
border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.codebox .head .tick{width:8px;height:8px;background:var(--amber);
border-radius:50%;flex:none}
.codebox .head b{color:var(--ink)}
.codebox .blurb{padding:12px 14px;border-bottom:1px solid var(--line);
font-size:13px;color:var(--ink);max-width:90ch}
.codebox pre{padding:14px;overflow-x:auto;font-size:12.5px;line-height:1.55}
.plainwrap{background:var(--panel);border:1px solid var(--line);
border-radius:6px;box-shadow:0 1px 2px rgba(23,34,44,.06),
0 4px 14px rgba(23,34,44,.05);padding:16px 18px;margin:18px 0 6px;
max-width:1100px}
.plainhead{font-size:12px;letter-spacing:.08em;color:var(--dim);
font-weight:700;margin-bottom:10px}
.step{display:flex;gap:10px;margin:8px 0;align-items:baseline}
.stepchip{flex:none;width:22px;height:22px;border-radius:6px;
background:var(--sc,#888);color:#fff;font-weight:700;font-size:12.5px;
display:flex;align-items:center;justify-content:center;
box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.18);
transform:translateY(3px)}
.stepact{font-weight:700}
.stepwhy{color:var(--dim)}
.card,.codebox{border-radius:6px;
box-shadow:0 1px 2px rgba(23,34,44,.05),0 5px 16px rgba(23,34,44,.06)}
.card{transition:transform .16s,box-shadow .16s}
.card:hover{transform:translateY(-2px);
box-shadow:0 3px 6px rgba(23,34,44,.08),0 10px 24px rgba(23,34,44,.09)}
.card:active{transform:translateY(0)}
.chip{border-radius:5px;
box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(23,34,44,.07);
transition:transform .16s}
.chip:hover{transform:translateY(-1px)}
.chip:active{transform:translateY(0);
box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.chip.active{box-shadow:inset 0 1px 3px rgba(0,0,0,.28)}
@media (prefers-reduced-motion:reduce){.card,.chip{transition:none}}
.tok-c{color:#2F7D32;font-style:italic}
.tok-s{color:#9C4A38}
.tok-k{color:#3E5C76;font-weight:700}
footer{color:var(--dim);font-size:12px;padding:26px 28px 0;
border-top:1px solid var(--line);margin:34px 28px 0;padding-left:0;
padding-right:0}
</style></head>

<script type="application/json" id="atlas-data">{"input": "a workplace conversation \u2192", "output": "\u2192 a provenance-backed board fact", "domains": [{"id": "capture", "kind": "stage", "stage": "01", "name": "Capture", "color": "#3E5C76", "note": "subscriptions, a drop folder, and what an\nassistant will hand over become windows", "blurb": "Nothing downstream sees raw streams. Teams, chat, and mail arrive as change notifications (or inbox files, pre-Graph) and are cut into quiet-edge windows -- the unit every later stage reasons about. Where a tenant will not release transcripts at all, two weaker doors exist and are labelled as weaker for the whole journey: a meeting recap, and Copilot's own already-structured claims, which cite meetings rather than sentences and therefore cannot be checked.", "modules": [{"name": "Graph subscriptions", "file": "integration/ingestion/graph_ingestion.py", "components": [{"symbol": "SubscriptionManager.renew_due", "blurb": "Graph subscriptions expire; this renews at half-life so a missed tick never means a silent gap in capture.", "file": "integration/ingestion/graph_ingestion.py", "code": "def renew_due(self):\n    \"\"\"Renew every subscription past its half-life. Run on a timer.\"\"\"\n    renewed = []\n    for sub_id, rec in list(self.store.items()):\n        expires = datetime.datetime.fromisoformat(rec[\"expires_at\"])\n        minutes = MAX_LIFETIME_MINUTES[rec[\"source_type\"]]\n        half_life = expires - datetime.timedelta(minutes=minutes // 2)\n        if self.clock() >= half_life:\n            new_expiry = self.clock() + datetime.timedelta(minutes=minutes)\n            resp = self.graph.patch(\n                \"/subscriptions/{0}\".format(sub_id),\n                {\"expirationDateTime\": new_expiry.isoformat()})\n            rec[\"expires_at\"] = resp[\"expirationDateTime\"]\n            renewed.append(sub_id)\n    return renewed", "walk": [["Check each subscription's expiry clock", "Microsoft subscriptions die every few days by design"], ["Renew any past half-life", "renewing early means one missed run never becomes a silent gap in listening"]]}, {"symbol": "SubscriptionManager.transcript_poll_plan", "blurb": "Meeting transcripts aren't push-notified like messages -- ended meetings get a bounded poll plan instead.", "file": "integration/ingestion/graph_ingestion.py", "code": "def transcript_poll_plan(self, ended_meetings):\n    \"\"\"Meeting transcripts have no change notifications. Given calendar\n    events that ended since the last poll, emit fetch jobs for the\n    extraction worker (which calls the Meeting Insights API).\"\"\"\n    return [{\n        \"job_id\": str(uuid.uuid4()),\n        \"source_type\": \"meeting_transcript\",\n        \"source_ref\": m[\"online_meeting_id\"],\n        \"window_start\": m[\"start\"],\n        \"window_end\": m[\"end\"],\n    } for m in ended_meetings]", "walk": [["Notice which meetings have ended", "transcripts are not pushed like messages; they must be asked for"], ["Schedule a bounded series of polite checks", "transcripts appear minutes after a meeting; a capped poll plan catches them without hammering the API"]]}]}, {"name": "Windowing", "file": "integration/ingestion/graph_ingestion.py", "components": [{"symbol": "WindowBatcher.add", "blurb": "Per-conversation debounce: 180s of quiet closes a window, a 30-minute cap bounds it. Content never enters this queue -- only resource pointers.", "file": "integration/ingestion/graph_ingestion.py", "code": "def add(self, source_type, source_ref, resource_id):\n    key = (source_type, source_ref)\n    now = self.clock()\n    w = self.open_windows.get(key)\n    if w is None:\n        w = {\"opened_at\": now, \"last_at\": now, \"resource_ids\": []}\n        self.open_windows[key] = w\n    w[\"last_at\"] = now\n    if resource_id not in w[\"resource_ids\"]:\n        w[\"resource_ids\"].append(resource_id)", "walk": [["File the new message pointer under its conversation", "only the pointer -- content is never queued"], ["Open a window if none exists, else extend it", "a burst of replies becomes one shared window instead of many fragments"]]}, {"symbol": "WindowBatcher.flush_due", "blurb": "The moment a window becomes an extraction job. One LLM call per flush is the cost model of the whole system.", "file": "integration/ingestion/graph_ingestion.py", "code": "def flush_due(self):\n    \"\"\"Run on a short timer. Flushes quiet or aged windows.\"\"\"\n    flushed = []\n    now = self.clock()\n    for key, w in list(self.open_windows.items()):\n        quiet_done = now - w[\"last_at\"] >= self.quiet\n        aged_out = now - w[\"opened_at\"] >= self.max_window\n        if quiet_done or aged_out:\n            source_type, source_ref = key\n            job = {\n                \"job_id\": str(uuid.uuid4()),\n                \"source_type\": source_type,\n                \"source_ref\": source_ref,\n                \"window_start\": w[\"opened_at\"].isoformat(),\n                \"window_end\": w[\"last_at\"].isoformat(),\n                \"resource_ids\": list(w[\"resource_ids\"]),\n            }\n            self.queue.enqueue(job)\n            flushed.append(job)\n            del self.open_windows[key]\n    return flushed", "walk": [["Find windows that have gone quiet or grown old", "quiet means the burst ended; the age cap bounds endless threads"], ["Turn each into one extraction job", "one job equals one AI call -- this line is the system's entire cost model"]]}]}, {"name": "Local inbox", "file": "cadence/cadence_tick.py", "components": [{"symbol": "process_inbox", "blurb": "The pre-Graph input path: transcript JSONs dropped in a folder. Ollama down means files WAIT rather than vanish -- extraction loses nothing by being patient.", "file": "cadence/cadence_tick.py", "code": "def process_inbox(dsn, inbox, host, extract_model, llm_factory):\n    import extraction_worker\n    import signal_store_pg\n\n    files = sorted(glob.glob(os.path.join(inbox, \"*.json\")))\n    if not files:\n        log(\"inbox: empty\")\n        return 0\n    if not ollama_up(host):\n        # Deliberately before any counting: an unreachable model is the\n        # normal degraded path and must never push a window toward\n        # quarantine.\n        log(\"inbox: {0} file(s) waiting but Ollama unreachable; \"\n            \"leaving for next tick\".format(len(files)))\n        return 0\n    if not db_up(dsn):\n        # The same courtesy the model already got, for the dependency that\n        # did not have it. Extraction runs first and the store is only\n        # touched at the end, so a database that went away mid-run was\n        # discovered AFTER the expensive part: on a laptop that slept\n        # through a tick, fifteen minutes of local inference produced a\n        # window that could not be written, was counted as a failed\n        # attempt, and moved one strike closer to quarantine. Nothing about\n        # that is the window's fault, and none of the work needed doing.\n        log(\"inbox: {0} file(s) waiting but the database is unreachable; \"\n            \"leaving for next tick (extraction would be discarded at the \"\n            \"write and counted against the window)\".format(len(files)))\n        return 0\n    processed_dir = os.path.join(inbox, \"processed\")\n    os.makedirs(processed_dir, exist_ok=True)\n    attempts = _attempts_load(inbox)\n    quarantined = 0\n    total = 0\n    for path in files:\n        name = os.path.basename(path)\n        try:\n            with open(path) as f:\n                spec = json.load(f)\n            worker = extraction_worker.ExtractionWorker(\n                fetcher=lambda job, items=spec[\"items\"]: items,\n                llm=llm_factory(extract_model, host),\n                directory=spec[\"directory\"],\n                model_name=\"ollama:{0}\".format(extract_model))\n            batch, report = worker.run_job(spec[\"job\"])\n            fallback = sorted(set(spec[\"directory\"].values()))\n            result = signal_store_pg.write_batch(dsn, batch, fallback)\n            log(\"inbox: {0} -> {1} signals kept ({2} dropped), \"\n                \"{3} inserted\".format(\n                    os.path.basename(path), report[\"kept\"],\n                    len(report[\"dropped\"]), result[\"signals_inserted\"]))\n            # Routing is the difference between one review card and ten.\n            if result.get(\"routed_to_author\") or result.get(\"unrouted\"):\n                log(\"    routing: {0} unowned claim(s) went to their \"\n                    \"speaker, {1} could not be routed at all\".format(\n                        result.get(\"routed_to_author\", 0),\n                        result.get(\"unrouted\", 0)))\n            for d in report[\"dropped\"]:\n                log(\"    dropped [{0}]: {1}\".format(\n                    d.get(\"reason\"), (d.get(\"title\") or \"\")[:70]))\n            total += result[\"signals_inserted\"]\n            attempts.pop(name, None)          # a success clears the history\n            shutil.move(path, os.path.join(processed_dir, name))\n        except Exception as e:\n            record = attempts.get(name) or {\"count\": 0}\n            record[\"count\"] = record.get(\"count\", 0) + 1\n            record[\"last_error\"] = str(e)[:300]\n            record[\"last_at\"] = datetime.datetime.now().isoformat(\n                timespec=\"seconds\")\n            attempts[name] = record\n            if record[\"count\"] >= QUARANTINE_AFTER:\n                quarantine(inbox, path, record)\n                attempts.pop(name, None)\n                quarantined += 1\n                log(\"inbox: QUARANTINED {0} after {1} failed attempts: {2} \"\n                    \"-- moved to quarantine/, see the .error.txt beside \"\n                    \"it\".format(name, record[\"count\"], e))\n            else:\n                log(\"inbox: FAILED {0} (attempt {1} of {2}): {3} -- left in \"\n                    \"place\".format(name, record[\"count\"], QUARANTINE_AFTER,\n                                   e))\n    _attempts_save(inbox, attempts)\n    if quarantined:\n        log(\"inbox: {0} window(s) quarantined this tick and will NOT be \"\n            \"retried\".format(quarantined))\n    return total", "walk": [["Look for transcript files in the drop folder", "the manual input path -- drop a file, the system ingests it at 4:45"], ["If the AI is down, leave everything untouched", "extraction loses nothing by waiting a day"], ["Extract, store, and archive each file", "processed files move aside so nothing runs twice"]]}, {"symbol": "quarantine", "blurb": "Waiting is right until it isn't. One window drove the model to 15k characters of broken JSON and 480-680s against a 300s timeout, so it failed every tick forever while looking exactly like the ordinary wait for Ollama. Three failures and it is set aside with the reason beside it -- never deleted, and a model outage still counts for nothing.", "file": "cadence/cadence_tick.py", "code": "def quarantine(inbox, path, record):\n    \"\"\"Set a repeatedly-failing window aside, with why, beside it.\n\n    Not deleted and not silently skipped: moving it back into the inbox is\n    the whole recovery procedure, and the note says what to expect.\n    \"\"\"\n    qdir = os.path.join(inbox, \"quarantine\")\n    os.makedirs(qdir, exist_ok=True)\n    name = os.path.basename(path)\n    shutil.move(path, os.path.join(qdir, name))\n    try:\n        with open(os.path.join(qdir, name + \".error.txt\"), \"w\") as f:\n            f.write(\n                \"This window failed extraction {0} times and was set aside \"\n                \"so it would stop\\nconsuming every tick. It was NOT \"\n                \"processed and no signals from it exist.\\n\\n\"\n                \"last attempt: {1}\\nlast error:   {2}\\n\\n\"\n                \"Move the .json back into the inbox to retry it.\\n\".format(\n                    record.get(\"count\"), record.get(\"last_at\"),\n                    record.get(\"last_error\")))\n    except IOError:\n        pass", "walk": [["A file still waiting is normally a healthy sign", "the model being down means work waits rather than vanishing, so an inbox with something in it is what a patient system looks like"], ["Which is exactly why a stuck one hid so well", "one window could never be read at all, and failing every single day looked identical to waiting politely for the model to come back"], ["Three strikes, then set aside where a person can see it", "the file is moved, not deleted, with a note saying what went wrong and that nothing from it was processed -- putting it back is the whole repair"]]}]}, {"name": "Assistant exports", "file": "scripts/copilot_claims_ingest.py", "components": [{"symbol": "claim_signal", "blurb": "Copilot exports task claims already structured, which means extraction is no longer where this system earns its place -- so it becomes the extractor and the ledger stays the record. What it asserts is kept at arm's length: evidence type assistant_claim, owner basis always inferred, confidence capped below the floor that complete and cancel require.", "file": "scripts/copilot_claims_ingest.py", "code": "def claim_signal(rec, batch_id, idx, bootstrap=False):\n    \"\"\"One exported claim -> one signal, or (None, reason).\n\n    bootstrap matters more than it looks. A Copilot export is mostly\n    progress and blockers on work already under way, and against an EMPTY\n    ledger those have nothing to attach to: update_status and add_blocker\n    need a target task, so they are consumed and propose nothing, and a\n    first import of twenty claims yields one proposal. Bootstrap maps every\n    claim to a type that can create -- a commitment stays an assignment,\n    everything else becomes a proposal -- so the first import can establish\n    that the work exists. The claim's real character is not lost: the\n    status still rides along, and the description still says what Copilot\n    called it.\n    \"\"\"\n    person = (rec.get(\"person\") or \"\").strip()\n    task = (rec.get(\"task\") or \"\").strip()\n    if not task:\n        return None, \"no task text\"\n    if not person:\n        # Everything here is per-person by construction; a record without\n        # one is malformed, and guessing an owner is the failure this\n        # system exists to avoid.\n        return None, \"no person named\"\n\n    raw_type = (rec.get(\"claim_type\") or \"\").strip().lower()\n    stype = CLAIM_TYPE.get(raw_type, \"task_mention\")\n    blockers = [b for b in (rec.get(\"blockers\") or []) if b]\n    if bootstrap:\n        # Only these two create a task. task_mention explicitly proposes\n        # nothing by itself (matching_policy.yaml), so leaving a bootstrap\n        # claim as one would drop it on the floor.\n        stype = (\"assignment\" if stype == \"assignment\" else \"proposal\")\n    # A claim typed as anything else but carrying blockers still records\n    # them; the type says what the claim was ABOUT, the blocker field says\n    # what is in the way.\n    if not bootstrap and stype != \"blocker\" and blockers \\\n            and not rec.get(\"progress\"):\n        stype = \"blocker\"\n\n    conf = CONFIDENCE.get((rec.get(\"confidence\") or \"\").strip().lower(), 0.40)\n    conf = min(conf, MAX_CONFIDENCE)\n\n    sources = [s for s in (rec.get(\"sources\") or []) if s]\n    # The pointer names what Copilot named -- a meeting, not a message --\n    # and says so in its own id, so nothing downstream can mistake it for a\n    # retrievable utterance.\n    resource_id = \"copilot-claim:\" + sha(person, task,\n                                         \"|\".join(sources))[:16]\n    signal_id = sha(batch_id, str(idx), person, task, stype)[:32]\n\n    # The assistant's own words about what this claim was and how sure it\n    # said it was. The contract forbids extra keys on a signal, and burying\n    # them in a raw blob would hide them from the person deciding -- which\n    # is exactly who needs to see that the citation is unverifiable.\n    asserted = \"Copilot: {0}, evidence {1} (UNVERIFIED - no retrievable \" \\\n               \"source), self-rated {2}{3}\".format(\n                   rec.get(\"claim_type\") or \"unspecified\",\n                   rec.get(\"evidence_strength\") or \"unstated\",\n                   rec.get(\"confidence\") or \"unstated\",\n                   (\", sources: \" + \"; \".join(sources)) if sources else \"\")\n    description = \" \".join(x for x in [\n        rec.get(\"progress\"),\n        (\"Blocked on: \" + \"; \".join(blockers)) if blockers else None,\n        (\"Next: \" + rec[\"next_action\"]) if rec.get(\"next_action\") else None,\n        asserted,\n    ] if x)[:600] or None\n\n    signal = {\n        \"signal_id\": signal_id,\n        \"type\": stype,\n        \"title\": task[:120],\n        \"description\": description,\n        \"status_signal\": STATUS.get((rec.get(\"status\") or \"\").strip().lower()),\n        \"confidence\": conf,\n        \"author_ref\": None,          # nobody was heard; there is no speaker\n        \"owner_candidates\": [{\n            \"person_ref\": ref_for(person),\n            # Rule 3: never promoted, whatever Copilot called it.\n            \"basis\": \"inferred\",\n            \"confidence\": conf,\n        }],\n        \"deadline\": None,\n        \"blocker\": ({\"description\": \"; \".join(blockers)[:300],\n                     \"blocking_party_ref\": None} if blockers else None),\n        \"evidence\": [{\n            \"source_type\": \"assistant_claim\",\n            \"resource_id\": resource_id,\n            \"span\": None,\n            # Hash of the record as exported: this cannot prove what anyone\n            # said, but it does prove the export was not edited afterwards.\n# ... 4 more lines", "walk": [["The assistant already did the reading", "Copilot hands over task claims per person, already structured, which is better than anything we could extract from a summary"], ["So it becomes the reader, and this stays the record", "the claims come in through the same door as everything else and get the same human gate; nothing changes downstream"], ["But a claim that says 'a transcript backs this' is not a receipt", "no message, no sentence, no way to go and look -- so these are marked as an assistant's word for it, and can never propose that work is finished or thrown away"]]}, {"symbol": "load_records", "blurb": "Pasted out of a chat window, fences and stray prose and all. Failing on that would be technically correct and practically useless.", "file": "scripts/copilot_claims_ingest.py", "code": "def load_records(path):\n    \"\"\"Tolerant of how this arrives: pasted out of a chat window.\n\n    Copilot wraps JSON in markdown fences, sometimes prefixes a sentence,\n    and sometimes trails one -- and the file often arrives via Word, which\n    curls every quote into a character JSON does not accept. Failing on any\n    of that would be technically correct and practically useless, so the\n    array is sliced out of whatever came with it and the quotes are\n    straightened -- the same tolerance the extraction worker applies to\n    model responses, for the same reason.\n    \"\"\"\n    with open(path, encoding=\"utf-8-sig\") as f:\n        text = f.read()\n    try:\n        data = json.loads(text)\n    except ValueError:\n        # Word, Outlook and Teams all \"helpfully\" curl quotes on paste, and\n        # JSON only accepts straight ones. The resulting error names a\n        # column number and explains nothing, so normalise rather than make\n        # someone find it by hand. Only on the fallback path: text that\n        # already parses is never touched.\n        text = (text.replace(u\"\\u201c\", '\"').replace(u\"\\u201d\", '\"')\n                    .replace(u\"\\u2018\", \"'\").replace(u\"\\u2019\", \"'\"))\n        start, end = text.find(\"[\"), text.rfind(\"]\")\n        if start == -1 or end <= start:\n            raise SystemExit(\n                \"no JSON array found in {0}. Paste the export as-is -- \"\n                \"fences and surrounding prose are fine, but the claims \"\n                \"themselves must be a JSON array.\".format(path))\n        try:\n            data = json.loads(text[start:end + 1])\n        except ValueError as e:\n            raise SystemExit(\"could not parse the JSON array in {0}: {1}\"\n                             .format(path, e))\n    if isinstance(data, dict):\n        for key in (\"claims\", \"items\", \"records\", \"data\"):\n            if isinstance(data.get(key), list):\n                return data[key]\n        return [data]\n    if not isinstance(data, list):\n        raise SystemExit(\"expected a JSON array of claim objects\")\n    return data", "walk": [["It arrives copied out of a chat window", "with code fences and a sentence either side, because that is how a person actually moves text between two programs"], ["So the list is lifted out of whatever came with it", "refusing the paste would be correct and useless; the claims themselves still have to parse exactly"]]}]}, {"name": "Recap fallback", "file": "scripts/copilot_recap_ingest.py", "components": [{"symbol": "parse_recap", "blurb": "When a tenant will not release transcripts, what you get is subjects grouped under people. Forgiving about bullet glyphs and indentation, strict about structure: a subject with no person above it is counted and dropped rather than attached to whoever came last.", "file": "scripts/copilot_recap_ingest.py", "code": "def parse_recap(text, default_date=None):\n    \"\"\"-> (title, date, [(person, [subjects])]).\n\n    Deliberately forgiving about glyphs and indentation and deliberately\n    strict about structure: a subject with no person above it is dropped\n    rather than guessed at, because attaching work to the wrong person is\n    the failure this whole system exists to avoid.\n    \"\"\"\n    title, date = None, default_date\n    people, current, orphans = [], None, 0\n\n    for raw in text.splitlines():\n        if not raw.strip():\n            continue\n        indent, line = clean(raw)\n        if not line:\n            continue\n        if title is None:\n            title = DATE_RE.sub(\"\", line).strip(\" ()-\u2014\").strip() or \"recap\"\n            m = DATE_RE.search(line)\n            if m:\n                date = \"{0}-{1:02d}-{2:02d}\".format(\n                    m.group(1), int(m.group(2)), int(m.group(3)))\n            continue\n        if date is None:\n            m = DATE_RE.search(line)\n            if m:\n                date = \"{0}-{1:02d}-{2:02d}\".format(\n                    m.group(1), int(m.group(2)), int(m.group(3)))\n                continue\n        nm = NAME_RE.match(line)\n        if nm and (current is None or indent <= current[2]):\n            current = [nm.group(1).strip(), [], indent]\n            people.append(current)\n            continue\n        if current is None:\n            orphans += 1          # a subject before any name: not guessed at\n            continue\n        current[1].append(line)\n    return title or \"recap\", date, [(p[0], p[1]) for p in people if p[1]], \\\n        orphans", "walk": [["Sometimes all you can get is a summary", "not the meeting, just subjects listed under the people who raised them, which is what a locked-down tenant will release"], ["Read it loosely, attach it strictly", "bullets and indentation vary wildly and none of that matters, but a subject with nobody above it is counted and dropped rather than pinned on whoever came last"]]}]}, {"name": "Transcript export", "file": "scripts/transcript_ingest.py", "components": [{"symbol": "parse_meeting", "blurb": "A Teams transcript saved out of Word states the speaker and the offset three times in three notations, and none of that is speech. The line carrying a name AND a long-form offset is the one dependable delimiter, so that is what utterances split on; the rest is furniture, counted and dropped.", "file": "scripts/transcript_ingest.py", "code": "def parse_meeting(title, dm, body, unparsed):\n    day = \"{0} {1}, {2}\".format(dm.group(\"month\"), dm.group(\"day\"),\n                                dm.group(\"year\"))\n    started = parse_clock(day, dm.group(\"start\"))\n    ended = parse_clock(day, dm.group(\"end\"))\n    date = started.strftime(\"%Y-%m-%d\")\n\n    utts, cur = [], None\n\n    def flush():\n        if cur and cur[\"text\"]:\n            text = \" \".join(\" \".join(cur[\"text\"]).split())\n            if text:\n                utts.append({\"name\": cur[\"name\"], \"off\": cur[\"off\"],\n                             \"text\": text})\n\n    j = 0\n    while j < len(body):\n        line = body[j].strip()\n        j += 1\n        if not line or is_furniture(line) or GLYPH.match(line) \\\n                or INITIALS.match(line) or BARE_OFFSET.match(line):\n            continue\n        m = SPEAKER_AT.match(line)\n        if m and looks_like_name(m.group(\"name\")):\n            flush()\n            off = (int(m.group(\"h\") or 0) * 3600\n                   + int(m.group(\"m\")) * 60 + int(m.group(\"s\")))\n            cur = {\"name\": canonical(m.group(\"name\")), \"off\": off, \"text\": []}\n            continue\n        # A block opens with the speaker's name ALONE, and the next thing\n        # is always its offset. Without that lookahead the name reads as\n        # the tail of whatever the previous speaker said.\n        if looks_like_name(line):\n            nxt = None\n            for k in range(j, min(len(body), j + 3)):\n                cand = body[k].strip()\n                if cand and not GLYPH.match(cand) and not is_furniture(cand):\n                    nxt = cand\n                    break\n            if nxt is not None and (BARE_OFFSET.match(nxt)\n                                    or SPEAKER_AT.match(nxt)):\n                continue\n        if cur is None:\n            # Before the first delimiter there is nothing to attach to.\n            if not looks_like_name(line):\n                unparsed.append(line)\n            continue\n        if canonical(line) == cur[\"name\"]:\n            continue\n        cur[\"text\"].append(line)\n    flush()\n\n    if not utts:\n        return None\n\n    mhash = hashlib.sha256(\n        (\"teams|\" + date + \"|\" + title).encode(\"utf-8\")).hexdigest()[:8]\n    directory, items = {}, []\n    for n, u in enumerate(utts, 1):\n        directory.setdefault(u[\"name\"], ref_for(u[\"name\"]))\n        at = started + datetime.timedelta(seconds=u[\"off\"])\n        items.append({\n            \"resource_id\": \"tx{0}-{1:03d}\".format(mhash, n),\n            \"author_name\": u[\"name\"],\n            \"author_ref\": directory[u[\"name\"]],\n            \"timestamp\": at.strftime(\"%Y-%m-%dT%H:%M:%SZ\"),\n            \"text\": u[\"text\"]})\n\n    window = {\n        \"job\": {\"source_type\": \"meeting_transcript\",\n                \"source_ref\": \"teams-{0}-{1}\".format(date, slug(title, 24)),\n                \"window_start\": started.strftime(\"%Y-%m-%dT%H:%M:%SZ\"),\n                \"window_end\": ended.strftime(\"%Y-%m-%dT%H:%M:%SZ\")},\n        \"directory\": directory,\n        \"items\": items}\n    return window, \"teams-{0}-{1}.json\".format(date, slug(title))", "walk": [["The real thing is a transcript, not a summary of one", "named, timestamped, every utterance as it was said -- which is the input the attribution ladder was designed for and has mostly had to do without"], ["Saved through Word, it says everything three times", "the speaker alone on a line, the offset in two notations, then the speaker and offset together, and only the last of those reliably opens an utterance"], ["So split on that, and count what will not place", "a format that drifts then shows up as a number rather than as speech that quietly went missing"]]}, {"symbol": "split_meetings", "blurb": "A meeting's title sits above its date line, so a body that runs to the next date header swallows the next meeting's title and puts it in the last speaker's mouth. Each body stops at the following title instead.", "file": "scripts/transcript_ingest.py", "code": "def split_meetings(lines):\n    \"\"\"[(title, date_match, [body lines])] -- a date header opens a meeting.\n\n    The title sits ABOVE its date line, so a meeting's body has to stop\n    short of the next meeting's title -- otherwise that title lands in the\n    last speaker's mouth as a trailing sentence.\n    \"\"\"\n    heads = []\n    for i, ln in enumerate(lines):\n        m = DATE_RE.match(ln)\n        if not m:\n            continue\n        t_idx, title = i, \"\"\n        for back in range(i - 1, max(-1, i - 6), -1):\n            cand = lines[back].strip()\n            if cand and not is_furniture(cand) and not GLYPH.match(cand):\n                t_idx, title = back, cand\n                break\n        heads.append((i, t_idx, title, m))\n\n    out = []\n    for k, head in enumerate(heads):\n        d_idx, _, title, m = head\n        stop = heads[k + 1][1] if k + 1 < len(heads) else len(lines)\n        out.append((title, m, lines[d_idx + 1:stop]))\n    return out", "walk": [["Several meetings arrive in one file", "each with a title line sitting above its date line, which is the wrong way round for anything reading top to bottom"], ["So a body ends at the next title, not the next date", "otherwise the last speaker of every meeting is recorded saying the name of the meeting that follows"]]}, {"symbol": "with_aliases", "blurb": "The owners worth catching did not speak -- the person handed the work, the person reported on -- and the worker drops any owner whose name will not resolve. So the directory is everyone in the file, not the speakers, with first-name and surname aliases because a room says 'Ada' where the export prints 'Okonkwo, Ada'. Shared first names resolve to nobody rather than to a guess.", "file": "scripts/transcript_ingest.py", "code": "def with_aliases(roster):\n    \"\"\"Add surname and first-name keys pointing at the same ref.\n\n    People are named in half a dozen forms and almost never the full one:\n    the transcript labels a speaker 'Last, First' while the room calls them\n    by a first name. An owner whose name does not resolve is dropped by the\n    worker, so an alias missing here is an owner silently lost. Ambiguous\n    aliases -- two people sharing a first name -- are left out rather than\n    guessed, which is the same trade the Copilot ingester makes.\n    \"\"\"\n    out = dict(roster)\n    firsts, lasts = {}, {}\n    for name, ref in roster.items():\n        parts = name.split()\n        if not parts:\n            continue\n        firsts.setdefault(parts[0], set()).add(ref)\n        lasts.setdefault(parts[-1], set()).add(ref)\n    for alias_map in (firsts, lasts):\n        for alias, refs in alias_map.items():\n            if len(refs) == 1 and alias not in out:\n                out[alias] = sorted(refs)[0]\n    return out", "walk": [["Whoever speaks is rarely whoever owns", "the useful signal is work handed to someone across the room, or somebody reporting what a third person did, and neither of those people need have said a word"], ["An owner whose name will not resolve is dropped in silence", "so a directory built from the speaker list loses exactly the attributions the ladder exists to make"], ["So carry everyone, under every name they are called", "the whole file's roster in every window, plus first-name and surname aliases -- and where two people share one, no alias at all, because a wrong owner is worse than none"]]}]}], "plain": "This is the front door. The system never watches a raw stream: it receives notifications that a message exists, groups nearby messages into a conversation window, and hands the window on.", "steps": [["Subscriptions tell us a message exists", "Microsoft sends a pointer, never the content -- content is fetched only when needed, under the app's own credentials"], ["Nearby messages become one window", "a burst of chat is one conversation; processing it together keeps context and costs one AI call instead of twenty"], ["Quiet closes the window", "sixty to one-eighty seconds of silence means the burst ended; a thirty-minute cap bounds even endless threads"], ["A drop folder does the same job locally", "before Microsoft wiring, transcripts dropped in a folder ride the identical path -- same format, same everything downstream"]], "l1": ["Listen where work is actually discussed", "Teams, chat, and email arrive as pointers, not copies, and get cut into tidy conversation windows"]}, {"id": "extract", "kind": "stage", "stage": "02", "name": "Extract", "color": "#2E6E63", "note": "one LLM call per window; typed, attributed,\nhash-anchored signals -- or nothing", "blurb": "mistral-small3.1 reads a window and emits typed signals with attribution ladders and cited evidence. Everything it says is checked: salvage keeps good signals out of bad JSON, guards delete what can't be verified. Measured: 94-100% recall, 0 fabrications on synthetic messy corpora.", "modules": [{"name": "Prompt (extract-v1.3)", "file": "extraction/extraction_prompts.py", "components": [{"symbol": "build_messages", "blurb": "The versioned contract with the model: numbered items, mandatory citations, and negative guidance grown from measured failures (announcement dates, negation reversals, hedge-lowers-confidence).", "file": "extraction/extraction_prompts.py", "code": "def build_messages(source_type, window_end_date, items):\n    \"\"\"Build the messages array for one extraction call.\n\n    items: list of dicts with keys item_no, author_name, timestamp, text\n    window_end_date: 'YYYY-MM-DD' used as the anchor for relative dates.\n    \"\"\"\n    # Empty for every other source type, so their prompt text is\n    # byte-identical to what was measured before this exception existed.\n    channel = (AUTHORED_ATTRIBUTION\n               if source_type in AUTHORED_SOURCES\n               else RECAP_GUIDANCE if source_type in RECAP_SOURCES\n               else \"\")\n    system = SYSTEM_PROMPT.format(\n        signal_types=SIGNAL_TYPES_SPEC,\n        attribution=ATTRIBUTION_SPEC,\n        channel=channel,\n        negative=NEGATIVE_GUIDANCE,\n        output=OUTPUT_SPEC,\n    )\n    framing = SOURCE_FRAMING.get(source_type, SOURCE_FRAMING[\"teams_chat\"])\n    lines = [framing,\n             \"Window end date for resolving relative dates: {0}\".format(\n                 window_end_date),\n             \"\"]\n    for it in items:\n        lines.append(\"[{0}] {1} ({2}): {3}\".format(\n            it[\"item_no\"], it[\"author_name\"], it[\"timestamp\"], it[\"text\"]))\n    lines.append(\"\")\n    lines.append(\"Extract the work signals as a JSON array.\")\n    return [\n        {\"role\": \"system\", \"content\": system},\n        {\"role\": \"user\", \"content\": \"\\n\".join(lines)},\n    ]", "walk": [["Number every message and name every speaker", "numbered items make the AI's citations checkable by code"], ["State what counts and what must be ignored", "the ignore-list is battle scars: announcement dates, negation reversals, and hedge-handling each earned their line from a measured failure"]]}, {"symbol": "NEGATIVE_GUIDANCE", "blurb": "The do-not-emit list, and every clause is a scored failure rather than a guess: administrative dates read as deadlines, negations read affirmatively, hedged sightings suppressed instead of downgraded. Prompt text is versioned and diffed like code because it behaves like code -- and what it still cannot fix (deadline-removal, 3 of 3 at temperature 0) graduates to a guard in the worker.", "file": "extraction/extraction_prompts.py", "code": "NEGATIVE_GUIDANCE = \"\"\"Do NOT emit signals for:\n- opinions, preferences, or venting (\"this codebase is a mess\")\n- questions with no commitment attached (\"should we upgrade Postgres?\")\n- hypotheticals and conditionals that were not agreed to (\"if we ever get\n  budget, we could...\")\n- work described as finished LONG AGO and merely referenced (\"back when I\n  built the pipeline...\")\n- meta-conversation about the meeting itself (scheduling the next call,\n  minute-taking)\n- pleasantries, greetings, or acknowledgments\n- administrative, HR, facilities, or social announcements, EVEN WHEN they\n  contain concrete dates. \"benefits enrollment closes friday\" is not a\n  deadline_signal -- there is no work item. A date only matters if it is\n  attached to actual work someone will do.\n\nNEGATIONS AND REVERSALS -- read the direction of the statement:\n- \"we are NOT doing X\" / \"park X\" / \"X is descoped\" -> this is a\n  cancellation signal (or nothing), never a proposal or assignment for X.\n- \"X is no longer blocked\" / \"unblocked\" -> blocker_resolved or a\n  status_update, NEVER a blocker.\n- \"the deadline on X is dropped/removed\" -> NOT a deadline_signal.\n  deadline_signal means a date was set or changed TO something. A removed\n  deadline with no new date is at most a status_update; if unsure, emit\n  nothing for it.\n\nDO emit (commonly missed):\n- passing references to known work (\"this overlaps with the OCR fix\",\n  \"same area as the drift monitor\") -> task_mention. Sightings matter even\n  with nothing new to say; report every distinct task referenced.\n- hedged secondhand reports (\"i think Dev finished the docs refresh?\") ->\n  emit the completion_claim with LOWER confidence and basis \"inferred\".\n  Hedging affects confidence, not existence. Only suppress when you cannot\n  tell which task is meant at all.\nOne real signal beats three speculative ones, but a hedged sighting of\nreal work is a real signal.\"\"\"", "walk": [["Every rule here is a mistake that actually happened", "none of this is guesswork about what an AI might get wrong; each line was written after a scored benchmark run caught the error and named the sentence that caused it"], ["A date on the calendar is not a deadline on the work", "'benefits enrollment closes friday' was becoming a due date, so announcements are now ruled out by name -- a date only counts when work is attached to it"], ["Read the direction of a sentence, not its keywords", "'we are not doing X' and 'X is no longer blocked' both contain the words of the thing they deny; reversals are spelled out so they are not read forwards"], ["Hedging lowers confidence, it does not erase the sighting", "'i think Dev finished the docs refresh?' was being dropped entirely; it is now reported with lower confidence, and the downstream gates decide what it is worth"], ["What the prompt cannot fix moves into code", "one misread survived every attempt to phrase it away -- reading 'the deadline is dropped' as a new deadline, three times out of three at temperature zero -- so that pattern is now deleted by a guard in the worker, with the reason recorded"]]}, {"symbol": "RECAP_GUIDANCE", "blurb": "A summary about a conversation is not the conversation, and cannot witness a state change however much a bullet sounds like one. Recaps emit sightings only; the worker deletes any completion, blocker or deadline the model invents anyway, and demotes any owner basis stronger than inferred -- nobody said anything for it to have heard.", "file": "extraction/extraction_prompts.py", "code": "RECAP_GUIDANCE = \"\"\"\nMEETING RECAP -- read this before extracting anything below.\nThese items are NOT things people said. They are subjects a summariser\nreported each person as having discussed, so treat them as sightings of\nwork, not as claims about it.\n\n- Emit task_mention, and nothing else. A recap cannot witness a state\n  change: it does not record that work started, finished, slipped, got\n  blocked or got cancelled, however much a bullet may sound like it.\n  \"Readiness for rollout\" is a subject, not a completion.\n- NEVER emit completion_claim, blocker, blocker_resolved, deadline_signal,\n  cancellation, or status_update from a recap. If a bullet seems to say\n  one of those, it is the summariser's phrasing, not somebody's report.\n- The person a bullet sits under discussed it. That is worth recording as\n  an owner_candidate with basis \"inferred\" and modest confidence -- but it\n  is a weaker fact than \"they said they would do it\", and it must never be\n  promoted to self_reference or explicit_assignment, neither of which a\n  recap can evidence.\n- A bullet naming a second person (\"handing the template work to Priya\")\n  still gets basis \"inferred\" on that person. A summary of an assignment\n  is not the assignment.\n- Do not merge bullets, and do not invent detail to make one sound like a\n  task. Report the subject in the words given.\"\"\"", "walk": [["A summary of a meeting did not attend the meeting", "it can tell you a subject came up; it cannot tell you the work finished, slipped, or got stuck, however much a bullet may sound like it did"], ["So a recap is allowed to report sightings and nothing else", "and the code deletes any completion or blocker the model invents anyway, because a rule the model merely agreed to is not a rule"], ["'Discussed by' is not 'owns'", "any confidence stronger than an inference is demoted -- nobody actually said anything for it to have heard"]]}, {"symbol": "ATTRIBUTION_SPEC", "blurb": "Who owns the work, and the fourth answer most prompts forget: nobody. Given three bases and no permission to return none, the model pinned impersonal sentences on whoever said them -- so 'no first person and no name -> empty' is stated as a structural rule, not a confidence threshold, because 'when in doubt' is what produced the guessing.", "file": "extraction/extraction_prompts.py", "code": "ATTRIBUTION_SPEC = \"\"\"For owner_candidates, name who would DO the work, and classify how you know:\n- explicit_assignment: the work is directed at a named person -- handed over\n  (\"assigning this to Dev\") or addressed to them as a request (\"Priya, can\n  you take the IAM role?\"). The owner is the person ADDRESSED, never the\n  speaker who addressed them.\n- self_reference: the speaker takes the work on themselves. This is about\n  first person, not about signal type -- \"I'll handle the deploy\", \"I'm\n  blocked on the migration until access clears\", and \"finished the OCR fix\n  yesterday\" are all self_reference, because in each one the person speaking\n  is the person doing the work. Transcripts routinely drop the leading \"I\":\n  \"will start on the audit tomorrow\" and \"picking that up after standup\" are\n  still first person.\n- inferred: a named person is tied to the work more weakly -- someone reports\n  on a third party (\"i think Dev finished the docs refresh\"), or a pronoun\n  you resolved yourself. The owner is the person NAMED, not the person doing\n  the reporting.\n\nLEAVE owner_candidates EMPTY WHEN THE SENTENCE IDENTIFIES NOBODY. An empty\nlist is a normal, frequent, CORRECT answer -- not a failure to try. Apply it\nstructurally: if there is no first person AND no person named, there is no\nowner to report, however obvious a guess might feel.\n- impersonal subjects: \"the retention sweep is stuck waiting on the platform\n  team\", \"the migration needs to land before the audit\", \"that one is no\n  longer blocked\" -> EMPTY. Work being stuck or due says nothing about who\n  holds it.\n- collective or nobody in particular: \"let's get the intake form scoped\",\n  \"we should prioritise this\", \"someone should look at it\" -> EMPTY.\n- Raising a topic is not owning it. The speaker is NOT the owner merely\n  because the speaker is the one who brought the work up.\nEmitting a wrong owner is worse than emitting none: an unowned signal is\nrouted by the surrounding system, while a wrong one puts work on the wrong\nperson's board. Never fill the list just to have it non-empty.\"\"\"", "walk": [["Name who would do the work -- or name nobody", "an owner is only reported when the sentence actually identifies one: the speaker taking it on, or a person addressed by name"], ["Saying it out loud is not the same as owning it", "'the migration is stuck waiting on the platform team' names nobody, and pinning it on whoever raised it puts work on the wrong person's board"], ["Empty is a correct answer, so the prompt says so", "the rule is structural rather than a confidence bar, because a model told to guess when unsure will always find a candidate; an unowned signal still gets routed downstream, while a wrongly owned one has to be rejected by a human"]]}]}, {"name": "Worker & guards", "file": "extraction/extraction_worker.py", "components": [{"symbol": "ExtractionWorker.run_job", "blurb": "One window in, one schema-valid batch out, with deterministic content-hash ids -- the same transcript can never double-ingest.", "file": "extraction/extraction_worker.py", "code": "def run_job(self, job):\n    \"\"\"job: {source_type, source_ref, window_start, window_end,\n             resource_ids?}  ->  (batch dict, report dict)\n\n    The report carries what was dropped and why -- the worker's honesty\n    channel for prompt tuning.\"\"\"\n    items = self.fetcher(job)\n    report = {\"items\": len(items), \"raw_signals\": 0, \"kept\": 0,\n              \"dropped\": []}\n    batch_id = _sha(job[\"source_ref\"], job[\"window_start\"],\n                    job[\"window_end\"], PROMPT_VERSION)\n    batch = {\n        \"batch_id\": batch_id,\n        \"extracted_at\": self.clock().isoformat(),\n        \"extractor\": {\"model\": self.model_name,\n                      \"prompt_version\": PROMPT_VERSION},\n        \"window\": {\n            \"source_type\": job[\"source_type\"],\n            \"source_ref\": job[\"source_ref\"],\n            \"time_start\": job[\"window_start\"],\n            \"time_end\": job[\"window_end\"],\n        },\n        \"signals\": [],\n    }\n    if not items:\n        jsonschema.validate(batch, self.schema)\n        return batch, report\n\n    numbered = [dict(it, item_no=i + 1) for i, it in enumerate(items)]\n    messages = extraction_prompts.build_messages(\n        job[\"source_type\"], job[\"window_end\"][:10], numbered)\n    raw = self.llm(messages)\n\n    parsed, parse_err = _parse_json_array(raw)\n    if parse_err:\n        # A malformed array used to cost the whole window. On a window\n        # dense with contradictory claims the model can run to 15k\n        # characters and break the JSON near the end -- discarding the\n        # dozens of well-formed objects before the break, which were\n        # never in doubt. Salvage reads whole top-level objects and\n        # keeps the ones that parse.\n        parsed, broken = _salvage_objects(raw)\n        if not parsed:\n            report[\"dropped\"].append({\"reason\": \"unparseable_response\",\n                                      \"detail\": parse_err})\n            jsonschema.validate(batch, self.schema)\n            return batch, report\n        report[\"salvaged\"] = {\"objects\": len(parsed), \"broken\": broken,\n                              \"parse_error\": parse_err}\n    report[\"raw_signals\"] = len(parsed)\n\n    ev_type = SOURCE_TO_EVIDENCE[job[\"source_type\"]]\n    recap = job[\"source_type\"] in RECAP_SOURCE_TYPES\n    by_no = {it[\"item_no\"]: it for it in numbered}\n    seen_ids = set()\n    for idx, sig in enumerate(parsed):\n        # A recap cannot witness a state change. The prompt says so at\n        # length; this is the part that does not depend on the model\n        # having listened. Everything a summary can honestly support is\n        # a sighting of work, so anything else is deleted with its\n        # reason recorded rather than trusted.\n        if recap and isinstance(sig, dict) \\\n                and sig.get(\"type\") not in RECAP_ALLOWED_TYPES:\n            report[\"dropped\"].append({\n                \"index\": idx, \"reason\": \"recap_cannot_witness_state\",\n                \"title\": _safe_title(sig)})\n            continue\n        built, why = self._build_signal(sig, idx, batch_id, ev_type, by_no)\n        if built is None:\n            report[\"dropped\"].append({\"index\": idx, \"reason\": why,\n                                      \"title\": _safe_title(sig)})\n            continue\n        if built[\"signal_id\"] in seen_ids:\n            report[\"dropped\"].append({\"index\": idx, \"reason\": \"duplicate\",\n                                      \"title\": built[\"title\"]})\n            continue\n        if recap:\n            # Nor can it evidence how firmly somebody owns the work.\n            # \"Discussed by\" is an inference; the stronger bases mean\n            # a person said something, and nobody said anything here.\n            for cand in built.get(\"owner_candidates\") or []:\n                if cand.get(\"basis\") != \"inferred\":\n                    cand[\"basis\"] = \"inferred\"\n                    cand[\"confidence\"] = min(\n                        float(cand.get(\"confidence\") or 0.5), 0.6)\n        seen_ids.add(built[\"signal_id\"])\n        batch[\"signals\"].append(built)\n        report[\"kept\"] += 1\n\n    jsonschema.validate(batch, self.schema)\n# ... 1 more lines", "walk": [["Send one window to the AI, get typed claims back", "one call per window, deterministic ids from content hashes"], ["Run every claim through the guard gauntlet", "the AI proposes; code disposes"], ["Emit a schema-valid batch no matter what", "even a fully garbled AI answer yields a clean empty batch, not a crash"]]}, {"symbol": "_salvage_objects", "blurb": "Per-signal salvage does nothing when the ARRAY breaks: one stray character lost a whole window, 14,899 characters that broke at 6,847. This re-reads such a response for whole objects and recovered 41 from a total loss. A reader, not a repairer -- a truncated tail is counted as broken, because a half-read signal is a fabricated one.", "file": "extraction/extraction_worker.py", "code": "def _salvage_objects(raw):\n    \"\"\"Whole top-level JSON objects from a response the parser rejected.\n\n    Returns (objects, broken_count). Scans for brace-balanced spans while\n    respecting string literals and escapes, so a title containing a brace\n    or a quote does not shift the depth count. Nested objects (deadline,\n    blocker) are inside their parent's span and are never emitted alone.\n\n    Deliberately not a JSON repair: nothing is patched, closed, or guessed.\n    A fragment either parses exactly as the model wrote it or is counted as\n    broken, because a half-read signal is a fabricated one -- and the report\n    carries both numbers so a window that needed salvage is visible rather\n    than quietly thinner than it should be.\n    \"\"\"\n    text = raw or \"\"\n    out = []\n    broken = 0\n    depth = 0\n    start = None\n    in_str = False\n    esc = False\n    for i, ch in enumerate(text):\n        if in_str:\n            if esc:\n                esc = False\n            elif ch == \"\\\\\":\n                esc = True\n            elif ch == '\"':\n                in_str = False\n            continue\n        if ch == '\"':\n            in_str = True\n        elif ch == \"{\":\n            if depth == 0:\n                start = i\n            depth += 1\n        elif ch == \"}\":\n            if depth > 0:\n                depth -= 1\n                if depth == 0 and start is not None:\n                    try:\n                        obj = json.loads(text[start:i + 1])\n                    except ValueError:\n                        broken += 1\n                    else:\n                        if isinstance(obj, dict):\n                            out.append(obj)\n                        else:\n                            broken += 1\n                    start = None\n    if depth > 0 and start is not None:\n        broken += 1              # truncated tail: never guess its closing\n    return out, broken", "walk": [["One bad character used to cost a whole meeting", "the reply is a list, and a list that breaks anywhere fails to parse everywhere -- fourteen thousand characters thrown away over a fault near the end"], ["Now the good entries are read out one at a time", "forty-one usable signals recovered from a response that had produced nothing at all"], ["Nothing is patched to make it fit", "a half-written entry is counted as lost rather than guessed at, because a half-read claim is an invented one"]]}, {"symbol": "ExtractionWorker._build_signal", "blurb": "The guard gauntlet. Missing confidence defaults to 0.6 (small models omit it; dropping cost us 5/5 signals on the first live run). Deadline-removal language is deleted in code after the prompt lost 3/3 at temperature 0.", "file": "extraction/extraction_worker.py", "code": "def _build_signal(self, sig, idx, batch_id, ev_type, by_no):\n    if not isinstance(sig, dict):\n        return None, \"not_an_object\"\n    stype = sig.get(\"type\")\n    if stype not in VALID_TYPES:\n        return None, \"bad_type:{0}\".format(stype)\n    title = (sig.get(\"title\") or \"\").strip()\n    if not title:\n        return None, \"missing_title\"\n    title = title[:120]\n\n    # Deterministic guard: deadline_signal means a date was SET or\n    # CHANGED TO something. Removal language (\"the deadline is\n    # dropped\") repeatedly extracts as deadline_signal despite prompt\n    # guidance (measured: 3/3 at temperature 0 on mistral-small3.1),\n    # so the guard lives in code, where it fails safe: a removed\n    # deadline warranted at most a status note.\n    if stype == \"deadline_signal\":\n        probe = \" \".join([title, sig.get(\"description\") or \"\",\n                          ((sig.get(\"deadline\") or {}) or {})\n                          .get(\"raw_text\") or \"\"]).lower()\n        if \"deadline\" in probe and any(\n                w in probe for w in (\"remove\", \"dropped\", \"drop the\",\n                                     \"no longer\", \"cancelled\",\n                                     \"canceled\", \"lifted\", \"scrapped\",\n                                     \"no date\")):\n            return None, \"deadline_removal_language\"\n\n    conf = _num(sig.get(\"confidence\"))\n    if conf is None:\n        conf = 0.6\n    conf = max(0.0, min(1.0, conf))\n\n    cited = sig.get(\"evidence_items\") or []\n    evidence = []\n    primary = None\n    for n in cited:\n        it = by_no.get(n if isinstance(n, int) else _int_or_none(n))\n        if it is None:\n            continue\n        if primary is None:\n            primary = it\n        evidence.append({\n            \"source_type\": ev_type,\n            \"resource_id\": it[\"resource_id\"],\n            \"span\": None,\n            \"content_hash\": _sha(it[\"text\"]),\n        })\n    if not evidence:\n        return None, \"no_valid_evidence\"\n    # Who SAID it, as opposed to who the work is for. The speaker comes\n    # from the window item, never from the model -- authorship is a\n    # transport fact and must not be something a model can hallucinate.\n    author_ref = None\n    if primary is not None:\n        author_ref = (primary.get(\"author_ref\")\n                      or self.directory.get(primary.get(\"author_name\")))\n\n    status = sig.get(\"status_signal\")\n    if status == \"null\":\n        status = None\n    if status not in VALID_STATUS:\n        return None, \"bad_status:{0}\".format(status)\n\n    deadline = self._clean_deadline(sig.get(\"deadline\"))\n    blocker = self._clean_blocker(sig.get(\"blocker\"))\n    owners = self._resolve_owners(sig.get(\"owner_candidates\") or [])\n    if not owners and primary is not None:\n        owners = _self_commitment_owner(primary, author_ref)\n\n    signal_id = _sha(batch_id, stype, evidence[0][\"resource_id\"], title)\n    built = {\n        \"signal_id\": signal_id,\n        \"type\": stype,\n        \"title\": title,\n        \"author_ref\": author_ref,\n        \"description\": (sig.get(\"description\") or None),\n        \"owner_candidates\": owners,\n        \"status_signal\": status,\n        \"deadline\": deadline,\n        \"blocker\": blocker,\n        \"confidence\": round(conf, 3),\n        \"evidence\": evidence,\n    }\n    # description key must be a string if present; drop None to keep\n    # the object minimal and schema-clean.\n    if built[\"description\"] is None:\n        del built[\"description\"]\n    return built, None", "walk": [["Validate one claim field by field", "type, title, citations, dates -- each checked against what is actually in the window"], ["Default missing confidence instead of dropping", "small AIs often omit it; dropping cost five of five claims on the first live run"], ["Delete deadline-removal language in code", "the AI misread 'deadline is dropped' three of three times at temperature zero, so code took over"]]}, {"symbol": "ExtractionWorker._resolve_owners", "blurb": "Display names (Alexander/Alex/AM) resolve to person_refs via the directory; unknown people are dropped, bad bases demoted to inferred -- attribution feeds gates, so it fails conservative.", "file": "extraction/extraction_worker.py", "code": "def _resolve_owners(self, raw):\n    out = []\n    for cand in raw:\n        if not isinstance(cand, dict):\n            continue\n        name = (cand.get(\"name\") or \"\").strip().casefold()\n        ref = self.directory.get(name)\n        if ref is None:\n            continue   # schema forbids display names; unmappable dropped\n        basis = cand.get(\"basis\")\n        if basis not in VALID_BASIS:\n            basis = \"inferred\"\n        conf = _num(cand.get(\"confidence\"))\n        out.append({\"person_ref\": ref,\n                    \"confidence\": max(0.0, min(1.0, conf if conf is not None else 0.5)),\n                    \"basis\": basis})\n    return out", "walk": [["Match spoken names to known people", "Alexander, Alex, and AM must all land on the same person"], ["Drop unknowns, demote shaky claims", "ownership drives approvals downstream, so it fails conservative"]]}]}], "plain": "One AI call per window turns conversation into typed claims: assignments, status, blockers, completions. Every claim must cite its message, and code -- not the AI -- gets the last word on what survives.", "steps": [["The AI reads numbered messages and answers in a strict format", "numbering makes citations checkable; the format makes bad answers detectable"], ["Good claims are salvaged from bad answers", "one malformed claim never sinks the batch; each is kept or dropped individually, with the reason recorded"], ["Uncheckable claims are deleted", "a claim citing a message that does not exist, or naming a person we do not know, dies here -- measured result: zero fabrications on two synthetic corpora"], ["Known AI blind spots are handled in code", "the model kept reading 'the deadline is dropped' as a new deadline (three out of three tries), so a deterministic guard deletes that pattern with a recorded reason"]], "l1": ["Read each window once and pull out task claims", "a local AI names who owns what, citing the exact message for every claim; anything it cannot back up is deleted on the spot"]}, {"id": "pool", "kind": "stage", "stage": "03", "name": "Pool", "color": "#6B615C", "note": "signals wait, idempotently --\nheld work re-enters on its own", "blurb": "An append-only pool per person. Signals a later gate can't decide on are simply not consumed -- no timers, no state machine -- so corroboration that arrives next week meets the claim from last Tuesday.", "modules": [{"name": "Store", "file": "extraction/signal_store_pg.py", "components": [{"symbol": "write_batch", "blurb": "Idempotent on content-hash ids: re-running extraction over the same window inserts zero rows. Pooling routes to owner candidates, else window participants.", "file": "extraction/signal_store_pg.py", "code": "def write_batch(dsn, batch, fallback_users, broadcast_unowned=False):\n    \"\"\"Returns {\"signals_inserted\": n, \"pool_events\": m, \"already_present\": k,\n    \"routed_to_author\": n, \"unrouted\": n}.\"\"\"\n    conn = psycopg2.connect(dsn)\n    out = {\"signals_inserted\": 0, \"pool_events\": 0, \"already_present\": 0,\n           \"routed_to_author\": 0, \"unrouted\": 0}\n    try:\n        with conn:\n            with conn.cursor() as cur:\n                w = batch[\"window\"]\n                cur.execute(\"\"\"\n                    INSERT INTO extraction_batches\n                      (batch_id, extracted_at, extractor_model, prompt_version,\n                       source_type, source_ref, window_start, window_end)\n                    VALUES (%s,%s,%s,%s,%s,%s,%s,%s)\n                    ON CONFLICT (batch_id) DO NOTHING\"\"\",\n                    (batch[\"batch_id\"], batch[\"extracted_at\"],\n                     batch[\"extractor\"][\"model\"],\n                     batch[\"extractor\"][\"prompt_version\"],\n                     w[\"source_type\"], w[\"source_ref\"],\n                     w[\"time_start\"], w[\"time_end\"]))\n                for s in batch[\"signals\"]:\n                    d = s.get(\"deadline\") or {}\n                    b = s.get(\"blocker\") or {}\n                    cur.execute(\"\"\"\n                        INSERT INTO signals\n                          (signal_id, batch_id, signal_type, title, description,\n                           status_signal, confidence, deadline_date,\n                           deadline_precision, deadline_raw, blocker_desc,\n                           blocker_party, author_ref, owner_candidates, raw)\n                        VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s)\n                        ON CONFLICT (signal_id) DO NOTHING\"\"\",\n                        (s[\"signal_id\"], batch[\"batch_id\"], s[\"type\"],\n                         s[\"title\"], s.get(\"description\"),\n                         s.get(\"status_signal\"), s[\"confidence\"],\n                         d.get(\"date\"), d.get(\"precision\"), d.get(\"raw_text\"),\n                         b.get(\"description\"), b.get(\"blocking_party_ref\"),\n                         s.get(\"author_ref\"),\n                         json.dumps(s.get(\"owner_candidates\") or []),\n                         json.dumps(s)))\n                    if cur.rowcount == 0:\n                        out[\"already_present\"] += 1\n                        continue\n                    out[\"signals_inserted\"] += 1\n                    for i, ev in enumerate(s[\"evidence\"], start=1):\n                        span = ev.get(\"span\") or {}\n                        cur.execute(\"\"\"\n                            INSERT INTO evidence_refs\n                              (signal_id, ordinal, source_type, resource_id,\n                               span_start, span_end, content_hash)\n                            VALUES (%s,%s,%s,%s,%s,%s,%s)\n                            ON CONFLICT DO NOTHING\"\"\",\n                            (s[\"signal_id\"], i, ev[\"source_type\"],\n                             ev[\"resource_id\"], span.get(\"start\"),\n                             span.get(\"end\"), ev.get(\"content_hash\")))\n                    targets, how = pool_targets(s, fallback_users,\n                                                broadcast_unowned)\n                    if how == \"author\":\n                        out[\"routed_to_author\"] += 1\n                    elif how == \"unrouted\":\n                        out[\"unrouted\"] += 1\n                    for user in targets:\n                        cur.execute(\"\"\"\n                            INSERT INTO signal_pool_events\n                              (signal_id, user_ref, event, run_id)\n                            VALUES (%s,%s,'pooled',%s)\"\"\",\n                            (s[\"signal_id\"], user, batch[\"batch_id\"]))\n                        out[\"pool_events\"] += 1\n        return out\n    finally:\n        conn.close()", "walk": [["Insert the batch under content-hash identity", "the same window re-processed inserts zero rows -- ever"], ["Pool each claim to the people it concerns", "owner candidates first, window participants as fallback"]]}]}, {"name": "Pool reads", "file": "reconciler/board_io_pg.py", "components": [{"symbol": "load_signals", "blurb": "v_unconsumed_signals is the single source of 'what awaits reconciliation' -- latest pool event wins, so holds and returns are just rows.", "file": "reconciler/board_io_pg.py", "code": "def load_signals(dsn, user_ref):\n    conn = psycopg2.connect(dsn)\n    try:\n        with conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:\n            cur.execute(\"\"\"\n                SELECT s.signal_id, s.signal_type, s.title, s.description,\n                       s.status_signal, s.confidence::float AS confidence,\n                       s.deadline_date, s.deadline_precision, s.deadline_raw,\n                       s.blocker_desc, s.blocker_party,\n                       s.owner_candidates, s.raw, s.author_ref,\n                       -- How long this has been waiting for us. A signal\n                       -- held for a task that does not exist yet must wait,\n                       -- but not forever; the reconciler expires it against\n                       -- corroboration.window_days rather than growing the\n                       -- pool without bound.\n                       (SELECT min(pe.occurred_at) FROM signal_pool_events pe\n                         WHERE pe.signal_id = s.signal_id\n                           AND pe.user_ref = s.user_ref) AS pooled_at\n                FROM v_unconsumed_signals s\n                WHERE s.user_ref = %s\"\"\", (user_ref,))\n            rows = [dict(r) for r in cur.fetchall()]\n            now = datetime.datetime.now(datetime.timezone.utc)\n            for r in rows:\n                raw = r.pop(\"raw\") or {}\n                r[\"evidence\"] = raw.get(\"evidence\") or []\n                pooled = r.pop(\"pooled_at\", None)\n                r[\"pooled_days\"] = (\n                    None if pooled is None\n                    else max(0.0, (now - pooled).total_seconds() / 86400.0))\n                if r[\"deadline_date\"] is not None:\n                    r[\"deadline_date\"] = r[\"deadline_date\"].isoformat()\n                if isinstance(r[\"owner_candidates\"], str):\n                    r[\"owner_candidates\"] = json.loads(r[\"owner_candidates\"])\n            return rows\n    finally:\n        conn.close()", "walk": [["Read each person's waiting claims", "one view answers 'what awaits' -- the latest ledger entry per claim wins"]]}, {"symbol": "load_board", "blurb": "The matchable board: alias sets, open blockers, deadlines, and task AGE -- which the completion youth-gate reads (a seconds-old task held its own 'done' echo in live testing, exactly as designed).", "file": "reconciler/board_io_pg.py", "code": "def load_board(dsn, user_ref):\n    conn = psycopg2.connect(dsn)\n    try:\n        with conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:\n            cur.execute(\"\"\"\n                SELECT t.task_id, t.title, t.status, t.owner_ref,\n                       t.deadline, t.created_at,\n                       COALESCE(array_agg(a.alias)\n                         FILTER (WHERE a.alias IS NOT NULL), '{}') AS aliases\n                FROM tasks_current t\n                LEFT JOIN task_aliases a USING (task_id)\n                WHERE t.user_ref = %s AND t.merged_into IS NULL\n                  AND (t.status NOT IN ('completed','cancelled')\n                       OR t.updated_at > now() - interval '14 days')\n                GROUP BY t.task_id\"\"\", (user_ref,))\n            tasks = []\n            for r in cur.fetchall():\n                r = dict(r)\n                cur.execute(\"\"\"\n                    SELECT blocker_id, description FROM task_blockers\n                    WHERE task_id = %s AND resolved_event_id IS NULL\"\"\",\n                    (r[\"task_id\"],))\n                blockers = [dict(b) for b in cur.fetchall()]\n                cur.execute(\"\"\"\n                    SELECT EXTRACT(epoch FROM now() - %s)/86400.0 AS age\n                    \"\"\", (r[\"created_at\"],))\n                age = float(cur.fetchone()[\"age\"])\n                tasks.append({\n                    \"task_id\": r[\"task_id\"], \"title\": r[\"title\"],\n                    \"status\": r[\"status\"], \"owner_ref\": r[\"owner_ref\"],\n                    \"deadline\": (r[\"deadline\"].isoformat()\n                                 if r[\"deadline\"] else None),\n                    \"aliases\": list(r[\"aliases\"]),\n                    \"age_days\": age,\n                    \"open_blockers\": blockers,\n                })\n            cur.execute(\"SELECT version FROM user_boards WHERE user_ref = %s\",\n                        (user_ref,))\n            row = cur.fetchone()\n            version = row[\"version\"] if row else 0\n            return tasks, version\n    finally:\n        conn.close()", "walk": [["Load the matchable board with its aliases and ages", "task age matters: a seconds-old task held its own 'done' echo in live testing, exactly as designed"]]}]}], "plain": "Claims do not act; they wait. The pool is an append-only ledger per person -- pooled, taken, returned -- so any moment's truth is just the latest entry, and history is never rewritten.", "steps": [["Every claim is written once, idempotently", "re-processing the same window inserts zero rows, so double-ingestion is structurally impossible"], ["Claims wait for sufficient evidence", "a completion nobody corroborated simply stays pooled; corroboration arriving next week meets it there"], ["The ledger never forgets", "when the Windows port failed mysteriously, the pooled-returned-taken trail diagnosed it in one read -- the audit design debugging itself"]], "l1": ["Let claims wait their turn", "each person's claims sit in a pool until the evidence is sufficient, so nothing is lost and nothing is rushed"]}, {"id": "reconcile", "kind": "stage", "stage": "04", "name": "Reconcile", "color": "#52619B", "note": "embeddings place, a judge verifies,\ngates decide what may even be proposed", "blurb": "Signals meet the board through similarity bands: auto-link above 0.90, an LLM judge in the gray zone, new-task below. Trust is proportional to blast radius -- closures are never auto-linked, and a malformed judge answer holds rather than guesses.", "modules": [{"name": "Matching bands", "file": "reconciler/reconciler.py", "components": [{"symbol": "Reconciler._match", "blurb": "The band logic plus its guards: closures always judged, cross-owner always judged, short titles penalized. mistral judged 'Fix intake OCR crash' onto 'Fix OCR crash in intake' at 0.95 on its first live outing.", "file": "reconciler/reconciler.py", "code": "def _match(self, sig, tasks, task_vecs, report):\n    \"\"\"-> {\"kind\": \"linked\"|\"subtask\"|\"new\", \"task_id\", \"similarity\",\n           \"note\", \"judge_conf\"}\"\"\"\n    th = self.policy[\"thresholds\"]\n    if not tasks:\n        return {\"kind\": \"new\", \"task_id\": None, \"similarity\": 0.0,\n                \"note\": \"no matchable tasks on board\", \"judge_conf\": None}\n\n    text = sig[\"title\"] + \"\\n\" + (sig.get(\"description\") or \"\")\n    svec = self.embed([text])[0]\n    scored = []\n    for t in tasks:\n        sims = [embedders.cosine(svec, v)\n                for v in task_vecs.get(t[\"task_id\"], [])]\n        sim = max(sims) if sims else 0.0\n        # Measured on `text`, not on the title, because `text` is what\n        # was embedded. The penalty is there because a two-word generic\n        # title over-matches everything; a signal carrying a description\n        # is not that signal, and charging it the penalty anyway pushed\n        # real matches under judge_floor -- which is not a weaker link,\n        # it is no judge call at all, and for a blocker that means the\n        # signal is discarded rather than held.\n        if len(text.split()) <= th[\"short_title_penalty\"][\"max_tokens\"]:\n            sim -= th[\"short_title_penalty\"][\"penalty\"]\n        scored.append((sim, t))\n    scored.sort(key=lambda p: -p[0])\n    best_sim, best = scored[0]\n\n    never_auto = (sig[\"signal_type\"]\n                  in th[\"auto_link_guards\"][\"never_auto_link_types\"])\n    owners = {c[\"person_ref\"] for c in sig.get(\"owner_candidates\") or []}\n    cross_owner = bool(owners) and best[\"owner_ref\"] not in owners\n\n    if (best_sim >= th[\"auto_link\"] and not never_auto\n            and not (cross_owner\n                     and th[\"auto_link_guards\"][\"never_auto_link_cross_owner\"])):\n        return {\"kind\": \"linked\", \"task_id\": best[\"task_id\"],\n                \"similarity\": best_sim, \"note\": None, \"judge_conf\": None}\n\n    if best_sim >= th[\"judge_floor\"] or (never_auto\n                                         and best_sim >= th[\"judge_floor\"] - 0.1):\n        verdict = self._judge(sig, [t for _, t in\n                                    scored[:self.policy\n                                           [\"candidate_generation\"]\n                                           [\"top_k_to_judge\"]]],\n                              {t[\"task_id\"]: s for s, t in scored},\n                              report)\n        if verdict is not None:\n            v, conf, tid, factor = verdict\n            if conf >= th[\"judge_accept_min\"]:\n                if v == \"same_task\":\n                    return {\"kind\": \"linked\", \"task_id\": tid,\n                            \"similarity\": best_sim, \"note\": factor,\n                            \"judge_conf\": conf}\n                if v == \"subtask_of\":\n                    return {\"kind\": \"subtask\", \"task_id\": tid,\n                            \"similarity\": best_sim, \"note\": factor,\n                            \"judge_conf\":
