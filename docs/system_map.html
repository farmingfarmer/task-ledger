ranscript. Use arrow keys to navigate between \"\n                       \"transcript entries. Select an entry to\")\n            out.append(\"navigate the media to the time of the entry.\")\n            out.append(\"\")\n            out.extend([\"?\", \"?\", \"?\"])\n        out.append(\"AI-generated content may be incorrect\")\n        out.append(\"\")\n\n        last = None\n        for ui, (who, sec, text) in enumerate(utts):\n            label = CAST[who]\n            if label != last:\n                # A new block: the name alone, then the doubled offset line.\n                out.append(label)\n                out.append(long_offset(sec) + short_offset(sec))\n                last = label\n            out.append(\"{0} {1}\".format(label, long_offset(sec)))\n            for line in wrapped(text, wrap_at):\n                out.append(line)\n            # The avatar initials Teams sometimes leaves behind.\n            if (mi, ui) == (0, 0):\n                out.append(\"MA\")\n            out.append(\"\")\n    return \"\\n\".join(out) + \"\\n\"", "walk": [["The demo should read the file the meeting actually produces", "not an inbox window that skips the parsing entirely, which is the half most likely to break on a real export"], ["So it writes Word's output, artefacts and all", "the doubled offset, the repeated speaker line, the wrapped navigation blurb, the initials beside an avatar"]]}, {"symbol": "build_golden", "blurb": "Every planted claim carries its expected owner and basis, keyed to the resource ids the ingester will mint, so attribution is measured rather than asserted. Scoring this set is what proved the labels wrong, not the model, on impersonal closures.", "file": "testdata/synth_transcripts.py", "code": "def build_golden(meetings):\n    ids = resource_ids(meetings)\n    golden = {}\n    for mi, (title, date, _s, _e, _u) in enumerate(meetings):\n        golden[window_name(title, date)] = {\"signals\": [], \"traps\": []}\n    for (mi, ui), label in sorted(GOLDEN.items()):\n        title, date = meetings[mi][0], meetings[mi][1]\n        entry = dict(label)\n        entry[\"evidence_hint\"] = ids[(mi, ui)]\n        golden[window_name(title, date)][\"signals\"].append(entry)\n    for (mi, ui), trap in sorted(TRAPS.items()):\n        title, date = meetings[mi][0], meetings[mi][1]\n        entry = dict(trap)\n        entry[\"evidence_hint\"] = ids[(mi, ui)]\n        golden[window_name(title, date)][\"traps\"].append(entry)\n    return golden", "walk": [["A claim is only useful if you know who should own it", "so every planted sentence carries its expected owner and basis, pinned to the resource id the ingester will mint"], ["Which is how the labels got caught being wrong", "an impersonal closure names nobody and the extractor returned no owner, correctly; the golden had claimed a self-reference, and scoring is what surfaced it"]]}]}, {"name": "Transcript demo builder", "file": "scripts/demo_transcript_build.py", "components": [{"symbol": "main", "blurb": "Carries each meeting the whole way -- extract, reconcile, decide -- before reading the next, because a completion needs a task to complete and a cold board has none. Extract-all-then-reconcile drops every closure and blocker as no_open_target, and drops are not errors.", "file": "scripts/demo_transcript_build.py", "code": "def main():\n    ap = argparse.ArgumentParser(description=__doc__.split(\"\\n\")[0])\n    ap.add_argument(\"source\", help=\"a transcripts .txt, or a directory of \"\n                                   \"already-ingested window JSONs\")\n    ap.add_argument(\"--dsn\", default=os.environ.get(\"TL_DEMO_DSN\")\n                    or os.environ.get(\"DB_DSN\"))\n    ap.add_argument(\"--work\", default=None,\n                    help=\"where ingested windows land (default: beside the \"\n                         \"transcript)\")\n    ap.add_argument(\"--directory\", help=\"JSON display name -> ref, for \"\n                                        \"people who never speak\")\n    ap.add_argument(\"--model\", default=\"mistral-small3.1\")\n    ap.add_argument(\"--embed-model\", default=\"nomic-embed-text\")\n    ap.add_argument(\"--judge-model\", default=\"mistral-small3.1\")\n    ap.add_argument(\"--decide-last\", action=\"store_true\",\n                    help=\"also decide the final meeting, leaving no review \"\n                         \"queue (default: its proposals are the queue)\")\n    ap.add_argument(\"--i-know-what-this-is\", action=\"store_true\",\n                    dest=\"override\")\n    args = ap.parse_args()\n    if not args.dsn:\n        raise SystemExit(\"set TL_DEMO_DSN or pass --dsn\")\n    name = demo_build.refuse_if_real(args.dsn, args.override)\n\n    if os.path.isdir(args.source):\n        work = args.source\n    else:\n        work = args.work or os.path.join(os.path.dirname(\n            os.path.abspath(args.source)) or \".\", \"windows\")\n        cmd = [sys.executable, os.path.join(ROOT, \"scripts\",\n                                            \"transcript_ingest.py\"),\n               args.source, \"--out\", work]\n        if args.directory:\n            cmd += [\"--directory\", args.directory]\n        sys.stdout.write(sh(cmd))\n\n    windows = windows_in(work)\n    if not windows:\n        raise SystemExit(\"no windows found in \" + work)\n    print(\"building {0} from {1} meeting(s), oldest first\".format(\n        name, len(windows)))\n\n    for i, (start, full, fname) in enumerate(windows):\n        last = (i == len(windows) - 1)\n        print(\"\\n[{0}/{1}] {2}\".format(i + 1, len(windows), fname))\n        sh([sys.executable, os.path.join(ROOT, \"extraction\", \"run_local.py\"),\n            \"--transcript\", full, \"--model\", args.model,\n            \"--write-db\", args.dsn])\n\n        users = pooled_users(args.dsn)\n        if not users:\n            print(\"  nothing pooled -- already built? re-running is safe.\")\n            continue\n        for user in users:\n            sh([sys.executable, os.path.join(ROOT, \"reconciler\",\n                                             \"run_reconcile.py\"),\n                \"--user\", user, \"--dsn\", args.dsn,\n                \"--embed-model\", args.embed_model,\n                \"--judge-model\", args.judge_model, \"--write\"])\n\n        # Decided before the next meeting is read: that is what gives the\n        # next meeting's completions and blockers a board to land on.\n        #\n        # Except the last one, which is left entirely undecided -- that IS\n        # the review queue. decide_for reserves a SHARE of each packet\n        # (len(props)//3), which rounds to nothing on packets this size, so\n        # asking it to hold a few back quietly held none and the demo came\n        # out with an empty queue and no human decision left to show.\n        total = {\"accepted\": 0, \"rejected\": 0, \"left\": 0}\n        if last and not args.decide_last:\n            _, undecided, _ = board_counts(args.dsn)\n            total[\"left\"] = undecided\n        else:\n            conn = psycopg2.connect(args.dsn)\n            try:\n                for user in users:\n                    s = demo_build.decide_for(conn, user, 0)\n                    for k in total:\n                        total[k] += s[k]\n            finally:\n                conn.close()\n        tasks, undecided, held = board_counts(args.dsn)\n        print(\"  {0} accepted, {1} rejected, {2} left waiting\"\n              \" | board {3} task(s), {4} undecided, {5} held\".format(\n                  total[\"accepted\"], total[\"rejected\"], total[\"left\"],\n                  tasks, undecided, held))\n\n    conn = psycopg2.connect(args.dsn)\n    try:\n        users = sorted(set(pooled_users(args.dsn)) | set(_board_users(conn)))\n# ... 9 more lines", "walk": [["A meeting cannot complete work that no board holds", "on a cold ledger every completion and every blocker is dropped as no_open_target, and dropped signals are not errors, so the demo just quietly comes out thin"], ["So each meeting goes the whole way before the next is read", "extracted, reconciled, and decided onto boards -- which is also exactly what the cadence tick does one day at a time"], ["The last meeting keeps its queue", "a demo needs a board with history AND something still waiting on a person, and those come from opposite ends"]]}]}, {"name": "Scorer", "file": "testdata/score_extraction.py", "components": [{"symbol": "score_window", "blurb": "Lenient on titles, strict on what feeds gates: type family, attribution, dates, trap hits. Duplicate sightings are deliberately unpunished -- dedup is the reconciler's job.", "file": "testdata/score_extraction.py", "code": "def score_window(golden, signals):\n    res = {\"golden\": len(golden[\"signals\"]), \"recovered\": 0,\n           \"attr_checked\": 0, \"attr_ok\": 0,\n           \"vague_checked\": 0, \"vague_ok\": 0,\n           \"trap_hits\": 0, \"trap_details\": [],\n           \"fabrications\": 0, \"extracted\": len(signals)}\n    used = set()\n    for g in golden[\"signals\"]:\n        best, best_i = 0.0, None\n        for i, s in enumerate(signals):\n            if i in used:\n                continue\n            ov = overlap(g[\"title_core\"], s[\"title\"] + \" \" +\n                         (s.get(\"description\") or \"\"))\n            if ov >= 0.5 and match_type(g, s[\"type\"]) and ov > best:\n                best, best_i = ov, i\n        if best_i is None:\n            res.setdefault(\"missed\", []).append(\n                {\"type\": g.get(\"type\") or \"/\".join(g.get(\"type_any\", [])),\n                 \"title\": g[\"title_core\"]})\n            continue\n        used.add(best_i)\n        res[\"recovered\"] += 1\n        s = signals[best_i]\n        if g.get(\"owner_ref\") and not g.get(\"mention_only\"):\n            res[\"attr_checked\"] += 1\n            cands = {c[\"person_ref\"]: c[\"basis\"]\n                     for c in s.get(\"owner_candidates\") or []}\n            basis_ok = (g.get(\"basis\") is None\n                        or cands.get(g[\"owner_ref\"]) == g[\"basis\"]\n                        or (g.get(\"third_party\")\n                            and g[\"owner_ref\"] in cands))\n            if g[\"owner_ref\"] in cands and basis_ok:\n                res[\"attr_ok\"] += 1\n        if g.get(\"deadline_precision\") == \"vague\":\n            res[\"vague_checked\"] += 1\n            dl = s.get(\"deadline\")\n            if dl is None or dl.get(\"date\") is None \\\n               or dl.get(\"precision\") == \"vague\":\n                res[\"vague_ok\"] += 1\n\n    for trap in golden[\"traps\"]:\n        for i, s in enumerate(signals):\n            if i in used:\n                continue\n            if overlap(trap[\"title_core\"], s[\"title\"]) >= 0.5 \\\n               and s[\"type\"] not in trap[\"acceptable\"]:\n                res[\"trap_hits\"] += 1\n                res[\"trap_details\"].append(\n                    {\"trap\": trap[\"trap\"], \"extracted_as\": s[\"type\"],\n                     \"title\": s[\"title\"]})\n                used.add(i)\n                break\n\n    # anything unmatched and not near ANY golden/trap title = fabrication\n    all_titles = ([g[\"title_core\"] for g in golden[\"signals\"]] +\n                  [t[\"title_core\"] for t in golden[\"traps\"]])\n    for i, s in enumerate(signals):\n        if i in used:\n            continue\n        if any(overlap(t, s[\"title\"]) >= 0.5 for t in all_titles):\n            continue   # duplicate sighting or family-mismatch: not counted\n        res[\"fabrications\"] += 1\n        res.setdefault(\"fabrication_titles\", []).append(\n            {\"type\": s[\"type\"], \"title\": s[\"title\"]})\n    return res", "walk": [["Match extracted claims to the answer key", "lenient on wording, strict on what feeds decisions: types, owners, dates"], ["Count traps and fabrications separately", "the failure kinds that erode trust get their own ledger lines"]]}, {"symbol": "match_type", "blurb": "Type families forgive defensible readings (completion-as-status) without forgiving trap readings -- the scorer grades meaning, not string equality.", "file": "testdata/score_extraction.py", "code": "def match_type(golden, extracted_type):\n    if \"type_any\" in golden:\n        return extracted_type in golden[\"type_any\"]\n    fam = TYPE_FAMILY.get(golden[\"type\"], {golden[\"type\"]})\n    return extracted_type in fam", "walk": [["Accept defensible readings, reject trap readings", "completion-read-as-status is forgivable; parked work revived is not -- the scorer grades meaning"]]}]}], "plain": "How we know the numbers. A seeded generator fakes messy workdays -- traps included -- and a scorer grades the real extraction against known answers. The harness itself is proven honest first.", "steps": [["Fake days include guaranteed hard cases", "negation traps, secondhand completions, vague deadlines, and name variants are never left to chance"], ["The scorer cannot be gamed", "a cheating AI scores 100%, an empty one scores 0% -- whatever the real model scores between those poles is real"], ["Failures become named fixes", "every miss and fabrication is printed with its text; prompt version 1.1 was built directly from that list and re-measured on an unseen day: 94% recall, zero traps, zero fabrications"]], "l1": ["Grade the AI on synthetic messy days", "a generator fakes realistic workplace chatter with traps, and a scorer measures exactly how well extraction holds up"]}, {"id": "cadence", "kind": "rail", "name": "Cadence & Resilience", "color": "#6E7431", "stage": "rail", "note": "weekdays 16:45 the system runs itself; a down Ollama degrades, never fails", "blurb": "launchd (or Task Scheduler) fires one tick: drain the inbox, reconcile, notify only if proposals await. Silence is an output; degraded is not failure. The supersede layer means unattended weeks cannot accumulate stale packets.", "modules": [{"name": "The tick", "file": "cadence/cadence_tick.py", "components": [{"symbol": "main", "blurb": "Inbox -> reconcile -> pending check -> maybe one notification. Exit 0 on an empty day AND on a down Ollama -- the log is the contract.", "file": "cadence/cadence_tick.py", "code": "def main():\n    dsn = os.environ.get(\"DB_DSN\")\n    user = os.environ.get(\"TL_USER\")\n    if not dsn or not user:\n        log(\"FATAL: DB_DSN and TL_USER are required\")\n        return 2\n    host = os.environ.get(\"OLLAMA_HOST_URL\", \"http://localhost:11434\")\n    inbox = os.path.expanduser(\n        os.environ.get(\"TL_INBOX\", \"~/task-ledger-inbox\"))\n    os.makedirs(inbox, exist_ok=True)\n\n    wire_paths()\n    log(\"tick start: user={0} inbox={1}\".format(user, inbox))\n    # Nothing below this line works without the store, so ask once, here.\n    # The check existed already but only guarded extraction, so an empty\n    # inbox skipped it and a stopped Postgres surfaced as an unhandled\n    # OperationalError several minutes into the reconcile -- three times in\n    # one day, each time reading as a crash rather than as a service that\n    # is not running. Portable Postgres is not a Windows service and does\n    # not come back by itself, so this is the ordinary case, not the\n    # exceptional one, and it deserves one readable line.\n    if not db_up(dsn):\n        log(\"FATAL: database unreachable at {0} -- nothing can be read or \"\n            \"written. Start it (deploy/windows/pg_start.bat on Windows) \"\n            \"and run again.\".format(_dsn_label(dsn)))\n        return 2\n    # A configured model that is not installed does not fail fast on its\n    # own: extraction calls time out per window, half an hour each, and\n    # the run \"completes\" having learned nothing. It happened twice in one\n    # week -- a paste from one machine naming a model only the other one\n    # has. Ollama being DOWN is not this check's business (the offline\n    # path holds work safely); a reachable Ollama that lacks the named\n    # model is a configuration error and gets one line, immediately.\n    missing = missing_models(host, [\n        os.environ.get(\"TL_EXTRACT_MODEL\", \"mistral-small3.1\"),\n        os.environ.get(\"TL_JUDGE_MODEL\", \"mistral-small3.1\"),\n        os.environ.get(\"TL_EMBED_MODEL\", \"nomic-embed-text\")])\n    if missing:\n        log(\"FATAL: model(s) not installed on this Ollama: {0}. \"\n            \"Installed: {1}. Set TL_*_MODEL to one of those or pull the \"\n            \"missing one.\".format(\n                \", \".join(missing),\n                \", \".join(installed_models(host) or []) or \"none\"))\n        return 2\n    # Echo the models actually received. A pasted `set` line that never\n    # reaches the program falls back to the default and logs nothing, so a\n    # run with the wrong model is indistinguishable from the one intended.\n    log(\"models: extract={0} judge={1} embed={2}\".format(\n        os.environ.get(\"TL_EXTRACT_MODEL\", \"mistral-small3.1(default)\"),\n        os.environ.get(\"TL_JUDGE_MODEL\", \"mistral-small3.1(default)\"),\n        os.environ.get(\"TL_EMBED_MODEL\", \"nomic-embed-text(default)\")))\n    # And the promotion bar in force, read from the same file the reconciler\n    # will read. An edit that never saved -- a mangled paste, a findstr that\n    # hung before it could confirm, a Notepad dialog nobody clicked -- is\n    # otherwise invisible: the tick runs, reports 0 promoted, and looks\n    # exactly like a policy change that was applied and did not work.\n    try:\n        import reconciler as _rec\n        _cp = _rec.load_policy().get(\"candidate_promotion\") or {}\n        log(\"promotion: mode={0} min_sightings={1} min_distinct_speakers={2} \"\n            \"window_days={3}\".format(\n                _cp.get(\"mode\"), _cp.get(\"min_sightings\"),\n                _cp.get(\"min_distinct_speakers\"), _cp.get(\"window_days\")))\n    except Exception as exc:                            # noqa: BLE001\n        log(\"promotion: policy unreadable ({0!r})\".format(exc))\n    try:\n        process_inbox(dsn, inbox, host,\n                      os.environ.get(\"TL_EXTRACT_MODEL\", \"mistral-small3.1\"),\n                      ollama_chat)\n        # Everyone with claims waiting, not just this tick's owner. The\n        # notification below stays about TL_USER -- one person is being\n        # poked -- but the other boards get their packets built rather than\n        # their claims ageing in the pool until somebody runs the CLI.\n        everyone = pooled_users(dsn, user)\n        if len(everyone) > 1:\n            log(\"reconcile: {0} user(s) have signals waiting\".format(\n                len(everyone)))\n        for who in everyone:\n            try:\n                run_reconcile(dsn, who, host,\n                              os.environ.get(\"TL_EMBED_MODEL\",\n                                             \"nomic-embed-text\"),\n                              os.environ.get(\"TL_JUDGE_MODEL\",\n                                             \"mistral-small3.1\"))\n            except Exception as exc:                    # noqa: BLE001\n                # One person's packet failing must not cost everyone else\n                # theirs; the tick reports it and carries on.\n                log(\"reconcile[{0}] FAILED: {1!r}\".format(who, exc))\n        n = pending_count(dsn, user)\n        if n > 0:\n# ... 26 more lines", "walk": [["Run the whole afternoon ritual", "ingest, reconcile, count pending, maybe notify"], ["Exit cleanly on empty days and down AIs", "degraded is not failure; the log is the contract"]]}, {"symbol": "run_reconcile", "blurb": "Ollama up: real embeddings and judge. Down: TokenEmbedder and no judge, so judge-band work holds for a better day instead of being guessed at.", "file": "cadence/cadence_tick.py", "code": "def run_reconcile(dsn, user, host, embed_model, judge_model):\n    import board_io_pg\n    import embedders\n    import reconciler as rec_mod\n\n    signals = board_io_pg.load_signals(dsn, user)\n    tasks, version = board_io_pg.load_board(dsn, user)\n    all_tasks = board_io_pg.load_all_boards(dsn)\n    candidates = board_io_pg.load_candidates(\n        dsn, user,\n        window_days=(rec_mod.load_policy().get(\"candidate_promotion\")\n                     or {}).get(\"window_days\"))\n    log(\"reconcile[{0}]: {1} pooled signals, {2} matchable tasks, {3} tasks \"\n        \"across all boards, {4} candidate(s), board v{5}\".format(\n            user, len(signals), len(tasks), len(all_tasks),\n            len(candidates), version))\n\n    if ollama_up(host):\n        embed = embedders.OllamaEmbedder(embed_model, host)\n        judge = ollama_chat(judge_model, host)\n        mode = \"ollama\"\n    else:\n        embed = embedders.TokenEmbedder()\n        judge = None\n        mode = \"offline (holds judge-band)\"\n    log(\"reconcile: mode={0}\".format(mode))\n\n    run_id = \"cadence-{0}\".format(\n        datetime.datetime.now().strftime(\"%Y%m%d-%H%M%S\"))\n    rec = rec_mod.Reconciler(embed=embed, judge_llm=judge)\n    packet, report = rec.reconcile(user, signals, tasks, version, run_id,\n                                   all_tasks=all_tasks,\n                                   candidates=candidates)\n    result = board_io_pg.write_packet(dsn, packet, report[\"consumed\"],\n                                     report[\"annotations\"], run_id,\n                                     report=report)\n    log(\"reconcile[{0}]: {1} proposals, {2} consumed, {3} held, \"\n        \"{4} candidate sighting(s), {5} promoted, superseded {6}\".format(\n            user, result[\"proposals\"], len(report[\"consumed\"]),\n            len(report[\"held\"]), len(report[\"candidate_sightings\"]),\n            len(report[\"candidate_promotions\"]), len(result[\"superseded\"])))\n    # A promotion count of zero has three quite different causes and they\n    # are worth telling apart without a psql session.\n    for h in (report.get(\"held_detail\") or [])[:8]:\n        log(\"    held: {0} \\u201c{1}\\u201d -- {2}\".format(\n            h[\"signal_type\"], h[\"title\"][:48],\n            \"closest \\u201c{0}\\u201d at {1:.2f}\".format(\n                h[\"closest\"][:40], h[\"similarity\"])\n            if h.get(\"closest\") and h.get(\"similarity\") is not None\n            else \"no plausible task on the board\"))\n    a = report.get(\"candidate_assessment\") or {}\n    if a.get(\"assessed\"):\n        log(\"  candidates[{0}]: {1} assessed against {2}; {3} short, \"\n            \"{4} uncitable, {5} promoted (best seen: {6} sighting(s), \"\n            \"{7} speaker(s))\".format(\n                user, a[\"assessed\"], a[\"bar\"], a[\"short\"], a[\"uncitable\"],\n                a[\"promoted\"], a[\"best_sightings\"], a[\"best_speakers\"]))\n    return result", "walk": [["Use the real AI when reachable, offline math when not", "offline mode still links the obvious and holds the uncertain"]]}]}, {"name": "Ask the ledger", "file": "ask/ask.py", "components": [{"symbol": "answer", "blurb": "Questions answered from rows, never by a model: routing is all the model would be allowed to do, and here even that is a regex. The branch that matters is the last one -- when nothing is confirmed it checks the held pool and reports 'someone said so' rather than 'so', which is the difference between a ledger and a rumour mill.", "file": "ask/ask.py", "code": "def answer(question, retriever, embed=None):\n    \"\"\"Answer from the ledger, or decline to.\n\n    retriever supplies rows already scoped to the asker (see\n    ask_io_pg.Retriever): .tasks(), .held(), .blocked(), .overdue(),\n    .meetings(), .history(task_id), .evidence(task_id).\n    \"\"\"\n    parsed = parse_question(question)\n    intent = parsed[\"intent\"]\n    out = {\"question\": parsed[\"question\"], \"intent\": intent,\n           \"facts\": [], \"unconfirmed\": [], \"refusal\": None,\n           \"headline\": \"\", \"scope_note\":\n               \"Answered from tasks you can see, and your own pooled claims.\"}\n\n    if not parsed[\"terms\"] and intent == \"search\":\n        out[\"refusal\"] = (\"Ask about a task, a person, a deadline, or a \"\n                          \"meeting -- for example \\\"what is blocked\\\" or \"\n                          \"\\\"status of the intake work\\\".\")\n        out[\"headline\"] = \"No question found.\"\n        return out\n\n    if intent == \"review_queue\":\n        pend = retriever.pending()\n        held = retriever.held()\n        out[\"unconfirmed\"] = [_held_item(h) for h in held]\n        if pend.get(\"undecided\"):\n            out[\"facts\"].append({\n                \"text\": \"{0} proposal(s) awaiting your review\".format(\n                    pend[\"undecided\"]),\n                \"task_id\": None, \"status\": None,\n                \"citations\": [{\"kind\": \"board\",\n                               \"what\": \"review packet, oldest \" +\n                                       (pend.get(\"oldest_at\") or \"\")[:10]}]})\n        out[\"headline\"] = _queue_headline(pend, held)\n    elif intent in (\"blocked_what\", \"blocked_on\"):\n        rows = retriever.blocked()\n        out[\"facts\"] = [_blocked_fact(r) for r in rows]\n        out[\"headline\"] = (\"{0} blocked\".format(len(rows)) if rows\n                           else \"Nothing on your boards is blocked.\")\n    elif intent == \"overdue\":\n        rows = retriever.overdue()\n        out[\"facts\"] = [_overdue_fact(r) for r in rows]\n        out[\"headline\"] = (\"{0} past its date\".format(len(rows)) if rows\n                           else \"Nothing is past its date.\")\n    elif intent == \"waiting\":\n        held = retriever.held()\n        out[\"unconfirmed\"] = [_held_item(h) for h in held]\n        out[\"headline\"] = (\"{0} claim(s) heard but not confirmed\".format(\n            len(held)) if held else \"Nothing is waiting.\")\n        if not held:\n            out[\"facts\"] = []\n    elif intent == \"meeting\":\n        rows = retriever.meetings(parsed[\"terms\"])\n        out[\"facts\"] = [_meeting_fact(m) for m in rows]\n        out[\"headline\"] = (\"{0} conversation(s)\".format(len(rows)) if rows\n                           else \"No conversation of yours matches that.\")\n    else:\n        # Subject questions: status, who, due, history, or a plain search.\n        hits = rank_tasks(parsed, retriever.tasks(), embed=embed)\n        if hits:\n            for score, task in hits[:3]:\n                out[\"facts\"].append(_task_fact(task, retriever, intent))\n            out[\"headline\"] = _subject_headline(intent, hits[0][1])\n        else:\n            # Nothing confirmed. Before saying \"no\", check whether the\n            # ledger heard something and is holding it -- that is a\n            # materially different answer and the one people need.\n            claims = _matching_claims(parsed, retriever.held())\n            if claims:\n                out[\"unconfirmed\"] = claims\n                out[\"refusal\"] = (\n                    \"Nothing confirmed on that. The ledger has \"\n                    \"{0} unconfirmed claim(s) about it -- heard, not \"\n                    \"corroborated, and not on any board.\".format(len(claims)))\n                out[\"headline\"] = \"Heard, not confirmed.\"\n            else:\n                out[\"refusal\"] = (\"The ledger has nothing on that. It only \"\n                                  \"knows what was said in the conversations \"\n                                  \"it processes, and only what a human then \"\n                                  \"confirmed.\")\n                out[\"headline\"] = \"Nothing in the ledger.\"\n    return out", "walk": [["Work out what kind of question it is", "blocked, overdue, waiting, who, a meeting, or a subject -- and each kind has its own shape of answer"], ["Answer from the board, in the board's own words", "every sentence is built from a stored row and carries the task it came from, so the answer cannot say anything the ledger does not hold"], ["Say 'heard, not confirmed' when that is the truth", "if the only thing on file is a claim nobody corroborated, it is reported as a claim with a name attached -- never restated as fact"], ["Say nothing when there is nothing", "no match and no claim means the honest answer is that the ledger has not heard about it"]]}]}, {"name": "Weekly digest", "file": "digest/digest_io_pg.py", "components": [{"symbol": "load_project", "blurb": "The stakeholder digest cannot leak the discussion behind a change, because this query never SELECTS a rationale, a decider, a confidence or an evidence pointer. Redaction by construction beats redaction by filter: there is no field here to forget to strip.", "file": "digest/digest_io_pg.py", "code": "def load_project(dsn, project_id, days=7):\n    \"\"\"Progress level by construction: no rationale, decider, confidence or\n    evidence appears in any of these selects.\"\"\"\n    win = \"%s days\" % int(days)\n    project = _rows(dsn, \"\"\"\n        SELECT project_id, name, owner_ref FROM projects\n        WHERE project_id = %s\"\"\", (project_id,))\n    if not project:\n        return None, {}\n\n    changes = _clean(_rows(dsn, \"\"\"\n        SELECT t.title, e.event_type, e.occurred_at, e.actor_type\n        FROM task_events e\n        JOIN tasks_current t ON t.task_id = e.task_id\n        WHERE t.project_id = %s AND e.occurred_at > now() - %s::interval\n        ORDER BY e.event_id DESC\"\"\", (project_id, win)), \"occurred_at\")\n\n    open_rows = _clean(_rows(dsn, \"\"\"\n        SELECT t.title, t.status, t.owner_ref, t.deadline,\n               (t.deadline IS NOT NULL AND t.deadline < CURRENT_DATE\n                AND t.status NOT IN ('completed','cancelled')) AS overdue\n        FROM tasks_current t\n        WHERE t.project_id = %s AND t.merged_into IS NULL\n          AND t.status NOT IN ('completed','cancelled')\n        ORDER BY t.deadline NULLS LAST\"\"\", (project_id,)), \"deadline\")\n\n    counts = _rows(dsn, \"\"\"\n        SELECT count(*) FILTER (WHERE status = 'in_progress') AS in_progress,\n               count(*) FILTER (WHERE status = 'blocked')     AS blocked,\n               count(*) FILTER (WHERE status = 'proposed')    AS proposed,\n               count(*) FILTER (WHERE status = 'completed')   AS completed\n        FROM tasks_current\n        WHERE project_id = %s AND merged_into IS NULL\"\"\", (project_id,))\n\n    return project[0], {\"changes\": changes, \"open\": open_rows,\n                        \"counts\": counts[0] if counts else {}}", "walk": [["Write the stakeholder's weekly note", "people who follow a project get what changed and where it stands, without having to open anything"], ["Leave the conversation out by not asking for it", "the query fetches titles, states and dates and nothing else -- so a digest sent to someone outside the team cannot quote a meeting they were not in, even by mistake"], ["Let the grant list decide who receives it", "recipients come from current access, so a share that expired or was withdrawn simply stops arriving"]]}]}, {"name": "Degradation", "file": "cadence/cadence_tick.py", "components": [{"symbol": "ollama_up", "blurb": "A 3-second reachability probe decides the tick's whole posture -- learned the hard way when a shared Ollama queue looked identical to a hung server.", "file": "cadence/cadence_tick.py", "code": "def ollama_up(host, timeout=3):\n    try:\n        with urllib.request.urlopen(host + \"/api/tags\", timeout=timeout):\n            return True\n    except Exception:\n        return False", "walk": [["Probe the AI for three seconds", "one cheap check decides the tick's whole posture -- learned when a busy AI queue looked identical to a dead one"]]}, {"symbol": "notify", "blurb": "Notifies only when pending > 0: osascript on macOS, the no-admin PowerShell toast on Windows, the log elsewhere. Suppressed in tests. Zero pending, zero noise.", "file": "cadence/cadence_tick.py", "code": "def notify(title, text):\n    \"\"\"Pop the platform's own notification. macOS: osascript. Windows: the\n    no-admin toast from deploy/windows, run through PowerShell with the\n    execution policy bypassed for this one process (the port's whole\n    premise is a locked-down machine where nothing may be installed or\n    configured). Anywhere else, and whenever the toast script is missing,\n    the line still lands in the tick log -- a notification that cannot be\n    shown must never fail the tick.\"\"\"\n    if os.environ.get(\"TL_NO_NOTIFY\") == \"1\":\n        log(\"notify suppressed: {0} -- {1}\".format(title, text))\n        return\n    if sys.platform == \"darwin\":\n        script = ('display notification \"{0}\" with title \"{1}\" '\n                  'sound name \"Glass\"').format(text.replace('\"', \"'\"),\n                                               title.replace('\"', \"'\"))\n        subprocess.run([\"osascript\", \"-e\", script], check=False)\n        return\n    if sys.platform == \"win32\":\n        toast = os.path.join(repo_root(), \"deploy\", \"windows\",\n                             \"windows_toast.ps1\")\n        if os.path.exists(toast):\n            log(\"notify (toast): {0} -- {1}\".format(title, text))\n            subprocess.run([\"powershell\", \"-ExecutionPolicy\", \"Bypass\",\n                            \"-File\", toast, \"-Text\",\n                            \"{0}: {1}\".format(title, text)], check=False)\n            return\n        log(\"notify (toast script missing at {0}): {1} -- {2}\".format(\n            toast, title, text))\n        return\n    log(\"notify ({0}): {1} -- {2}\".format(sys.platform, title, text))", "walk": [["Pop a notification only when reviews await", "zero pending means zero noise; tests stay silent"], ["Use whatever the machine actually has", "a Mac pops an alert, a locked-down Windows laptop pops its own toast, and anything else writes the line to the log -- a notification that cannot be shown never fails the tick"]]}]}], "plain": "The system runs itself. A scheduler fires one tick every weekday afternoon; silence is a valid outcome, and a down AI degrades the tick instead of failing it.", "steps": [["One tick: ingest, reconcile, maybe notify", "you hear from the system only when proposals await -- zero pending, zero noise"], ["A down AI means wait, never fail", "inbox files stay put, matching falls back to offline mode, uncertain items hold for a better day, and the tick still exits cleanly"], ["Unattended weeks cannot rot", "the supersede rule means packets never stack up no matter how long nobody looks"]], "l1": ["Run itself every weekday at 4:45", "new material is processed on schedule; you are pinged only when something needs a decision, and a down AI means wait, never fail"]}]}</script>
<script>
var DATA = JSON.parse(document.getElementById('atlas-data').textContent);
var state = {domain:null, module:null};
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;
if(txt!=null)e.textContent=txt;return e;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
.replace(/>/g,'&gt;');}
function highlight(code){
  var out='',i=0,src=code;
  var re=/(#[^\n]*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")/g,m;
  var parts=[];var last=0;
  while((m=re.exec(src))!==null){
    parts.push({t:'p',v:src.slice(last,m.index)});
    parts.push({t:m[1]?'c':'s',v:m[0]});last=re.lastIndex;}
  parts.push({t:'p',v:src.slice(last)});
  var kw=/\b(def|class|return|if|elif|else|for|while|try|except|finally|with|import|from|as|raise|not|and|or|in|is|None|True|False|lambda|yield|assert|continue|break|pass|global|nonlocal)\b/g;
  return parts.map(function(p){
    var e=esc(p.v);
    if(p.t==='c')return '<span class="tok-c">'+e+'</span>';
    if(p.t==='s')return '<span class="tok-s">'+e+'</span>';
    return e.replace(kw,'<span class="tok-k">$1</span>');
  }).join('');
}
function stepRow(parent,color,num,act,why){
  var row=el('div','step');
  var chip=el('span','stepchip',String(num));
  chip.style.setProperty('--sc',color);
  row.appendChild(chip);
  var body=el('span',null,'');
  var a=el('span','stepact',act);
  var w=el('span','stepwhy',' \u2014 '+why);
  body.appendChild(a);body.appendChild(w);row.appendChild(body);
  parent.appendChild(row);
}
function narHub(box){
  var wrap=el('div','plainwrap');
  wrap.appendChild(el('div','plainhead','THE PIPELINE IN PLAIN ENGLISH'));
  var stages=DATA.domains.filter(function(d){return d.kind==='stage';});
  var rails=DATA.domains.filter(function(d){return d.kind==='rail';});
  var n=0,i,d;
  for(i=0;i<stages.length;i++){d=stages[i];n++;
    stepRow(wrap,d.color,n,d.l1[0],d.l1[1]);}
  for(i=0;i<rails.length;i++){d=rails[i];n++;
    stepRow(wrap,d.color,n,d.l1[0]+' (runs alongside every step)',
            d.l1[1]);}
  box.appendChild(wrap);
}
function narDomain(box,dom){
  var wrap=el('div','plainwrap');
  wrap.appendChild(el('div','plainhead',
    'WHAT HAPPENS HERE, STEP BY STEP'));
  wrap.appendChild(el('div','stepwhy',dom.plain));
  for(var i=0;i<dom.steps.length;i++){
    stepRow(wrap,dom.color,i+1,dom.steps[i][0],dom.steps[i][1]);}
  box.appendChild(wrap);
}
function crumbs(){
  var c=document.getElementById('crumbs');c.innerHTML='';
  var a=el('a',null,'atlas');a.onclick=showHub;c.appendChild(a);
  if(state.domain){c.appendChild(el('span','sep','/'));
    var d=el('a',null,state.domain.name.toLowerCase());
    d.onclick=function(){showDomain(state.domain);};c.appendChild(d);}
  if(state.module){c.appendChild(el('span','sep','/'));
    c.appendChild(el('span',null,state.module.name.toLowerCase()));}
}
function setLayer(id){
  ['hub','domain','module'].forEach(function(l){
    document.getElementById('layer-'+l).classList.toggle('on',l===id);});
  crumbs();
}
function showHub(){state.domain=null;state.module=null;setLayer('hub');}
function showDomain(dom){state.domain=dom;state.module=null;
  var box=document.getElementById('layer-domain');box.innerHTML='';
  var head=el('div','domhead');var h=el('h2',null,'');
  var sw=el('span',null,(dom.kind==='stage'?dom.stage+' \u00b7 ':'')+dom.name);
  sw.style.borderBottom='3px solid '+dom.color;h.appendChild(sw);
  head.appendChild(h);head.appendChild(el('p',null,dom.blurb));
  box.appendChild(head);
  narDomain(box,dom);
  var W=Math.min(document.body.clientWidth-56,1200);
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',W);svg.setAttribute('height',46);
  var n=dom.modules.length;
  for(var i=0;i<n;i++){
    var x0=W/2, x1=(W/(n+1))*(i+1);
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M'+x0+',2 C'+x0+',30 '+x1+',12 '+x1+',44');
    p.setAttribute('fill','none');p.setAttribute('stroke',dom.color);
    p.setAttribute('stroke-opacity','0.45');p.setAttribute('stroke-width','1.5');
    svg.appendChild(p);}
  box.appendChild(svg);
  var cards=el('div','cards');
  dom.modules.forEach(function(mod){
    var c=el('div','card');c.style.setProperty('--dc',dom.color);
    c.appendChild(el('h3',null,mod.name));
    c.appendChild(el('div','meta',mod.components.length+
      (mod.components.length===1?' component':' components')));
    c.appendChild(el('div','meta',mod.file));
    c.onclick=function(){showModule(dom,mod);};cards.appendChild(c);});
  box.appendChild(cards);setLayer('domain');}
function showModule(dom,mod){state.domain=dom;state.module=mod;
  var box=document.getElementById('layer-module');box.innerHTML='';
  var head=el('div','domhead');
  var h=el('h2',null,dom.name+' \u00b7 '+mod.name);head.appendChild(h);
  box.appendChild(head);
  var ex=el('div','explorer');var chips=el('div','chips');
  var codebox=el('div','codebox');codebox.id='codebox';
  ex.appendChild(chips);ex.appendChild(codebox);box.appendChild(ex);
  mod.components.forEach(function(comp,i){
    var ch=el('div','chip',comp.symbol);
    ch.style.setProperty('--dc',dom.color);
    ch.onclick=function(){
      chips.querySelectorAll('.chip').forEach(function(x){
        x.classList.remove('active');});
      ch.classList.add('active');loadCode(dom,mod,comp);};
    chips.appendChild(ch);
    if(i===0){ch.classList.add('active');loadCode(dom,mod,comp);}});
  setLayer('module');}
function loadCode(dom,mod,comp){
  var cb=document.getElementById('codebox');cb.innerHTML='';
  var head=el('div','head');head.appendChild(el('span','tick',''));
  var path=el('span',null,comp.file+' \u00b7 ');
  var sym=el('b',null,comp.symbol);
  head.appendChild(path);head.appendChild(sym);cb.appendChild(head);
  cb.appendChild(el('div','blurb',comp.blurb));
  if(comp.walk){
    var pw=el('div','plainwrap');pw.style.margin='10px 14px';
    pw.appendChild(el('div','plainhead','PLAIN ENGLISH WALKTHROUGH'));
    for(var wi=0;wi<comp.walk.length;wi++){
      stepRow(pw,dom.color,wi+1,comp.walk[wi][0],comp.walk[wi][1]);}
    cb.appendChild(pw);
  }
  var pre=el('pre');pre.innerHTML=highlight(comp.code);cb.appendChild(pre);}
function buildHub(){
  var box=document.getElementById('layer-hub');
  var stages=DATA.domains.filter(function(d){return d.kind==='stage';});
  var rails=DATA.domains.filter(function(d){return d.kind==='rail';});
  var W=Math.min(document.body.clientWidth-56,1240);
  var IN=150, OUT=170, gap=18;
  var bw=(W-IN-OUT-gap*(stages.length-1))/stages.length;
  var H=250+rails.length*64;
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  var midY=118;
  function T(x,y,txt,fill,size,anchor,style){
    var t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x);t.setAttribute('y',y);
    t.setAttribute('fill',fill||'#1B2733');
    t.setAttribute('font-size',size||13);
    if(anchor)t.setAttribute('text-anchor',anchor);
    if(style==='i')t.setAttribute('font-style','italic');
    if(style==='b')t.setAttribute('font-weight','700');
    t.textContent=txt;svg.appendChild(t);return t;}
  T(4,midY+4,DATA.input,'#5B6B7A',13,null,'i');
  T(W-4,midY+4,DATA.output,'#5B6B7A',13,'end','i');
  stages.forEach(function(dom,i){
    var x=IN+i*(bw+gap);
    if(i>0){var a=document.createElementNS('http://www.w3.org/2000/svg','path');
      a.setAttribute('d','M'+(x-gap+2)+','+midY+' L'+(x-4)+','+midY);
      a.setAttribute('stroke','#5B6B7A');a.setAttribute('stroke-width','1.5');
      a.setAttribute('marker-end','url(#arr)');svg.appendChild(a);}
    var g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','stagebox');
    var r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',x);r.setAttribute('y',midY-30);
    r.setAttribute('width',bw);r.setAttribute('height',60);
    r.setAttribute('fill','#FFFFFF');r.setAttribute('stroke',dom.color);
    r.setAttribute('stroke-width','1.5');g.appendChild(r);
    svg.appendChild(g);
    var tn=T(x+10,midY-11,dom.stage,dom.color,12,null,'b');
    var name=T(x+bw/2,midY+9,dom.name,'#1B2733',14,'middle','b');
    g.appendChild(r);
    g.addEventListener('click',function(){showDomain(dom);});
    tn.style.pointerEvents='none';name.style.pointerEvents='none';
    var above=(i%2===0);
    var noteY=above?midY-52:midY+52;
    dom.note.split('\n').forEach(function(line,li){
      T(x+bw/2,noteY+(above?-14:14)*(dom.note.split('\n').length-1-li)*(above?1:-1)+(above?0:0)+(li*(above?0:0)),
        '', '#5B6B7A');});
    // simpler: draw each line stacked
    var lines=dom.note.split('\n');
    lines.forEach(function(line,li){
      var y=above?(midY-64+li*15):(midY+52+li*15);
      T(x+bw/2,y,line,'#5B6B7A',11,'middle');});
    var tie=document.createElementNS('http://www.w3.org/2000/svg','line');
    tie.setAttribute('x1',x+bw/2);tie.setAttribute('x2',x+bw/2);
    tie.setAttribute('y1',above?midY-48:midY+30);
    tie.setAttribute('y2',above?midY-30:midY+38);
    tie.setAttribute('stroke','#D8DEE4');svg.appendChild(tie);
  });
  var defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML='<marker id="arr" markerWidth="8" markerHeight="8" '+
    'refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" '+
    'fill="#5B6B7A"/></marker>';
  svg.appendChild(defs);
  rails.forEach(function(dom,ri){
    var y=196+ri*64;
    stages.forEach(function(s,i){
      var x=IN+i*(bw+gap)+bw/2;
      var tie=document.createElementNS('http://www.w3.org/2000/svg','line');
      tie.setAttribute('x1',x);tie.setAttribute('x2',x);
      tie.setAttribute('y1',midY+30+(ri===0?8:0));tie.setAttribute('y2',y);
      tie.setAttribute('stroke',dom.color);
      tie.setAttribute('stroke-opacity','0.18');svg.appendChild(tie);});
    var g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','rail');
    var r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',IN);r.setAttribute('y',y);
    r.setAttribute('width',W-IN-OUT);r.setAttribute('height',44);
    r.setAttribute('fill','#FFFFFF');r.setAttribute('stroke',dom.color);
    r.setAttribute('stroke-width','1.5');g.appendChild(r);svg.appendChild(g);
    var nm=T(IN+12,y+19,dom.name,dom.color,13,null,'b');
    var nt=T(IN+12,y+35,dom.note,'#5B6B7A',11);
    nm.style.pointerEvents='none';nt.style.pointerEvents='none';
    g.addEventListener('click',function(){showDomain(dom);});
  });
  box.appendChild(svg);
  narHub(box);
}
buildHub();showHub();
</script>
</body></html>
