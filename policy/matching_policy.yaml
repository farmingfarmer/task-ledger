# Reconciliation matching policy — machine-readable config.
# Loaded by the reconciliation engine; every constant the engine uses lives here,
# never in code. Threshold values below are STARTING POINTS for
# text-embedding-3-large cosine similarity; they must be recalibrated per
# embedding model and then continuously from DecisionRecords (see MATCHING_POLICY.md §5).

embedding:
  model: "text-embedding-3-large"
  signal_text: "title + '\n' + description"   # what gets embedded for a signal
  task_alias_max: 12                            # task matched against max-sim over alias set
  alias_source: "accepted signal titles + canonical title + description"

candidate_generation:
  # Blocking: filters applied BEFORE any embedding comparison.
  blocking:
    owner_scope: "owner_candidates intersect task.owner_or_watchers, plus unowned tasks"
    include_terminal_tasks_days: 14   # completed/cancelled tasks stay matchable this long
                                      # (prevents re-creating a task that just closed;
                                      # a match here yields a conflict-flagged reopen, not a create)
    recency_boost_days: 30            # tasks with activity in this window rank first on ties
    max_candidates_to_embed: 200
  top_k_to_judge: 3

thresholds:
  auto_link: 0.90        # >= : link signal to task directly, no judge
  judge_floor: 0.62      # [judge_floor, auto_link) : send top-k to LLM judge
                         # <  judge_floor for ALL candidates : new-task path, record match_note
  judge_accept_min: 0.75 # judge confidence required to act on a same_task verdict
  # The top of the judge band, where the judge's failures go to a person
  # instead of to a permanent hold. Measured on a real corpus with
  # nomic-embed-text:
  #
  #   0.944  "Synth kit project capability"        ~ "Synth kit project"
  #   0.913  "Add New Baseline Tests to Synth Kit" ~ "Add new tests to synth kit"
  #   0.862  "Smart problem list proof of concept" ~ "Smart problem list"
  #   0.708  "Add New Baseline Tests to Synth Kit" ~ "Synth kit project"   <- different work
  #
  # Real paraphrases of the same work sit at 0.86+; related-but-different
  # work sits well under 0.75. A CPU-local judge declined the top pairs
  # again and again, and a declined judge meant the signal was held forever
  # -- progress on tracked work, permanently invisible, at 0.94 similarity.
  # So above this floor a failed judge produces a PROPOSAL that says it was
  # matched on wording alone, and the reviewer rules. Rejecting it is the
  # 'Matched the wrong task' reason that has existed since the schema was
  # written, and it feeds the same calibration numbers. Cross-owner
  # matches are excluded -- touching someone else's board stays behind
  # the judge whatever the similarity. Closures may ASK (the card goes to
  # the owner, and the closure gate still demands the speaker be the
  # owner or the claim corroborated) but still never auto-link: an ask
  # closes nothing, a person does. Measured on the real corpus, "I
  # completed it" claims about the speaker's own tracked work landed at
  # 0.80-0.84 -- the most valuable sentences the system hears were the
  # ones the first version of this floor refused to relay.
  ask_floor: 0.80
  short_title_penalty:
    max_tokens: 4        # signals whose EMBEDDED TEXT (title + description)
                         # is this short...
    penalty: 0.07        # ...have this subtracted from raw similarity (generic
                         # titles over-match). Measured on the embedded text,
                         # not the title alone: a signal carrying a description
                         # is not a generic short title, and charging it the
                         # penalty anyway pushed real matches under judge_floor
                         # -- which is no judge call at all, and for a blocker
                         # that means discarded rather than held.
  auto_link_guards:
    never_auto_link_types: ["completion_claim", "cancellation"]  # always judged
    never_auto_link_cross_owner: true    # owner mismatch forces judge regardless of similarity
  merge_scan:            # periodic task<->task dedup (same judge, pairwise)
    cadence_hours: 24
    pair_floor: 0.80
    propose_merge_min_judge_conf: 0.85

corroboration:
  window_days: 7                # uncorroborated strict signals wait this long, then expire
  independent_source_min: 2     # "independent" = different evidence resource_ids AND
                                # different speakers/authors

# Per-signal-type op gates.
# Fields:
#   min_conf         — extraction confidence floor to consider the signal at all
#   emits            — op the signal may propose when all gates pass
#   gates            — additional conditions; ALL must hold
#   downgrade        — what happens when gates fail (never silently escalate)
signal_rules:

  task_mention:
    min_conf: 0.55
    emits: null                 # a bare mention never proposes an op by itself
    on_match: "append signal title to task alias set (applied on sight)"
    on_no_match: "record a candidate sighting; see candidate_promotion"
    downgrade: "discard"

  proposal:
    min_conf: 0.60
    emits: create_task          # status=proposed
    gates:
      - "no candidate >= judge_floor survived judging (else it's a mention of existing work)"
      - "owner_candidate for the reviewing user exists OR signal came from a channel the user owns tasks in"
    downgrade: "IMPLEMENTED as: pool to the signal's author (the person who
      said it), never to the window's participants. The original wording here
      said 'team-level proposals pool, not any individual's packet' and the
      store did the opposite -- it fanned unowned claims out to everyone in
      the conversation, so one sentence became a proposal on ten boards and
      nine people rejected it as not theirs (15 of 22 wrong_owner rejections
      on the first live run). Routing to the author is the smallest change
      that honours the intent: exactly one person, and the one who spoke.
      A real team-level pool is still the better endpoint and remains open
      work -- it needs a queue that belongs to no individual, which the
      schema does not yet have. See extraction/signal_store_pg.py."

  assignment:
    # Attribution note: when the model returns NO owner candidates and the
    # cited sentence is a speaker committing themselves ("I'll take it",
    # or the elided "[I] would also like to start on X"), the extraction
    # worker attributes the signal to the speaker with basis
    # self_reference and confidence 0.75 -- below anything the model
    # reports, because it is an inference from sentence shape. It fires
    # only on unambiguous self-commitment: questions, group proposals
    # ("can we", "let's") and opinions ("I think") leave the signal
    # unowned, which is the right answer 15 times out of 22 on real data.
    # See _self_commitment_owner in extraction/extraction_worker.py.
    min_conf: 0.65
    emits: reassign             # or sets owner on create/unowned task
    gates:
      - "basis == explicit_assignment  -> may propose reassign on owned task"
      - "basis == self_reference       -> may claim UNOWNED task only; owned task -> conflict(competing_owner)"
      - "basis == inferred             -> NEVER proposes; annotate owner_candidates only"
    downgrade: "annotation only"

  status_update:
    min_conf: 0.60
    emits: update_status
    gates:
      - "state transition is forward or lateral (proposed->in_progress, in_progress->blocked, ...)"
      - "regressions (completed->in_progress, cancelled->*) allowed only with conflict flag set"
    downgrade: "hold for corroboration"

  deadline_signal:
    min_conf: 0.60
    emits: update_deadline
    gates:
      - "deadline.precision != vague"
      - "resolved date differs from current board deadline"
      - "if speaker is not the task owner: conflict(competing_owner) unless speaker is explicit assigner"
    downgrade: "precision==vague -> annotate task with raw_text, propose nothing"

  blocker:
    min_conf: 0.60
    emits: add_blocker
    gates:
      - "matched task is not terminal"
    enrichment: "attempt blocking_task_id resolution via same matching pipeline over blocker.description"
    downgrade: "discard"

  blocker_resolved:
    min_conf: 0.65
    emits: resolve_blocker
    gates:
      - "judge must match the utterance to a specific open blocker_id on the task"
    downgrade: "hold for corroboration"

  completion_claim:
    min_conf: 0.75
    emits: complete_task
    gates:
      - "match is auto_link OR judge same_task with conf >= 0.85 (strictest match bar of any type)"
      - "speaker is task owner with basis in [self_reference, explicit] -> single signal suffices"
      - "speaker is NOT owner -> require corroboration (independent_source_min) within window_days"
      - "task age > 1 day OR task was created from same meeting (blocks 'done' echo on brand-new tasks)"
    downgrade: "third-party single-source claim -> hold pending corroboration; if window expires, annotate task ('completion reported by X on DATE, unconfirmed') and propose nothing"

  cancellation:
    min_conf: 0.75
    emits: cancel_task
    gates:
      - "same match bar as completion_claim"
      - "speaker is owner or explicit assigner; anyone else -> hold for corroboration"
    downgrade: "hold pending corroboration"

aggregation:
  # Multiple signals, same task, same packet window:
  same_op_combine: "noisy_or"        # 1 - prod(1 - conf_i), capped
  noisy_or_cap: 0.97
  conflicting_ops: "emit highest-confidence proposal; attach others as competing evidence; set conflict flag if sources are independent"

  packet_local_create_dedup:
    # Same new work, described twice in one packet window — a vague
    # restatement and a specific description, both proposed on the first live
    # run. Creates carry no target_task_id, so the exact-payload aggregation
    # key can never join them: dedup on title similarity BEFORE aggregation,
    # or the human answers the same card twice.
    #
    # Bands, not a single floor. Measured on nomic-embed-text, that live pair
    # scored 0.805 while "deploy drift monitor to staging" vs "...to
    # production" — genuinely different work — scores 0.887. Similarity alone
    # cannot separate them, so the gray band goes to the same merge judge the
    # periodic task<->task scan uses, and merges only on same_task.
    auto_merge: 0.93          # >= : near-verbatim restatement; merge, no judge
    judge_floor: 0.78         # [judge_floor, auto_merge): ask the merge judge
    judge_accept_min: 0.85    # same bar as merge_scan; below it, keep both
    no_judge_behavior: "keep both proposals"   # offline ticks fail OPEN: two
                                               # cards is noise, a wrong merge
                                               # hides work the human never sees
    survivor: "highest-confidence proposal; absorbs the other's evidence, signal lineage, and any field it left empty"

cross_board_duplicate_check:
  # Creates from UNOWNED signals (an unassigned "someone should do this")
  # are checked against every board, not just the reviewing user's:
  # the work is often already on a colleague's board. The match is appended to
  # the rationale and nothing else — never an auto-reject, never a suppressed
  # proposal. The reviewer is the one who knows whether it is the same work.
  title_similarity: 0.80
  applies_to: "create_task proposals whose payload owner_ref is null"
  action: "append 'similar task exists on <ref>'s board' to the rationale"

per_op_confidence_floor:
  # Final proposal confidence required to appear on a review card at all.
  create_task: 0.60
  add_subtask: 0.60
  update_status: 0.60
  update_deadline: 0.65
  reassign: 0.70
  add_blocker: 0.60
  resolve_blocker: 0.65
  complete_task: 0.80
  cancel_task: 0.80
  merge_tasks: 0.85

calibration:
  source: "DecisionRecords"
  cadence_days: 7
  method: "threshold sweep on labeled accept/reject outcomes"
  precision_targets:      # tune thresholds to hit these; recall is secondary because
    create_task: 0.70     # missed items resurface in later windows, but bad proposals
    update_status: 0.75   # burn user trust immediately
    update_deadline: 0.75
    complete_task: 0.90
    cancel_task: 0.90
    merge_tasks: 0.90
    reassign: 0.85
  drift_alarm: "weekly acceptance rate for any op drops > 15 points from trailing 4-week mean"

# Work referenced in conversation that is on nobody's board.
#
# A mention used to be discarded when it matched nothing -- 87 of 134 signals
# on the first real corpus, every one of them a reference to work the ledger
# had never been told about. But a mention is genuinely not a task: one
# passing "we should look at the retention sweep" is noise, and a card per
# mention makes the queue useless, which is why it was dropped in the first
# place.
#
# So corroboration decides, on the same standard the closure gates use:
# distinct SPEAKERS, not distinct sightings. One person repeating themselves
# across four meetings is one person's opinion. Two people inside a fortnight
# is a thing the team keeps returning to and nobody has written down.
#
# Promotion produces a PROPOSAL. It never writes a board fact -- the human
# decision stays exactly where it was.
# The one place the human gate opens, and it is deliberately hard to widen.
#
# Confirming "yes, I did say I started that" about your own task, in your
# own words, is friction with no judgement in it -- and friction is what
# makes a review queue go unread, which costs more than the thing it
# protects against. So a narrow class applies itself and says so.
#
# OFF by default. Turning it on is a decision somebody makes on purpose,
# and every event it produces is actor_type='auto_applied' forever, so the
# board can always be asked how much of it nobody approved.
#
# Every condition below is load-bearing:
#   update_status only  — never create (invents work), never complete or
#                         cancel (closes it), never reassign (moves someone
#                         else's). Those all need a person.
#   owner_is_speaker    — your own words about your own task. A colleague
#                         reporting your progress is exactly the case the
#                         corroboration gates exist for.
#   own_board           — the task sits on the speaker's board, so nobody
#                         else's ledger moves without them.
#   forward_only        — proposed -> in_progress -> blocked. A regression
#                         is a conflict and conflicts want eyes.
#   auto_link_only      — the match was above auto_link, not a judge
#                         verdict. If the matcher needed an LLM to decide
#                         WHICH task this was, it does not get to move it.
auto_apply:
  enabled: false
  ops: ["update_status"]
  min_confidence: 0.85
  require:
    - owner_is_speaker
    - own_board
    - forward_only
    - auto_link_only
  undo_window_days: 7     # how long the poke keeps offering to revert it

# =========================================================================
# NOT WORK. Titles that are assertions ABOUT work rather than work itself.
#
# The extractor is deliberately generous: it would rather hand over a
# sentence that turns out to be nothing than drop one that mattered, and
# the gates downstream are what decide. That worked while an unmatched
# signal was simply discarded. Now that every signal type registers a
# candidate, generosity accumulates -- and a live board grew rows reading
# "No blockers", "this sprint" and "They did what?", each with its own line
# and its own timeline, none of them anything anybody could do.
#
# "No blockers" is the clearest case and it is not a small one. It is a
# real and useful FACT -- on that date, that person had nothing blocked --
# and the ledger has somewhere to put facts about tasks. What it is not is
# a task, and turning it into one puts the negation of work on the board as
# work.
#
# Matched case-insensitively against the title, and dropped with reason
# 'not_work' so the count is visible rather than silent. Deliberately short
# and dull: every pattern here is a phrase observed on a real corpus, not a
# guess about language, because a clever filter that drops one real task
# costs more than every fragment it saves.
not_work:
  patterns:
    - '^no\b'                                  # No blockers / No work on X
    - '^nothing\b'
    - '^not\b'                                 # Not adding new tests to X
    - '\?\s*$'                                 # They did what?
    - '^(this|next|last)\s+(sprint|week|month|meeting)\s*$'
    - '^ad hoc topics?\s*$'

  # A subset of the above that is not merely noise. "No blockers" asserts
  # something true and useful about a person's work on a date, and throwing
  # it away silently was the wrong half of the right decision: it is not a
  # task, and it is not nothing. Still dropped from every gate like the
  # rest -- nothing here reaches a board -- but reported, because "what is
  # blocked?" is a better answer when "nothing, and here is who said so and
  # when" is one of the answers it can give.
  attests_no_blockers:
    - '^no\s+blockers?\b'
    - '^no\s+blocking\b'
    - '\bnothing\s+(is\s+)?block(ed|ing)\b'

candidate_promotion:
  # Corroboration has two shapes, and requiring BOTH was the mistake. On
  # the first real corpus 92 candidates registered and 4 promoted, because
  # two-distinct-speakers was the only route -- and a status round-robin
  # does not produce it. The person who mentions something four times is
  # almost always the one who owns it.
  #
  #   BREADTH      two people raised it     -> not one person's hobbyhorse
  #   PERSISTENCE  it came up twice         -> not a passing remark
  #
  # Either is evidence that work is real and untracked, so 'any' takes
  # either. The cost is visible and worth naming: meeting furniture recurs
  # too, so "review tasks" and "ad hoc topics" will promote and want
  # rejecting. Two seconds each, recorded with a reason, and cheaper than
  # never being asked about the work underneath them.
  #
  # WHY PERSISTENCE IS 2 AND NOT 3. Measured, not guessed. Two independent
  # real corpora were counted, and neither has a single candidate above two
  # sightings:
  #
  #   ledger A   83 standing candidates   73 at 1 sighting, 10 at 2
  #   ledger B   16 standing candidates   max 4, one candidate
  #
  # and breadth is worse than rare, it is close to structural: a mention
  # routes to its owner, and the extractor's self-commitment rule makes
  # owner and speaker the same person whenever anybody discusses their own
  # work -- 27 of 28 sightings on ledger B. So min_distinct_speakers 2 is
  # very nearly unreachable, which left persistence carrying the register
  # alone with a bar that nothing on either corpus could clear. A bar no
  # observed data can reach is not a strict policy, it is an off switch.
  #
  # Two is a real loosening and worth saying plainly: "somebody said this
  # twice" is a weaker claim than "three times", and more furniture will
  # reach the queue because of it. That is the trade being made on purpose
  # -- rejections are two seconds and are recorded with a reason, so if the
  # promoted set turns out to be mostly noise the calibration numbers will
  # say so and this goes back to 3 with evidence behind it either way.
  mode: any                 # 'any' = either bar promotes; 'all' = both must
  min_sightings: 2          # persistence
  min_distinct_speakers: 2  # breadth
  window_days: 14
  # Similarity at which a new mention is the same candidate as one already
  # registered rather than a new one. Deliberately the judge_floor: below
  # this the reconciler would not even ask about two tasks, so it should not
  # silently merge two candidates either.
  same_candidate_floor: 0.62
